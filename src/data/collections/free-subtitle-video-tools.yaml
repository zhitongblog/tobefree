title:
  zh: "免费字幕制作与视频处理工具"
  en: "Free Subtitle and Video Processing Tools"
description:
  zh: "六款免费的字幕编辑、封装、无损剪切、转码与调色工具，处理完的文件没有水印、不限时长、不限导出次数。"
  en: "Six free tools for subtitle editing, muxing, lossless cutting, transcoding and colour grading — output with no watermark, no length cap and no export limit."
intro:
  zh: "视频处理里有一批工作不需要打开剪辑软件：给片子配字幕、把三条音轨和两条字幕装进一个文件、掐掉开头三十秒、把一个 8 GB 的 MOV 压成能发出去的 MP4。用完整剪辑软件做这些事要先导入再导出，重新编码一遍，画质掉一次、时间花几十分钟。这份清单里的工具各自只做其中一段，多数不重新编码，秒级完成。按流程分四段：做字幕、封装、剪切、转码，最后放一个真剪辑软件收尾。"
  en: "A lot of video work does not need an editing suite: adding subtitles, packing three audio tracks and two subtitle tracks into one file, cutting the first thirty seconds, squeezing an 8 GB MOV into a sendable MP4. Doing those in a full editor means import, re-encode and export — one generation of quality lost and tens of minutes spent. Each tool here handles one stage, mostly without re-encoding, in seconds. The list runs through subtitling, muxing, cutting and transcoding, with a real editor at the end."
criteria:
  zh:
    - "输出不带水印，不限制时长和导出次数。"
    - "不需要注册账号，不要求把视频上传到服务器。"
    - "能不重新编码的操作就不重新编码，避免画质损失。"
    - "支持常见容器和编码格式，不锁定专有格式。"
  en:
    - "Output carries no watermark and has no length or export limits."
    - "No account required and no upload of your video to a server."
    - "Operations avoid re-encoding wherever possible, so no generation of quality is lost."
    - "Common containers and codecs are supported, with no proprietary lock-in."
tools: [subtitle-edit, mkvtoolnix, losslesscut, handbrake, ffmpeg, davinci-resolve]
skills: []
