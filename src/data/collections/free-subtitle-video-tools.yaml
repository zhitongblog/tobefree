added: '2026-09-18'
faq:
  zh:
    - q: "做字幕、对时间轴用哪个？"
      a: "Subtitle Edit。波形图上直接拖时间轴，支持两百多种字幕格式互转，能自动检测时间轴错位、修复重叠、批量调整偏移。要从头听写的话它可以接本地 Whisper 模型先出一版初稿再手工校对——目录里的 whisper.cpp、Faster-Whisper 都能接。"
    - q: "想把字幕和多条音轨装进一个文件？"
      a: "MKVToolNix。它做的是封装而不是编码，把已有的视频流、音频流、字幕流重新装进一个 MKV 容器，几秒钟完成，画质零损失。一部电影配国语和原声两条音轨、中英两条字幕，播放时随时切换，就是这么来的。"
    - q: "只想掐掉开头结尾，不想重新压？"
      a: "LosslessCut。在关键帧上直接切，几百兆的视频一两秒切完，画质完全不变。代价是切点只能落在关键帧上，精度到不了逐帧，要精确到帧得用真正的剪辑软件。"
    - q: "HandBrake 和 FFmpeg 怎么分工？"
      a: "同一件事的两种界面。HandBrake 有图形界面和预置档，选一个「快速 1080p30」就能开始压，适合偶尔转一次格式的人。FFmpeg 是命令行，参数全开，适合要批量处理或者要精确控制码率、编码器、滤镜的场景。HandBrake 底层用的也是 FFmpeg 那套编解码库。"
    - q: "要真正剪片子呢？"
      a: "DaVinci Resolve。免费版没有水印、不限时长、可以商用，调色能力是行业标准，剪辑、音频、特效、字幕都在一个软件里。限制是免费版不支持部分硬件加速编码和一些高级降噪功能，这些在 Studio 付费版里。对绝大多数人来说免费版就是完整的剪辑软件。"
  en:
    - q: "What should I make and time subtitles with?"
      a: "Subtitle Edit. Drag timings directly on the waveform, convert among two hundred-plus subtitle formats, detect misaligned timing, fix overlaps and shift offsets in bulk. To start from nothing it can call a local Whisper model for a first pass before manual correction — whisper.cpp and Faster-Whisper in this directory both work."
    - q: "How do I pack subtitles and several audio tracks into one file?"
      a: "MKVToolNix. It muxes rather than encodes, repacking existing video, audio and subtitle streams into one MKV in seconds with zero quality loss. A film carrying both a dubbed and an original audio track plus two subtitle languages, switchable during playback, is made this way."
    - q: "I only want to trim the start and end."
      a: "LosslessCut. It cuts on keyframes directly, so a few hundred megabytes take a second or two and the picture is untouched. The trade is that cuts land on keyframes rather than exact frames; frame accuracy needs a real editor."
    - q: "HandBrake or FFmpeg?"
      a: "Two interfaces onto the same job. HandBrake has a GUI and presets, so picking \"Fast 1080p30\" starts the encode, which suits occasional conversions. FFmpeg is the command line with every parameter exposed, for batch work or precise control over bitrate, encoder and filters. HandBrake uses the same FFmpeg codec libraries underneath."
    - q: "And for actually editing?"
      a: "DaVinci Resolve. The free version has no watermark, no duration limit and permits commercial use, its colour grading is an industry standard, and editing, audio, effects and titles live in one application. The limits are some hardware-accelerated encoders and advanced noise reduction, which sit in the paid Studio version. For most people the free build is a complete editor."
