title:
  zh: "iPhone 免费无广告 App 推荐"
  en: "Free Ad-Free iPhone Apps"
description:
  zh: "十四款 iPhone 上的免费无广告 App，覆盖浏览器、通讯、密码与两步验证、传文件、播放器、离线地图、笔记、照片备份、影音串流和证件照。"
  en: "Fourteen free, ad-free iPhone apps covering browsing, messaging, passwords and two-factor codes, file transfer, media playback, offline maps, notes, photo backup, streaming and ID photos."
intro:
  zh: "App Store 审核管得住恶意代码，管不住收费套路。标着「免费」的 App，打开先弹订阅页，关闭按钮做得很小，试用期结束自动按周扣费；证件照、习惯打卡这几类尤其常见。这份清单只收核心功能不花钱、没有广告的 iPhone App，大多是开源项目，安卓和桌面端也有对应版本，换设备不用重新找。部分 App 需要自己有一台服务器或电脑配合，会在问答里说明。"
  en: "App Store review catches malicious code but not billing tricks. An app labelled \"free\" opens on a subscription screen with a tiny close button, and the trial rolls into a weekly charge; ID photos and habit tracking are the usual suspects. This list covers only iPhone apps whose core features cost nothing and show no ads. Most are open-source projects with Android and desktop versions too, so switching devices does not mean starting over. A few need your own server or computer on the other end, which the FAQ explains."
criteria:
  zh:
    - "核心功能免费，没有订阅弹窗，没有「去广告」内购。"
    - "App Store 里是作者本人上架的官方版本。"
    - "优先选择开源、在安卓和桌面端也有版本的项目。"
    - "需要账号或需要自建服务端的，逐款说明。"
  en:
    - "Core features are free, with no subscription pop-up and no in-app purchase to remove ads."
    - "The App Store listing is the developer's own official build."
    - "Open-source projects with Android and desktop versions are preferred."
    - "Where an account or a self-hosted server is needed, it is stated."
