faq:
  zh:
    - q: NewPipe、Tubular 和 LibreTube 这三款安卓无广告客户端有什么区别？
      a: NewPipe 是最稳定经典的原版；Tubular 是 NewPipe 的增强分支，在完全兼容的基础上加上了「SponsorBlock 自动跳过视频内恰饭口播」和点踩数显示；LibreTube 则采用更现代的 Material You 界面，并默认通过 Piped 隐私代理服务器中转流量，隐藏你的真实 IP。
    - q: 在电脑（Windows / macOS / Linux）上想无广告看视频用哪款最好？
      a: 如果你只看 YouTube，推荐纯本地隐私客户端 FreeTube；如果你同时看 YouTube、Bilibili、Twitch、Patreon 等多个平台，强烈推荐 FUTO 出品的聚合播放器 Grayjay。
  en:
    - q: What is the difference between NewPipe, Tubular, and LibreTube on Android?
      a: NewPipe is the battle-tested original. Tubular is a fork of NewPipe that adds built-in SponsorBlock (skipping in-video sponsor reads) and ReturnYouTubeDislike. LibreTube features a Material You UI and routes streams through Piped proxy servers so your IP address is hidden from Google.
    - q: Which ad-free streaming client is best for Windows, macOS, and Linux desktops?
      a: Use FreeTube for a dedicated, privacy-first desktop YouTube experience, or Grayjay if you want to follow creators across YouTube, Twitch, Bilibili, Patreon, and PeerTube in one unified player.
