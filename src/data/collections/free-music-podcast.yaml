title:
  zh: "免费音乐播放器与播客软件推荐"
  en: "Free Music Players and Podcast Apps"
description:
  zh: "八款免费开源的音乐与音频软件：本地音乐库播放器、自建音乐和有声书服务器、按 RSS 订阅的播客客户端，以及三款什么格式都能放的通用播放器。"
  en: "Eight free and open-source music and audio programs: a local library player, self-hosted music and audiobook servers, an RSS-based podcast client, and three general players that handle any format."
intro:
  zh: "流媒体订阅的曲库是租来的：版权到期的专辑会下架，有的被换成重录版，停止订阅就什么都听不了，听了什么还会变成推荐和画像的数据。播客本来是 RSS 做的，一个订阅地址谁都能读，这些年又被各家平台收进自己的 App 和账号体系。这份清单给的是另一条路：音乐是你硬盘上的文件，播客按 RSS 直接订阅。分三类：本地播放、自建服务器、播客与有声书。这些工具都不提供内容，只管理和播放你已经有的文件。"
  en: "A streaming catalogue is rented: albums disappear when licences lapse, some get replaced with re-recordings, everything stops when the subscription does, and what you listen to becomes data for recommendations and profiling. Podcasts were built on RSS, where anyone can read a feed, yet over the years platforms have pulled them into their own apps and account systems. This list takes the other route: music as files on your own disk, podcasts subscribed to directly by RSS. It falls into three groups — local playback, self-hosted servers, and podcasts and audiobooks. None of these tools supply content; they manage and play files you already have."
criteria:
  zh:
    - "开源免费，没有广告，没有付费会员档位。"
    - "播放的是你自己的文件或 RSS 源，不绑定任何流媒体账号。"
    - "收听记录和进度存在本机或你自己的服务器上，不回传给第三方。"
    - "订阅和音乐库能导出，比如播客的 OPML，换软件不丢东西。"
  en:
    - "Open source and free, with no ads and no paid membership tier."
    - "Plays your own files or RSS feeds, tied to no streaming account."
    - "Listening history and progress stay on your device or your own server, not sent to third parties."
    - "Subscriptions and libraries export — OPML for podcasts, for example — so switching loses nothing."
tools: [strawberry, navidrome, jellyfin, audiobookshelf, antennapod, vlc, mpv, kodi]
skills: []
