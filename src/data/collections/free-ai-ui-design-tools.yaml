added: '2026-11-08'
faq:
  zh:
    - q: OpenPencil 和 Penpot 这两款开源 Figma 平替该怎么选？
      a: 如果你是开发者或重度使用 AI 编程助手（如 Claude Code、Cursor），首选 OpenPencil —— 它底层直接把画布存为可 Git Diff 的代码节点树，且内置双向读写 MCP；如果是传统设计师团队与产品经理多人协作画图，首选成熟的自托管平台 Penpot。
    - q: 怎么让 AI 写出来的网页不再有浓浓的「AI 模板味」？
      a: 在项目中安装 Impeccable（pbakaus/impeccable）和 Hallmark（Nutlope/hallmark）这两个开源技能。它们会为 Agent 设定严格的字体层级、留白节奏、材质配色和反模式门禁，从源头拦截廉价的模板套用。
  en:
    - q: Should I choose OpenPencil or Penpot as a free Figma alternative?
      a: Choose OpenPencil if you are a developer or use AI coding agents heavily—it stores designs as diffable code trees and includes a built-in read/write MCP server. Choose Penpot if you want a full-featured, web-based collaborative design platform for traditional design teams.
    - q: How do I stop Claude Code or Cursor from generating generic "AI slop" UIs?
      a: Install the Impeccable and Hallmark agent skills. Together they enforce strict typography scales, tactile color palettes, layout archetypes, and anti-pattern checks before your agent writes CSS or JSX.
