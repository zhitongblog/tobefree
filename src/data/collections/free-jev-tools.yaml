title:
  zh: 免费开源 Jev 决策模型工具、本地平替与 MCP 推荐
  en: Free Open-Source Jev Decision Model Tools, Local Alternatives & MCPs
description:
  zh: 精选围绕 Jev（System 1 类型化决策模型）的开源本地平替模型、极速浏览器 Agent、语义命令行工具、MCP 服务与实战技能。
  en: Curated open-source local alternatives, ultrafast browser agents, semantic CLI utilities, MCP servers and agent skills built around Jev System 1 typed decision models.
intro:
  zh: Jev 代表了大模型应用的一次重要分流：不再让笨重的聊天模型（System 2）逐个 Token 写废话，而是把程序状态和结构化问题（单选、多选、打分、布尔判断）交给百毫秒级的「System 1（系统一）」决策模型。虽然 TypeSafe AI 官方 Jev 模型闭源，但开源社区已经迅速构建出可本地离线运行的平替权重（如 Kev、Open-Jev）以及极速浏览器自动化、语义搜索 CLI 和 MCP 服务。这里汇总所有真正免费、开源、无广告的 Jev 生态核心工具。
  en: 'Jev marks a major split in AI engineering: instead of asking a slow, chatty System 2 LLM to stream tokens for simple routing or classification, you pass program state and typed questions (select, score, boolean) to a sub-100ms System 1 decision model. While TypeSafe AI’s hosted weights are proprietary, the open-source community has built local open-weight alternatives (Kev, Open-Jev), ultrafast browser agents, Unix CLIs and MCP servers. Everything listed here is free, open source and ad-free.'
criteria:
  zh:
    - 开源协议明确（MIT / Apache-2.0），代码可在 GitHub 审计。
    - 本地模型支持完全离线推理，无需注册账号。
    - CLI、Agent 与 MCP 工具零广告、零捆绑，支持对接官方 Jev 或本地兼容端点。
  en:
    - Open-source licensed (MIT / Apache-2.0) with auditable repositories.
    - Local model families run completely offline without mandatory sign-up.
    - CLIs, agents and MCP servers are free of ads, tracking and vendor lock-in.
tools:
