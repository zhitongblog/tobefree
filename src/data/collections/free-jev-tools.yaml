featured: true
added: '2026-11-03'
faq:
  zh:
    - q: 什么是 Jev？它和普通大模型（如 GPT、Claude、Qwen）有什么区别？
      a: 普通聊天大模型是「生成式（System 2）」，擅长写文章、写代码，但哪怕做个简单的二选一分类也要逐 Token 生成，延迟动辄几秒；Jev 是「类型化决策模型（System 1）」，不生成自由文本，只对给定的结构化问题（布尔、单选、多选、打分）在一次前向传播（50~100ms）内直接输出强类型结果和校准概率。
    - q: 不想调云端付费 API，怎么在本地免费跑 Jev？
      a: 首选 Jared Palmer 开源的 Kev（基于 Qwen 架构微调的指针头决策模型）或社区复现的 Open-Jev。它们完全开源，可以在本机显卡或 Mac 统一内存上离线运行，且接口契约兼容 TypeSafe SDK。
  en:
    - q: What is Jev and how does it differ from chat LLMs like GPT or Claude?
      a: 'Chat LLMs are generative System 2 models: great at writing prose or code, but slow and expensive when you just need a routing decision or classification. Jev is a System 1 typed decision model that skips token generation and returns constrained choices and calibrated probabilities in 50–100ms.'
    - q: How can I run Jev locally for free without paying for a cloud API?
      a: Use Kev (by Jared Palmer) or Open-Jev. Both provide open weights and training code that replicate the System 1 decision interface on your own GPU or Apple Silicon Mac.
