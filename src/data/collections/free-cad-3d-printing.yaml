faq:
  zh:
    - q: "想做能 3D 打印的零件，从哪个开始？"
      a: "FreeCAD。参数化建模，改一个尺寸整个模型跟着更新，这是做机械零件的基本工作方式，也是 Fusion 360 那套逻辑。直接导出 STL 给切片软件。如果你是程序员，OpenSCAD 可能更顺手——模型是代码写出来的，可以写循环、用变量、进 Git 做版本控制。"
    - q: "OrcaSlicer 和 PrusaSlicer 怎么选？"
      a: "同源，OrcaSlicer 是从 PrusaSlicer 分支出来的。PrusaSlicer 更稳，对 Prusa 自家机器调校最好；OrcaSlicer 更新快，内置了更多第三方打印机的配置文件，多了自动流量校准、压力提前测试这类校准工具。用 Bambu、Creality 这些机器的人多数选 OrcaSlicer。"
    - q: "画平面图和做室内设计用什么？"
      a: "二维工程图用 LibreCAD，界面和操作逻辑接近传统 AutoCAD，画平面图纸够用，读写 DXF。做家装布置用 Sweet Home 3D——拖家具进平面图，同时生成 3D 效果，不需要任何建模基础。"
    - q: "SolveSpace 和 FreeCAD 重复吗？"
      a: "不重复。SolveSpace 体积小得多，核心是约束求解，适合做机构运动分析和简单零件，打开快、不臃肿。FreeCAD 功能面宽得多，工作台涵盖零件设计、装配、有限元、CAM。做一个小支架用 SolveSpace 更快，做一整套装配体用 FreeCAD。"
  en:
    - q: "Where do I start if I want to model a printable part?"
      a: "FreeCAD. Parametric modelling means changing one dimension updates the whole model, which is how mechanical parts are made and the same logic as Fusion 360. Export STL straight to a slicer. If you are a programmer, OpenSCAD may suit better — the model is code, so loops, variables and Git version control all apply."
    - q: "OrcaSlicer or PrusaSlicer?"
      a: "Same lineage; OrcaSlicer is a fork of PrusaSlicer. PrusaSlicer is steadier and best tuned for Prusa's own machines. OrcaSlicer moves faster, ships profiles for many more third-party printers, and adds calibration tools such as automatic flow tuning and pressure advance tests. People running Bambu or Creality machines mostly choose OrcaSlicer."
    - q: "What about floor plans and interior design?"
      a: "LibreCAD for 2D technical drawing — its interface and logic sit close to classic AutoCAD, it reads and writes DXF, and it is enough for plan drawings. Sweet Home 3D for home layout: drag furniture onto a plan and get a 3D view alongside, with no modelling background required."
    - q: "Does SolveSpace overlap with FreeCAD?"
      a: "No. SolveSpace is far smaller, built around a constraint solver, suited to mechanism motion analysis and simple parts, and it opens instantly. FreeCAD is much broader, with workbenches for part design, assemblies, finite element analysis and CAM. A small bracket is faster in SolveSpace; a full assembly belongs in FreeCAD."
