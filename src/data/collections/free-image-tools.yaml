title:
  zh: "免费图片压缩、放大与相册管理工具"
  en: "Free Image Compression, Upscaling and Photo Library Tools"
description:
  zh: "六款免费的图片压缩、AI 放大、批量处理、证件照和相册管理工具，全部本机处理，图片一个字节都不上传。"
  en: "Six free tools for image compression, AI upscaling, batch processing, ID photos and photo library management — all local, with not a byte of your images uploaded."
intro:
  zh: "处理图片这件事被在线工具接管得最彻底：压缩、放大、抠图、做证件照，搜出来全是网页版，上传、等待、下载，免费额度用完就要注册或付费。问题不在于要不要花钱，在于你把图交出去之后不知道它去了哪儿 —— 证件照、身份证扫描件、家庭照片，这类东西的上传本身就是个决定。这份清单里的工具全部在本机跑。按用途分四类：压缩、放大、批量处理、相册管理。"
  en: "Image work has been taken over by online tools more completely than anything else: compression, upscaling, background removal, ID photos — search and you get web pages where you upload, wait, download, and hit a sign-up or a paywall once the free allowance runs out. The problem is not the money; it is that once the image is handed over you do not know where it went. For an ID photo, a scan of an identity document or a family picture, uploading is itself a decision. Everything here runs locally. The list sorts four ways — compression, upscaling, batch processing and library management."
criteria:
  zh:
    - "处理在本机完成，图片不上传到任何服务器。"
    - "不限处理张数、不限分辨率、不加水印。"
    - "不需要注册账号。"
    - "支持批量处理的单独标注。"
  en:
    - "Processing happens locally; no image is uploaded anywhere."
    - "No cap on image count or resolution, and no watermark."
    - "No account required."
    - "Batch capability is noted per tool."
tools: [squoosh, upscayl, imagemagick, solopic, freeid-photo, digikam, ente-photos]
skills: []
featured: false
added: '2026-09-18'
faq:
  zh:
    - q: "压图片用哪个？"
      a: "Squoosh。它是网页应用，但压缩全部在浏览器本地完成，图片一个字节都没上传——这一点和那些「在线压缩」网站有本质区别。左右对比拖动条能直接看到画质损失在哪儿，支持 WebP、AVIF 这些现代格式，压缩率比 JPEG 高一截。"
    - q: "老照片模糊，能修吗？"
      a: "Upscayl 可以放大并补细节。它跑的是本地 AI 模型，把小图放大时补出来的是模型推断的细节而不是简单拉伸，对老照片和低分辨率截图效果明显。要说清楚的是补出来的细节是生成的，不是原图里本来就有的，用在需要真实还原的场合要谨慎。"
    - q: "一整个文件夹的图要统一处理？"
      a: "ImageMagick 或 SoloPic。ImageMagick 是命令行工具，批量改尺寸、转格式、加水印、拼图、调色，一条命令处理几千张，几乎所有图像批处理的底层都是它。SoloPic 也是一条命令处理整个文件夹，不用记 ImageMagick 那套参数。"
    - q: "几万张照片怎么管？"
      a: "digiKam。按时间、地点、人脸、标签组织，支持 RAW 格式，有无损编辑和重复照片检测，十万张量级也不卡。全部离线，不上传、不需要账号，和那些要求把相册同步到云端才能用人脸识别的方案是两条路。要多设备同步的话，Ente Photos 走端到端加密，服务器上只有密文，服务方自己也看不到照片；想完全自己掌控服务器，目录里的 Immich 是另一个选择。"
    - q: "证件照非要去照相馆或者用在线工具吗？"
      a: "不用。FreeID Photo 在本机处理，换底色、按各国规格裁切、排版打印，没有水印也没有付费墙。证件照里包含人脸和身份信息，本机处理比传到某个网站上更合适。"
  en:
    - q: "What compresses images?"
      a: "Squoosh. It is a web application, but compression runs entirely in your browser and not a byte is uploaded — a fundamental difference from \"online compression\" sites. A drag divider compares before and after so you can see exactly where quality goes, and modern formats such as WebP and AVIF compress considerably better than JPEG."
    - q: "Can a blurry old photo be fixed?"
      a: "Upscayl enlarges and fills in detail. It runs a local AI model, so enlarging a small image infers detail rather than stretching pixels, which shows clearly on old photographs and low-resolution screenshots. Be clear that the added detail is generated rather than recovered, so use it cautiously where faithfulness matters."
    - q: "A whole folder needs the same treatment."
      a: "ImageMagick or SoloPic. ImageMagick is a command-line tool for bulk resizing, format conversion, watermarking, montage and colour adjustment, handling thousands of files in one command, and it sits underneath most image batch processing anywhere. SoloPic also processes a whole folder in one command without learning ImageMagick's parameter vocabulary."
    - q: "How do I manage tens of thousands of photos?"
      a: "digiKam. Organisation by date, place, face and tag, RAW support, non-destructive editing and duplicate detection, staying responsive into six figures. It is entirely offline with no upload and no account, which is a different path from services that require syncing your library to a cloud before face recognition works. For syncing across devices, Ente Photos is end-to-end encrypted with only ciphertext on the server, unreadable even to the operator; for a server entirely under your control, Immich in this directory is the other option."
    - q: "Do ID photos require a studio or an online tool?"
      a: "No. FreeID Photo processes locally — background replacement, cropping to national specifications, print layout — with no watermark and no paywall. An ID photo contains a face and identity information, which makes local processing the better fit."
