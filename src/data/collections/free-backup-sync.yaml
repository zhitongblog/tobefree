title:
  zh: "免费备份与同步软件推荐"
  en: "Free Backup and Sync Software"
description:
  zh: "八款免费备份、同步与加密工具，覆盖增量备份、多设备同步、云盘搬运、上传前加密和照片备份，存储位置由你决定，不按容量收订阅费。"
  en: "Eight free tools for backup, sync and encryption — incremental backup, multi-device sync, moving data between clouds, encryption before upload and photo backup — with storage wherever you choose and no subscription by capacity."
intro:
  zh: "同步和备份是两回事。同步让几台设备上的文件保持一致，文件被误删、被勒索软件加密，这个结果也会同步到每一台设备上。备份是保存某个时间点的副本，出事后能回到那个时间点。常用的判断标准是 3-2-1：3 份副本，2 种介质，1 份放在异地。异地那份通常是云，这时要在本机加密后再上传，密钥只在自己手里，服务商拿到的只是密文。这份清单按这几步分：Kopia 做定时增量备份，Syncthing 和 Nextcloud 做同步，rclone 把数据搬到各家云存储，Cryptomator 和 VeraCrypt 负责加密，Immich 和 Ente Photos 专管手机照片。"
  en: "Sync and backup are different things. Sync keeps files identical across devices, so when a file is deleted by mistake or encrypted by ransomware, that result is synced to every device too. Backup keeps a copy from a point in time you can return to after something goes wrong. The usual rule is 3-2-1: three copies, on two kinds of media, with one offsite. The offsite copy is usually a cloud, and it should be encrypted on your machine before upload so the key stays with you and the provider holds only ciphertext. The list follows those steps: Kopia for scheduled incremental backup, Syncthing and Nextcloud for sync, rclone for moving data to any cloud storage, Cryptomator and VeraCrypt for encryption, and Immich and Ente Photos for phone photos."
criteria:
  zh:
    - "存储位置由你选择：本地硬盘、NAS、自建服务器或任意云存储。"
    - "支持在本机加密，服务商或中间节点看不到明文。"
    - "不按容量或设备数收订阅费，自建版本功能不设限。"
    - "开源，数据格式可以脱离原厂服务独立恢复。"
  en:
    - "You choose where data lives: a local disk, a NAS, your own server or any cloud storage."
    - "Encryption on your own machine, so providers and relays never see plaintext."
    - "No subscription by capacity or device count, and no feature limits on self-hosted versions."
    - "Open source, with data that can be restored without the original vendor's service."
tools: [kopia, syncthing, rclone, cryptomator, veracrypt, nextcloud, immich, ente-photos]
