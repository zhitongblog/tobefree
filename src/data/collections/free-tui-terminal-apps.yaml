title:
  zh: 免费开源终端 TUI 效率神器推荐：用 Rust 与 Go 打造全键盘工作流
  en: Best Free Open-Source Terminal TUI Apps in Rust & Go for Keyboard Workflows
description:
  zh: 无需离开终端即可可视化管理 Git、Docker、Kubernetes、SQL 数据库、文件系统、网络下载与系统监控的顶级开源 TUI 工具清单。
  en: Manage Git, Docker, Kubernetes, SQL databases, file trees, multi-stream downloads, and system metrics visually inside your terminal with zero GUI bloat.
intro:
  zh: 得益于 Rust（Ratatui）与 Go（Bubble Tea）生态的爆发，现代终端工具早已不再是枯燥的黑白命令行。现在的 TUI（终端用户界面）应用既有媲美图形软件的分栏面板、实时折线图与代码高亮预览，又保持了毫秒级启动、几 MB 内存占用和纯键盘（Vim 键位）操作的极致效率，在本地或远程 SSH 服务器上都能丝滑运行。
  en: Powered by Rust (Ratatui) and Go (Bubble Tea), modern Terminal User Interface (TUI) apps combine visual multi-pane layouts, live charts, and syntax-highlighted previews with sub-millisecond startup times and tiny RAM footprints—working identically on your laptop or over SSH.
criteria:
  zh:
    - 100% 开源免费（MIT / Apache-2.0 / GPL），无广告、无遥测、无需注册账号。
    - 单二进制运行，纯本地离线可用，兼顾全键盘快捷键与鼠标点击支持。
    - 涵盖代码版本控制、容器编排、数据库管理、文件搜索导航与系统监控全链路。
  en:
    - 100% free and open source (MIT / Apache-2.0 / GPL) with zero telemetry, ads, or accounts.
    - Runs offline as a fast native binary supporting both Vim-style keyboard navigation and mouse clicks.
    - Covers Git, Docker, Kubernetes, SQL databases, fuzzy file finding, downloads, and system monitoring.
