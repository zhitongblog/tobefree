faq:
  zh:
    - q: 想搭建一套现代化的全键盘终端工作流，最推荐先装哪几款 TUI？
      a: 最核心的「五大件」是：用 Zellij 做终端多窗格复用、Yazi 做异步文件管理器、Television (tv) 做全局模糊搜索预览、Lazygit 管理代码提交、Bottom (btm) 监控系统进程。这五款全部开源且跨平台支持 Windows、macOS 和 Linux。
    - q: 在远程 SSH 服务器上管理容器和数据库用什么最轻量？
      a: 管理 Docker 容器首选 Lazydocker，管理 Kubernetes 集群首选 K9s，查改 PostgreSQL/MySQL/SQLite 数据库首选 Lazysql。它们都是单文件 Go 程序，考进服务器即可直接运行，无需开启沉重的网页控制台。
  en:
    - q: Which TUI tools should I install first for a modern terminal workflow?
      a: "Start with the core five: Zellij for terminal multiplexing, Yazi for fast file management, Television (tv) for fuzzy searching with previews, Lazygit for Git workflows, and bottom (btm) for system monitoring."
    - q: What are the best lightweight TUI tools for managing containers and databases over SSH?
      a: Use Lazydocker for Docker Compose stacks, K9s for Kubernetes clusters, and Lazysql for inspecting and editing SQL databases—all three compile to single Go binaries with minimal resource usage.
