title:
  zh: "Linux 免费软件推荐"
  en: "Free Linux Software"
description:
  zh: "二十二款 Linux 上的免费软件，覆盖浏览器、邮件、办公、影音、修图剪辑、开发、密码、同步备份和游戏，全部无广告、不订阅。"
  en: "Twenty-two free Linux applications covering browsing, email, office work, media, image and video editing, development, passwords, sync, backup and gaming — all ad-free and subscription-free."
intro:
  zh: "从 Windows 换到 Linux，卡住人的通常是三件事：别人发来的 docx 排版会不会乱、Epic 和 GOG 上买的游戏怎么玩、某个只有 Windows 版的软件还能不能用。前两件有现成答案，ONLYOFFICE 对 Office 格式的还原度在开源套件里数一数二，Heroic 接管 Epic 和 GOG 的游戏库；第三件交给 Bottles，每个 Windows 程序一个独立环境。其余日常软件大多本来就是跨平台的开源项目，在 Linux 上是原生版本。这份清单按用途分六类：上网与邮件、办公、影音与创作、开发、密码与数据、游戏。"
  en: "Moving from Windows to Linux, people usually get stuck on three things: whether a docx someone sends will keep its layout, how to play games bought on Epic and GOG, and whether a Windows-only program will still run. The first two have ready answers — ONLYOFFICE has some of the best Office-format fidelity among open-source suites, and Heroic takes over Epic and GOG libraries. The third goes to Bottles, which gives every Windows program its own isolated environment. Most other everyday software is already cross-platform open source with a native Linux build. This list sorts six ways: web and email, office, media and creative work, development, passwords and data, and gaming."
criteria:
  zh:
    - "有 Linux 原生版本，或者本身就是只为 Linux 做的工具。"
    - "核心功能免费，没有订阅才能解锁的日常能力。"
    - "无广告、不强制注册。"
    - "优先选择开源、长期维护、主流发行版都能装的软件。"
  en:
    - "Has a native Linux build, or is built for Linux specifically."
    - "Core features are free, with no everyday capability behind a subscription."
    - "No ads and no forced registration."
    - "Open source, actively maintained and installable on mainstream distributions are preferred."
