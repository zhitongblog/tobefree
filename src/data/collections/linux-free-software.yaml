faq:
  zh:
    - q: "装 Linux 之前先准备什么？"
      a: "在 Windows 上用 Ventoy 做一个启动盘。U 盘装一次 Ventoy，之后把发行版的 ISO 直接拖进去就能启动，想试几个发行版就放几个 ISO，不用反复格式化。重要文件先用 Kopia 备份一份，它在本地加密去重后再存到硬盘、NAS 或云存储。"
    - q: "Office 文档用 LibreOffice 还是 ONLYOFFICE？"
      a: "经常收发 docx、xlsx、pptx 的选 ONLYOFFICE，界面接近 MS Office，复杂表格和演示打开很少错位。LibreOffice 组件更全，文字、表格、演示之外还有绘图、公式和数据库。两个可以同时装，按文件挑。"
    - q: "Linux 上玩游戏怎么配？"
      a: "Steam 有官方 Linux 客户端，内置 Proton，不需要额外工具。Epic 和 GOG 没有 Linux 客户端，用 Heroic。其他来源的 Windows 游戏和模拟器用 Lutris，社区安装脚本会配好 Wine 版本和依赖。带内核级反作弊的多人游戏大多跑不了，这是反作弊厂商的限制，买之前去 ProtonDB 查一下评级。"
    - q: "手机和 Linux 电脑怎么互通？"
      a: "安卓手机装 KDE Connect，通知、剪贴板、传文件、当触控板都能用，Linux 是它的原生平台。只是传一次文件用 LocalSend，iPhone 也支持。要让两台设备的文件夹一直保持一致，用 Syncthing，不经过任何中央服务器。"
  en:
    - q: "What should I prepare before installing Linux?"
      a: "Make a boot drive with Ventoy on Windows. Install Ventoy to a USB stick once, then drag distribution ISOs straight onto it and boot from them — one ISO per distribution you want to try, with no reformatting. Back up important files with Kopia first; it encrypts and deduplicates locally before storing to a drive, a NAS or cloud storage."
    - q: "LibreOffice or ONLYOFFICE for Office documents?"
      a: "If you exchange docx, xlsx and pptx often, ONLYOFFICE — its interface is close to MS Office and complex spreadsheets and decks rarely shift. LibreOffice has more components, adding drawing, formulas and a database to the word processor, spreadsheet and presentations. Install both and pick per file."
    - q: "How do I set up gaming on Linux?"
      a: "Steam has an official Linux client with Proton built in and needs nothing extra. Epic and GOG have no Linux client, so use Heroic. For Windows games from other sources and for emulators, use Lutris, whose community install scripts set up the right Wine version and dependencies. Multiplayer games with kernel-level anti-cheat mostly do not run — a restriction from the anti-cheat vendors — so check the game's ProtonDB rating before buying."
    - q: "How do I connect a phone to a Linux computer?"
      a: "On Android, install KDE Connect for notifications, shared clipboard, file transfer and using the phone as a touchpad; Linux is its native platform. For a one-off file transfer use LocalSend, which also works on iPhone. To keep a folder identical across two devices continuously, use Syncthing, with no central server involved."
