faq:
  zh:
    - q: "Skill 和 MCP 有什么区别？"
      a: "MCP 服务器给 Agent 接上外部能力，比如读数据库、开浏览器、调 API；技能是一份写给 Agent 的操作手册，教它按什么步骤、用什么脚本完成一类任务。一个管「能做什么」，一个管「怎么做好」。"
    - q: "怎么安装技能？"
      a: "Claude Code 里最省事的是插件市场：先 /plugin marketplace add 仓库名，再 /plugin install 技能名。也可以把技能文件夹直接复制到 ~/.claude/skills/ 或项目的 .claude/skills/ 下。遵循 Agent Skills 开放格式的技能，Codex、Cursor 等客户端也能用。"
    - q: "装很多技能会拖慢 Agent 吗？"
      a: "影响不大。启动时只加载每个技能的名字和一句描述，正文要等任务匹配上才读进来。但技能里的脚本会在你本机执行，装之前还是应该看一眼仓库，只装来源可信的。"
  en:
    - q: "What's the difference between a skill and an MCP server?"
      a: "An MCP server connects outside capabilities to the agent — a database, a browser, an API. A skill is an operating manual written for the agent, telling it which steps and scripts to use for a kind of task. One covers what the agent can do; the other covers how to do it well."
    - q: "How do I install a skill?"
      a: "In Claude Code the easiest route is the plugin marketplace: /plugin marketplace add <repo>, then /plugin install <skill>. You can also copy a skill folder into ~/.claude/skills/ or your project's .claude/skills/. Skills in the open Agent Skills format also work in Codex, Cursor and other clients."
    - q: "Will many installed skills slow the agent down?"
      a: "Barely. At startup only each skill's name and one-line description are loaded; the body is read only when a task matches. Skill scripts do run on your machine, though, so look at the repository first and install only from sources you trust."
