faq:
  zh:
    - q: NocoDB 和 Baserow 哪个更适合用来替代 Airtable 或飞书多维表格？
      a: 如果你已经有现成的 MySQL、PostgreSQL 或 SQLite 数据库，想直接把它变成可视化多维表格，选 NocoDB；如果你是从零新建大表、看重几十万行数据的极致滚动流畅度以及自带无代码门户网站构建器，选 Baserow。
    - q: Activepieces 和 n8n 这两款开源自动化工具该怎么选？
      a: n8n 的生态节点最丰富、复杂逻辑能力最强（采用 Sustainable Use 协议）；Activepieces 则采用完全宽松的 MIT 开源协议，且步骤式界面更像 Zapier，非常适合追求纯正 MIT 开源或希望非技术人员也能轻松上手的团队。
  en:
    - q: Should I pick NocoDB or Baserow to replace Airtable?
      a: Pick NocoDB if you want to connect directly to an existing MySQL, Postgres, or SQLite database and turn it into a spreadsheet UI. Pick Baserow if you are building new tables from scratch and want blazing PostgreSQL performance plus a built-in no-code web app builder.
    - q: How does Activepieces compare to n8n for workflow automation?
      a: n8n offers the largest node ecosystem for complex developer pipelines under a fair-code license, while Activepieces is 100% MIT-licensed and features a cleaner, Zapier-like step builder that non-technical teammates can pick up immediately.
