added: '2026-11-12'
faq:
  zh:
    - q: changedetection.io 和 Uptime Kuma 有什么区别？可以一起用吗？
      a: 它们是绝佳的互补搭档：Uptime Kuma 专门监控「网站或服务器活没活着、响应快不快」；而 changedetection.io 专门监控「网页里面的文字、价格数字或 JSON 内容变没变（比如从“缺货”变成“有货”、从 2999 元降到 2499 元）」。
    - q: 自建消息推送选 ntfy 还是 Gotify？
      a: 两者都非常轻量优秀：ntfy 支持直接通过主题订阅（甚至可以直接用官方免费公共服务而无需自建），且同时支持 iOS 与 Android；Gotify 则采用应用 Token 机制，服务端内存占用极低，适合搭配 Android 与网页端自建使用。
  en:
    - q: How does changedetection.io differ from Uptime Kuma?
      a: "They complement each other: Uptime Kuma checks whether a server, port, or website is online and fast, whereas changedetection.io watches the actual content inside a web page or API—alerting you when a price drops, an item restocks, or a document changes."
    - q: Should I choose ntfy or Gotify for self-hosted push notifications?
      a: Pick ntfy if you want pub/sub topic simplicity and native iOS + Android apps (plus a free public server option). Pick Gotify if you want a super-lightweight Go server with per-application tokens for Android, CLI, and web.
