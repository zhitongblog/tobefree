title:
  zh: "免费邮件客户端与 RSS 阅读器"
  en: "Free Email Clients and RSS Readers"
description:
  zh: "六款免费的邮件客户端、加密邮箱、RSS 阅读器与稍后读工具，订阅和邮件存在本机或自建服务器，不被算法排序。"
  en: "Six free email clients, encrypted mail, RSS readers and read-it-later tools — subscriptions and mail stored locally or on your own server, with nothing reordered by an algorithm."
intro:
  zh: "信息入口这几年被收得很紧：邮件在网页端被按「重要」重排并插入广告，资讯靠推荐算法决定你看什么，收藏的文章过两年点开是 404。邮件和 RSS 恰好是仅存的两个开放协议入口 —— 谁都能自己做客户端，订阅是一个地址而不是一个平台账号，顺序就是时间顺序。这份清单按入口分三类：邮件、订阅源、稍后读。"
  en: "The doors information comes through have narrowed: webmail reorders by \"importance\" and inserts ads, feeds are chosen by recommendation algorithms, and an article saved two years ago now returns a 404. Email and RSS happen to be the two open-protocol doors left — anyone can write a client, a subscription is an address rather than a platform account, and the order is chronological. This list sorts three ways — mail, feeds and read-it-later."
criteria:
  zh:
    - "不按算法重排内容，顺序由你决定。"
    - "订阅列表可导出（OPML 等标准格式），换软件不丢数据。"
    - "邮件和文章存本机或自建服务器。"
    - "界面里没有广告和推荐位。"
  en:
    - "No algorithmic reordering — the order is yours."
    - "Subscription lists export in standard formats such as OPML, so switching apps loses nothing."
    - "Mail and articles stay local or on your own server."
    - "No ads and no recommendation slots in the interface."
tools: [thunderbird, proton-mail, delta-chat, fluent-reader, freshrss, wallabag]
skills: []
featured: false
added: '2026-09-18'
faq:
  zh:
    - q: "还有必要用桌面邮件客户端吗？"
      a: "有两个实在的理由。一是邮件下载到本机之后可以全文搜索、可以离线读、可以备份，不依赖某家服务商还在不在；二是网页端的排序和广告不由你控制，客户端就是按时间列出来。Thunderbird 二十多年了，支持多账号、IMAP、PGP 加密、日历和通讯录，Mozilla 在维护。"
    - q: "想要加密邮箱？"
      a: "Proton Mail。邮件在服务器上是加密存储的，Proton 自己也读不到内容。免费版有容量和每日发送量限制，日常个人使用够用。要注意端到端加密只在双方都用 Proton 或者对方用 PGP 时成立，发给普通邮箱的邮件在对方那边是明文——这是邮件协议本身的限制，不是它的问题。"
    - q: "RSS 阅读器选哪个？"
      a: "不想折腾用 Fluent Reader，桌面软件装上就能订阅，本机存储，不用搭服务器。多设备同步用 FreshRSS，自建在自己服务器上，手机、平板、电脑连同一个源，已读状态同步，几百个订阅源也不卡。两者都支持 OPML 导入导出，从别家搬过来是一个文件的事。"
    - q: "Wallabag 和收藏夹有什么区别？"
      a: "收藏夹只存了一个地址，三年后点开一半是 404。Wallabag 保存的时候把正文抓下来存在你自己的服务器上，原站删了内容还在，而且是去掉广告和弹窗的纯文本版本，可以推送到 Kindle 上读。目录里的 Karakeep 做类似的事但更偏收藏和检索，存整页存档和图片的能力更强。"
    - q: "Delta Chat 为什么在这里？"
      a: "它把邮箱当成聊天通道——不用注册新账号，用你已有的邮箱地址收发，消息走 Autocrypt 标准端到端加密。没有中心化的聊天服务器意味着没有一家公司持有你的社交关系图，底层就是已经跑了几十年的邮件基础设施。"
  en:
    - q: "Is a desktop mail client still worth it?"
      a: "For two concrete reasons. Mail downloaded locally is searchable in full, readable offline and backupable, independent of whether a provider still exists. And webmail's ordering and advertising are not yours to control, while a client simply lists messages by time. Thunderbird is over twenty years old, handles multiple accounts, IMAP, PGP, calendars and contacts, and is maintained by Mozilla."
    - q: "What about encrypted mail?"
      a: "Proton Mail. Messages are stored encrypted on the server and Proton cannot read them. The free tier caps storage and daily sends, which is enough for ordinary personal use. Note that end-to-end encryption holds only when both sides use Proton or the other party uses PGP; mail to an ordinary address arrives as plaintext there — a limitation of the email protocol rather than of Proton."
    - q: "Which RSS reader?"
      a: "Fluent Reader if you want no setup — a desktop app that subscribes immediately with local storage and no server. FreshRSS for multiple devices, self-hosted so phone, tablet and computer share one set of feeds with read state synced, staying responsive across hundreds of sources. Both import and export OPML, so moving from another reader is one file."
    - q: "How is Wallabag different from bookmarks?"
      a: "A bookmark stores only an address, and three years later half are 404s. Wallabag pulls the article text on save and keeps it on your own server, so the original disappearing does not matter, and the stored version is stripped of ads and pop-ups and can be pushed to a Kindle. Karakeep in this directory does something similar with more emphasis on collecting and retrieval, with stronger full-page and image archiving."
    - q: "Why is Delta Chat here?"
      a: "It treats email as a chat transport — no new account, your existing address sending and receiving, with messages end-to-end encrypted through the Autocrypt standard. No central chat server means no company holds your social graph, and underneath is the mail infrastructure that has been running for decades."
