title:
  zh: "免费系统清理与效率工具"
  en: "Free System Cleanup and Productivity Utilities"
description:
  zh: "十三款免费的启动器、文本扩展、重复文件清理、磁盘分析、压缩、备份与软件管理工具，全部无广告、无捆绑、不推销「一键加速」。"
  en: "Thirteen free launchers, text expanders, duplicate finders, disk analysers, archivers, backup and package tools — no ads, no bundles, and no \"one-click speed boost\" upsell."
intro:
  zh: "「系统优化」是消费软件里最脏的一个词。典型套路是扫描出一堆红色告警，告诉你系统有 3847 个问题，点修复之后要求开会员，顺带装上浏览器插件和几个全家桶。真正有用的系统工具从不这样 —— 它们各自解决一个具体问题：这个热键启动程序，那个告诉你 C 盘被什么占满了，另一个把复制过的东西都留着。这份清单按用途分五类：启动与输入、清理与分析、压缩、备份、软件管理。"
  en: "\"System optimisation\" is the dirtiest phrase in consumer software. The routine is a scan producing red warnings about 3,847 problems, a membership prompt when you click repair, and a browser extension plus a few bundled extras on the way out. Genuinely useful utilities never behave like that — each solves one concrete problem: this one launches programs from a hotkey, that one shows what filled the disk, another keeps everything you copied. This list sorts five ways — launching and input, cleanup and analysis, archiving, backup, and package management."
criteria:
  zh:
    - "不扫描出虚假问题，不推销「加速」「优化」「深度清理」。"
    - "安装包不捆绑其他软件，不改浏览器主页和默认搜索。"
    - "界面里没有广告位，不需要注册账号。"
    - "只解决一个具体问题，不是功能堆叠的「全家桶」。"
  en:
    - "Invents no problems and sells no \"acceleration\", \"optimisation\" or \"deep clean\"."
    - "The installer bundles nothing and does not change your browser homepage or default search."
    - "No ad slots in the interface and no account required."
    - "Solves one concrete problem rather than stacking features into a suite."
tools: [flow-launcher, espanso, autohotkey, ditto, files-app, czkawka, windirstat, bleachbit, peazip, ziplark, winmerge, kopia, unigetui]
