faq:
  zh:
    - q: 如何把一堆 PDF、Word 和 Excel 批量转换成干净的 Markdown 导入知识库？
      a: 使用微软开源的 MarkItDown（MIT 协议）。它能保留原文档的标题层级、列表和表格结构，一键将 .docx、.pptx、.xlsx、PDF 乃至音频和图片转换为高可读性的 Markdown 文件。
    - q: 怎么让 Claude Code 或 Cursor 在大型代码库里少消耗 Token？
      a: 配置 Codebase-Memory-MCP 和 Claude-Mem：前者用 Tree-sitter 在本地生成函数与调用链图谱，避免 Agent 反复全库盲读代码；后者跨会话持久化保存项目架构记忆，不用每次重头解释。
  en:
    - q: What is the easiest free way to batch-convert PDF, Word, and Excel files into Markdown?
      a: Use Microsoft’s MIT-licensed MarkItDown utility. It preserves headings, tables, and lists cleanly across .docx, .pptx, .xlsx, and PDF files offline.
    - q: How can I cut down token usage when running coding agents on large repositories?
      a: Pair Codebase-Memory-MCP (which builds a local Tree-sitter call graph across 150+ languages) with Claude-Mem (which persists compressed architectural context across sessions).
