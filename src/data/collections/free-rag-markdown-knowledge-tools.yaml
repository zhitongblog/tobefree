title:
  zh: 免费开源文档转 Markdown、代码知识图谱与本地 RAG 检索工具推荐
  en: Free Open-Source Document-to-Markdown, Code Knowledge Graph & Local RAG Tools
description:
  zh: 把杂乱的 PDF、Office 文档与庞大代码库转化为大模型最易理解的结构化 Markdown、Tree-sitter 知识图谱与毫秒级本地混合向量索引。
  en: Turn messy PDFs, Office files, and massive codebases into clean Markdown, Tree-sitter knowledge graphs, and fast local hybrid vector indexes for LLMs and personal knowledge bases.
intro:
  zh: 无论是搭建个人本地第二大脑，还是让 AI 编程助手理解大型项目，核心瓶颈往往不在模型本身，而在「喂给模型的上下文质量」。直接塞入原始 PDF/Word 或让 Agent 全库盲读代码，既烧 Token 又容易产生幻觉。这份清单精选了文档清洗转 Markdown、代码结构图谱 MCP 以及轻量级本地全文/向量检索引擎，全部开源免费、支持纯本地运行。
  en: Whether you are building a private second brain or steering a coding agent through a large repository, context quality is everything. This collection brings together open-source tools that convert messy Office/PDF files into clean Markdown, index codebases into Tree-sitter knowledge graphs, and provide fast local hybrid search.
criteria:
  zh:
    - 开源免费，支持在本机或自有服务器离线运行，私密文档与源码不出本地。
    - 显著提升大模型上下文信噪比，大幅降低 Token 消耗与检索延迟。
  en:
    - Free and open source, running locally on your machine or self-hosted server so private docs and code stay yours.
    - Drastically reduces LLM token usage and retrieval latency by structuring raw files and code.
