title:
  zh: "安卓免费无广告 App 推荐"
  en: "Free Ad-Free Android Apps"
description:
  zh: "十八款安卓上的免费无广告 App，覆盖视频、播客、浏览器、地图、两步验证、密码、传文件、阅读、笔记、记账和习惯打卡，全部开源。"
  en: "Eighteen free, ad-free Android apps covering video, podcasts, browsing, maps, two-factor codes, passwords, file transfer, reading, notes, budgeting and habits — all open source."
intro:
  zh: "安卓应用商店里，免费 App 的常见形态是开屏广告加信息流广告，再卖一个「去广告版」。另一类问题更隐蔽：有人拿开源项目改个图标重新上架，加上广告 SDK 收费，搜名字搜出来的未必是原作者发的版本。F-Droid 是绕开这些的一条路，它只收开源应用，从源码自己编译，带广告、带追踪的应用会被标出来。这份清单里 NewPipe 和 Cromite 不在 Play 商店，要从官网或 F-Droid 装；其余多数在 Play 商店也有官方版本。"
  en: "On Android app stores, the usual shape of a free app is a splash ad plus in-feed ads, then a paid \"ad-free edition.\" A quieter problem sits alongside it: someone takes an open-source project, changes the icon, adds an ad SDK and relists it for money, so searching a name does not guarantee the original developer's build. F-Droid is one way around all of this — it carries only open-source apps, builds them from source itself, and flags apps that contain ads or tracking. In this list, NewPipe and Cromite are not on the Play Store and come from their official sites or F-Droid; most of the rest also have official Play Store listings."
criteria:
  zh:
    - "没有广告，没有「去广告」内购。"
    - "开源，安装包来自官方渠道：官网、F-Droid 或作者本人的商店页面。"
    - "日常功能不需要注册账号，需要账号的逐款说明。"
    - "免费版有实际限制的，写在下面的问答里。"
  en:
    - "No ads, and no in-app purchase to remove them."
    - "Open source, installed from official channels: the project site, F-Droid or the developer's own store listing."
    - "Everyday use needs no account; where one is needed, it is stated."
    - "Where the free tier has a real limit, it is spelled out in the FAQ."
tools: [newpipe, antennapod, cromite, firefox, vlc, organic-maps, osmand, aegis-authenticator, bitwarden, localsend, kde-connect, koreader, kiwix, joplin, anki, signal, money-manager-ex, loop-habit-tracker]
