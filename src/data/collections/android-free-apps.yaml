faq:
  zh:
    - q: "NewPipe 为什么在 Play 商店搜不到？"
      a: "它不在 Play 商店上架，从官网下 APK 或者用 F-Droid 装，认准官方签名。NewPipe 不调用官方客户端的库，没有广告模块，能后台播放，订阅存在手机本地，不需要账号。代价是平台改接口它就会坏，历史上出现过几天不能用、等新版本修复的情况。"
    - q: "手机浏览器怎么去广告？"
      a: "Chrome 手机版不支持扩展，装不了拦截插件。Cromite 把广告和追踪拦截做进浏览器本体，不依赖扩展机制，同样不在 Play 商店，从官网或 F-Droid 装。想要装扩展的话用 Firefox，安卓版支持扩展。"
    - q: "两步验证用 Aegis 还是 Bitwarden？"
      a: "验证码交给 Aegis。它不申请联网权限，密钥用主密码或指纹加密后只存在本机，能从 Google Authenticator 和 Authy 导入。装好之后先导出一份加密备份，手机丢了没有备份，验证码就找不回来。网站密码交给 Bitwarden，免费版不限密码条数和设备数。"
    - q: "Organic Maps 和 OsmAnd 选哪个？"
      a: "日常出行选 Organic Maps，装完就会用，搜索和导航断网也能做。徒步、骑行长途、要录 GPX 轨迹和看等高线的选 OsmAnd。OsmAnd 免费版最多下载 7 份地图，一份通常是一个省或一个中等国家，超出要买 Maps+，从 F-Droid 装也是同样的限制。"
  en:
    - q: "Why can't I find NewPipe on the Play Store?"
      a: "It is not listed there. Download the APK from the official site or install through F-Droid, and check the official signature. NewPipe links no official client libraries, so it has no ad module; it plays in the background and keeps subscriptions on the phone with no account. The cost is that it breaks when the platform changes its interface, and there have been stretches of several days waiting for a fix."
    - q: "How do I block ads in a mobile browser?"
      a: "Mobile Chrome does not support extensions, so blocker add-ons are out. Cromite builds ad and tracker blocking into the browser itself rather than into an extension; it is also off the Play Store, installed from its site or F-Droid. If you want extensions, use Firefox, whose Android version supports them."
    - q: "Aegis or Bitwarden for two-factor codes?"
      a: "Codes go to Aegis. It requests no network permission, encrypts secrets with a master password or fingerprint and keeps them only on the phone, and imports from Google Authenticator and Authy. Export an encrypted backup right after setup — a lost phone with no backup means the codes are gone. Site passwords go to Bitwarden, whose free tier has no limit on passwords or devices."
    - q: "Organic Maps or OsmAnd?"
      a: "For everyday travel, Organic Maps: it works as soon as it is installed, and search and navigation run offline. For hiking, long-distance cycling, recording GPX tracks and contour lines, OsmAnd. OsmAnd's free tier allows seven map downloads, each typically a province or a mid-sized country; beyond that you buy Maps+, and the F-Droid build has the same limit."
