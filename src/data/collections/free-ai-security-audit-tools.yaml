added: '2026-11-08'
faq:
  zh:
    - q: 如何快速检查我电脑上安装的 MCP Server 和开发包有没有被投毒？
      a: 首推 Perplexity 开源的 Bumblebee。它是用 Go 编写的纯只读扫描器，扫描期间完全不联网，几秒钟就能排查本机 npm、PyPI、Go 缓存、浏览器/IDE 扩展以及 MCP 配置文件中的恶意特征。
    - q: 怎么防止 Claude Code 或 Cursor 在读网页/调工具时把我的本地 API Key 泄露出去？
      a: 可以在 Agent 与网络/MCP 服务之间串联开源的 Pipelock 防火墙。它会实时检查所有 MCP JSON-RPC 消息与出站 HTTP 请求，一旦发现环境变量密钥外泄、SSRF 或工具描述投毒会立即阻断。
  en:
    - q: How can I check if my local MCP servers, extensions, or npm/PyPI packages are compromised?
      a: Run Perplexity Bumblebee. It is a read-only Go CLI that scans local package caches, browser/VS Code extensions, and MCP configuration files in seconds without making any outbound network calls.
    - q: How do I stop coding agents from leaking my .env secrets via prompt injection?
      a: Place Pipelock inline as a local proxy between your coding agent and its MCP servers/network. It inspects traffic in real time to block credential exfiltration, tool poisoning, and SSRF.
