description:
  zh: 跨 shell 的命令行提示符工具，在提示符里显示当前 Git 分支与改动状态、语言运行时版本、云账号上下文、上条命令的耗时和退出码。Bash、Zsh、Fish、PowerShell、Nushell 共用同一份 TOML 配置。
  en: A cross-shell prompt that displays the current Git branch and dirty state, language runtime versions, cloud context, and the previous command's duration and exit code. Bash, Zsh, Fish, PowerShell and Nushell all read the same TOML configuration.
review:
  zh: |
    ISC 协议，6 万颗星。

    提示符里该有什么，这件事每个人都自己折腾过一遍：
    Bash 里写一串 `\[\e[32m\]` 转义，Zsh 里装 oh-my-zsh 再挑主题，
    PowerShell 里又是另一套。换台机器、换个 shell，全部重来。

    Starship 把这层抽出来：一个二进制，一份 `starship.toml`，
    在哪个 shell 里都长一样。模块是按需显示的——
    进到 Rust 项目才显示 Rust 版本，在 Git 仓库里才显示分支，
    不会把一堆用不上的信息常年挂在那儿。

    上条命令耗时超过阈值自动显示，这一条对跑构建的人很实用。

    要说清楚的：

    - 图标需要 Nerd Font 才能正常显示，终端字体要换。
      不想换的话有纯文本预设。
    - 每次显示提示符都要跑一次检测，在特别慢的网络文件系统上
      可能有延迟，可以按模块关掉。
  en: |
    ISC-licensed, 60,000 stars.

    Everyone has fought this once: a string of `\[\e[32m\]` escapes in Bash, oh-my-zsh plus a theme in
    Zsh, something else again in PowerShell. Change machines or change shells and it all starts over.

    Starship lifts that layer out: one binary, one `starship.toml`, identical in every shell. Modules
    appear only when relevant — the Rust version shows up inside a Rust project, the branch inside a Git
    repository — instead of parking information you do not need on every line.

    Showing the previous command's duration past a threshold is a small thing that earns its place for
    anyone running builds.

    To be clear about:

    - Icons need a Nerd Font, so the terminal font has to change. There are plain-text presets for those
      who would rather not.
    - It runs detection on every prompt, which can lag on a very slow network filesystem; modules can be
      disabled individually.
