tagline:
  zh: 支持同时加载几十本 MDX / StarDict 权威离线词典的下一代开源查词神器
  en: Next-generation open-source offline dictionary lookup program supporting MDX, StarDict and DSL
description:
  zh: 基于 Qt6 与现代 WebEngine 内核重构的下一代开源离线词典外壳。市面上各种在线词典客户端塞满卖课广告和资讯流，GoldenDict-ng 完全离线、零广告，导入你自己收集的牛津、朗文、韦氏等 `.mdx` / StarDict 词库后，查一个词瞬间瀑布流聚合展示所有权威词典释义与真人发音，支持全局快捷键屏幕取词并与 Anki 联动制卡。
  en: A modernized Qt6/WebEngine fork of GoldenDict. Load your own offline MDX, DSL, StarDict and Zim dictionaries to view aggregated definitions and audio pronunciations side by side with popup scan-translate and Anki integration.
review:
  zh: |
    GoldenDict-ng 是 开源工具 领域中一款值得长期留存的代表作。基于 Qt6 与现代 WebEngine 内核重构的下一代开源离线词典外壳。市面上各种在线词典客户端塞满卖课广告和资讯流，GoldenDict-ng 完全离线、零广告，导入你自己收集的牛津、朗文、韦氏等 `.mdx` / StarDict 词库后，查一个词瞬间瀑布流聚合展示所有权威词典释义与真人发音，支持全局快捷键屏幕取词并与 Anki 联动制卡。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    GoldenDict-ng is a standout choice in software tools. A modernized Qt6/WebEngine fork of GoldenDict. Load your own offline MDX, DSL, StarDict and Zim dictionaries to view aggregated definitions and audio pronunciations side by side with popup scan-translate and Anki integration.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
