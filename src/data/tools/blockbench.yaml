tagline:
  zh: 简单好上手的开源低多边形（Low-Poly）3D 建模、像素贴图绘制与骨骼动画工具
  en: Free, open-source low-poly 3D model editor with built-in pixel art texturing and animation
description:
  zh: GPL-3.0 开源的轻量级 3D 建模软件。如果你觉得 Blender 太复杂，只想要快速做出复古低多边形（Low-Poly）模型、直接在 3D 表面画像素贴图并调出骨骼关键帧动画导出到 Godot / Unity 或 Minecraft，Blockbench 半小时就能上手。
  en: A GPL-3.0 3D modeling app tailored for low-poly art, voxel/box modeling and pixel-art UV painting. Paint textures directly on the 3D mesh, animate skeletons and export straight to glTF, OBJ, Godot or Minecraft.
review:
  zh: |
    Blockbench 是 设计、图像与音视频创作 领域中一款值得长期留存的代表作。GPL-3.0 开源的轻量级 3D 建模软件。如果你觉得 Blender 太复杂，只想要快速做出复古低多边形（Low-Poly）模型、直接在 3D 表面画像素贴图并调出骨骼关键帧动画导出到 Godot / Unity 或 Minecraft，Blockbench 半小时就能上手。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、Web 浏览器 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Blockbench is a standout choice in creative design, imaging, and audio/video production. A GPL-3.0 3D modeling app tailored for low-poly art, voxel/box modeling and pixel-art UV painting. Paint textures directly on the 3D mesh, animate skeletons and export straight to glTF, OBJ, Godot or Minecraft.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, Web browsers, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
