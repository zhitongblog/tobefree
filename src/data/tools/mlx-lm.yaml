tagline:
  zh: 苹果官方 MLX 团队出品，专为 Apple Silicon 统一内存优化的极速大模型套件
  en: Apple’s official Python package for fast LLM inference and LoRA fine-tuning on Apple Silicon
description:
  zh: 由 Apple 机器学习团队维护的 MIT 开源工具包，专为 M 系列芯片的统一内存架构打造。在 Mac 上不管是跑大模型推理、量化转换还是本地 LoRA 微调，速度和显存利用率通常都明显高于通用跨平台框架。
  en: Maintained by Apple machine learning research under the MIT license, MLX-LM squeezes maximum inference speed and memory efficiency out of M-series unified memory, with built-in quantization, local HTTP serving and LoRA fine-tuning.
review:
  zh: |
    MLX-LM 是 开源工具 领域中一款值得长期留存的代表作。由 Apple 机器学习团队维护的 MIT 开源工具包，专为 M 系列芯片的统一内存架构打造。在 Mac 上不管是跑大模型推理、量化转换还是本地 LoRA 微调，速度和显存利用率通常都明显高于通用跨平台框架。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 macOS、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    MLX-LM is a standout choice in software tools. Maintained by Apple machine learning research under the MIT license, MLX-LM squeezes maximum inference speed and memory efficiency out of M-series unified memory, with built-in quantization, local HTTP serving and LoRA fine-tuning.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across macOS, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
