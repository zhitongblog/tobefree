tagline:
  zh: 获得建筑工业界大奖的开源 OpenBIM 设计套件，直接读写原生 IFC 替代天价 Revit
  en: Award-winning free and open-source OpenBIM authoring platform and native IFC CAD environment
description:
  zh: 基于 IfcOpenShell 与 Blender 打造的 GPL-3.0 开源建筑信息模型（BIM）软件（原名 BlenderBIM）。不搞私有格式锁死，直接以国际标准 `.ifc` 作为原生保存格式，支持完整的建筑结构建模、工程量清单统计、碰撞检测与二维施工图纸自动生成，商业工程同样永久免费。
  en: Formerly BlenderBIM, Bonsai is a GPL-3.0 OpenBIM authoring platform that edits international standard `.ifc` files natively, providing structural modeling, quantity take-offs, clash detection and 2D construction drawings.
review:
  zh: |
    Bonsai (BlenderBIM) 是 开源工具 领域中一款值得长期留存的代表作。基于 IfcOpenShell 与 Blender 打造的 GPL-3.0 开源建筑信息模型（BIM）软件（原名 BlenderBIM）。不搞私有格式锁死，直接以国际标准 `.ifc` 作为原生保存格式，支持完整的建筑结构建模、工程量清单统计、碰撞检测与二维施工图纸自动生成，商业工程同样永久免费。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Bonsai (BlenderBIM) is a standout choice in software tools. Formerly BlenderBIM, Bonsai is a GPL-3.0 OpenBIM authoring platform that edits international standard `.ifc` files natively, providing structural modeling, quantity take-offs, clash detection and 2D construction drawings.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
