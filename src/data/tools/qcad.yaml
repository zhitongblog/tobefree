tagline:
  zh: LibreCAD 的源头上游，成熟稳定的 GPL 开源二维机械与建筑工程制图系统
  en: Mature open-source 2D CAD system for technical drawings, floor plans and mechanical parts
description:
  zh: 历史悠久且持续活跃的 GPL-3.0 二维 CAD 制图软件（LibreCAD 早年即从它分支而来）。专注于高精度的二维工程图、户型平面图、机械零件图与激光切割 DXF 图纸绘制，内置超过 40 种构造工具、60 种修改工具与数千个标准零件图库。
  en: A mature GPL-3.0 2D CAD application for technical drawings, building plans, interiors and mechanical parts/schematics, natively reading and writing standard DXF files.
review:
  zh: |
    QCAD Community 是 开源工具 领域中一款值得长期留存的代表作。历史悠久且持续活跃的 GPL-3.0 二维 CAD 制图软件（LibreCAD 早年即从它分支而来）。专注于高精度的二维工程图、户型平面图、机械零件图与激光切割 DXF 图纸绘制，内置超过 40 种构造工具、60 种修改工具与数千个标准零件图库。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    QCAD Community is a standout choice in software tools. A mature GPL-3.0 2D CAD application for technical drawings, building plans, interiors and mechanical parts/schematics, natively reading and writing standard DXF files.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
