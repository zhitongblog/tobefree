tagline:
  zh: 连「联网权限」都没申请的安卓开源 KeePass 密码库，从物理层面杜绝密码外泄
  en: Material Design open-source KeePass password manager for Android that requests zero Internet permission
description:
  zh: 安卓端最受推崇的 GPL-3.0 开源离线密码管理器（电脑端 KeePassXC 的黄金手机搭档）。它甚至在安卓系统安装包清单里直接砍掉了 `INTERNET` 联网权限——哪怕你想怀疑它偷偷传数据，操作系统都不会放行一字节网络请求，支持指纹解锁与全局自动填充。
  en: A modern GPL-3.0 KeePass client for Android compatible with `.kdbx` vaults from KeePassXC. It literally does not request the Android `INTERNET` permission, making network exfiltration impossible by design.
review:
  zh: |
    KeePassDX 是 隐私、加密与安全防护 领域中一款值得长期留存的代表作。安卓端最受推崇的 GPL-3.0 开源离线密码管理器（电脑端 KeePassXC 的黄金手机搭档）。它甚至在安卓系统安装包清单里直接砍掉了 `INTERNET` 联网权限——哪怕你想怀疑它偷偷传数据，操作系统都不会放行一字节网络请求，支持指纹解锁与全局自动填充。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Android 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    KeePassDX is a standout choice in privacy protection, encryption, and security. A modern GPL-3.0 KeePass client for Android compatible with `.kdbx` vaults from KeePassXC. It literally does not request the Android `INTERNET` permission, making network exfiltration impossible by design.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Android, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
