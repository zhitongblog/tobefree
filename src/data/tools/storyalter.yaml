description:
  zh: AI 长篇写作平台。围绕"写作分身"展开——你设定创作偏好，它生成一个有风格倾向的写作人格，之后从大纲、人物、设定到逐章生成整套跑通。你每次修改 AI 的稿子，分身都会学走你的偏好。服务本身免费，模型用你自己的 API key。
  en: An AI long-form writing platform built around a "writing alter" — you define creative preferences and it forms a writing persona, then carries you from outline and characters through setting to chapter-by-chapter generation. Every edit you make to its drafts teaches the alter your preferences. The service is free; you supply your own model API key.
review:
  zh: |
    AI 写作工具大多停在"帮你写一段"。长篇的真正难点不在单段文字，
    而在**几十万字之后还记不记得住**：人物有没有崩、
    死了的人有没有又出现、三十章前埋的伏笔收没收、
    节奏是不是一直平。

    StoryAlter 是冲着这一段设计的。

    核心概念是**写作分身**：你先设定创作偏好，它据此生成一个写作人格，
    分四个维度——理念（价值取向、情感基调、题材偏好）、
    叙事（结构、冲突设计、节奏、人物塑造）、
    文风（用词、对话方式、描写习惯）、
    以及会随使用累积的经验。**你每次改它的稿子，它学走你的改法。**

    围绕长篇跑通的工具：

    - **大纲生成**：按设定自动出章节大纲，支持从微短到长篇的多种规模。
    - **自动写作**：可以整卷连续生成，能暂停续写。
    - **人物档案与设定库**：性格、经历、关系、世界观、力量体系、势力，集中管理。
    - **一致性引擎**：硬规则拦截"死人复活"、检测力量体系自相矛盾、
      提醒超期未收的伏笔。**这是长篇最容易翻车的地方。**
    - **知识时间线**：每章自动抽取人物变化、关系、伏笔和线索，做成可视时间线。
    - **剧情分支模拟**：关键节点给 2-3 个走向，各配约 500 字预览，看完再选。
    - **角色对话**：可以直接和书里的人物聊，它只知道到当前章为止的事，不剧透。
    - **去 AI 味**：内置一套规则，让生成的文字读起来不那么像机器写的。
    - **封面生成**。

    模型可以接 Gemini、GPT、Claude、DeepSeek、通义千问、Kimi。

    **自研产品，该说清楚的一条都不省：**

    - **必须注册账号**。它是托管的网页服务，不是本地软件，所以**没有「无需注册」徽章**，
      也拿不到「离线可用」——这两点和本站上多数 AI 工具（Ollama、LM Studio 那类本地方案）
      是相反的取向，选之前要清楚。
    - **不开源**。所以没有开源徽章。
    - **服务免费，但模型要花钱**。官方写明"本服务完全免费"、
      "需要你自备 AI API key"。**这意味着生成的账单来自模型服务商，不是 StoryAlter**——
      而长篇自动生成是很吃 token 的，跑一整卷的成本请先自己估一下，
      并在模型服务商那边设好额度上限。
    - **内容归你**。官方声明生成内容的权利归用户，平台不主张权利，
      同时也不对生成内容负责。
    - **AI 写长篇仍有天花板**。一致性引擎能拦住硬伤，但文学质量、
      人物弧光、情感真实度这些，目前任何工具都替代不了人。
      **把它当成加速器和结构管理工具，不要当成"点一下出一本好书"。**
      另外，用 AI 生成的内容投稿或发布时，请遵守目标平台对 AI 内容的规定。

    适合谁：写网文和长篇的人、需要管理几十万字设定不出错的人、
    以及想用自己的 API key 而不是再买一份订阅的人。
    只是想要个本地的写作环境，看 Obsidian 或 SoloMD。
  en: |
    Most AI writing tools stop at helping with a paragraph. The real difficulty in long-form work is
    not any single passage but **whether anything is still remembered after a few hundred thousand
    words**: has a character drifted, has someone who died reappeared, was the foreshadowing planted
    thirty chapters ago ever paid off, has the pacing flattened out.

    StoryAlter is designed for that stretch.

    Its central concept is the **writing alter**: you define creative preferences and it forms a writing
    persona across four dimensions — philosophy (values, emotional tone, thematic preference), narrative
    (structure, conflict design, pacing, characterization), style (word choice, dialogue, description
    habits), and experience that accumulates with use. **Every edit you make to its drafts teaches it
    how you write.**

    The tooling around long-form work:

    - **Outline generation** from your setup, at scales from very short to epic.
    - **Automatic writing** through an entire volume, pausable and resumable.
    - **Character profiles and a setting archive** covering personality, history, relationships,
      worldbuilding, power systems and factions in one place.
    - **A consistency engine** with hard rules that block dead characters from returning, detect power
      system contradictions and flag overdue foreshadowing. **This is exactly where long-form breaks
      down.**
    - **A knowledge timeline** extracting character changes, relationships, foreshadowing and plot
      threads from each chapter into a visual view.
    - **Plot branch simulation** offering two or three directions at key decision points with roughly
      500-word previews to compare before committing.
    - **Talking to your characters,** who stay in character and know only what has happened up to the
      current chapter, so nothing is spoiled.
    - **De-AI guidelines** built in to make generated prose read less mechanically.
    - **Cover generation.**

    Models can be Gemini, GPT, Claude, DeepSeek, Qwen or Kimi.

    **It is ours, so nothing gets softened:**

    - **An account is required.** This is a hosted web service rather than local software, so it
      carries **no no-sign-up badge** and no offline badge — the opposite posture from most AI tools on
      this site, which are local runners like Ollama and LM Studio. Know that before choosing it.
    - **It is not open source,** hence no open-source badge.
    - **The service is free, but the models cost money.** The site states plainly that the service is
      completely free and that you supply your own API key. **That means the bill comes from the model
      provider, not from StoryAlter** — and automatic long-form generation consumes a great many
      tokens. Estimate the cost of a full volume first, and set a spending cap with your provider.
    - **The content is yours.** The site states that rights to generated content belong to the user and
      the platform claims none — while also disclaiming responsibility for what is generated.
    - **AI long-form writing still has a ceiling.** A consistency engine catches structural errors, but
      literary quality, character arcs and emotional truth remain beyond any current tool. **Treat it
      as an accelerator and a structure manager, not as a button that produces a good book.** And when
      publishing AI-assisted work, follow the target platform's rules on AI-generated content.

    Who it suits: people writing serial fiction and long novels, anyone managing hundreds of thousands
    of words of setting without contradictions, and anyone who would rather use their own API key than
    buy another subscription. If you simply want a local writing environment, look at Obsidian or
    SoloMD.
