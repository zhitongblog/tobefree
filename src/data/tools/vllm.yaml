tagline:
  zh: 行业标准的开源高吞吐大语言模型推理与服务引擎，首创 PagedAttention 显存优化
  en: High-throughput, memory-efficient open-source inference and serving engine for LLMs powered by PagedAttention
description:
  zh: 通过 PagedAttention、连续批处理（Continuous Batching）与前缀缓存（Prefix Caching）将本地显卡并发推理吞吐量提升数倍，原生提供 100% 兼容 OpenAI API 的本地服务端。
  en: Maximizes GPU utilization with PagedAttention, continuous batching, quantization (AWQ/GPTQ/FP8), and speculative decoding, exposing a drop-in OpenAI-compatible local API server.
review:
  zh: |
    当你需要让多个 Agent 并发调用本地模型（如配合 Gas Town 跑多 Agent 编码，或跑高频分类任务）时，普通推理工具排队严重，而 vLLM 能把单张显卡的并发吞吐榨干到极致，是开源大模型服务端的事实标准。
  en: |
    When running concurrent coding agents or local team inference, vLLM is the undisputed open-source standard for high-throughput, low-latency LLM serving.
