tagline:
  zh: 数据百分之百加密留在本地硬盘的开源多账户投资组合与财务统计软件
  en: Open-source portfolio tracker and accounting tool that keeps all financial data encrypted locally
description:
  zh: AGPL-3.0 开源的本地优先资产与投资组合追踪桌面应用。绝大多数投资统计网站都要求把你的持仓和交易记录存到它们的云端数据库，rotki 则将所有账目加密保存在你自己的电脑本地，支持导出完整财务盈亏报表。
  en: An AGPL-3.0 local-first portfolio management and accounting application that stores your financial history encrypted on your own drive rather than on a vendor cloud.
review:
  zh: |
    rotki 是 开源工具 领域中一款值得长期留存的代表作。AGPL-3.0 开源的本地优先资产与投资组合追踪桌面应用。绝大多数投资统计网站都要求把你的持仓和交易记录存到它们的云端数据库，rotki 则将所有账目加密保存在你自己的电脑本地，支持导出完整财务盈亏报表。

    在“真免费、少打扰”的维度上，它采用 AGPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    rotki is a standout choice in software tools. An AGPL-3.0 local-first portfolio management and accounting application that stores your financial history encrypted on your own drive rather than on a vendor cloud.

    From a user-freedom perspective, it is released under the AGPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
