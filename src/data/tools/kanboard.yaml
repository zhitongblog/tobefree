tagline:
  zh: 极简到只需一个 SQLite 文件就能跑起来的开源看板任务管理系统
  en: Minimalist open-source Kanban project management software backed by a single SQLite file
description:
  zh: MIT 开源的极简主义看板软件。拒绝花哨臃肿的视觉特效，专注「限制在制品数量（WIP）」的核心看板方法论；资源占用极小，默认只需 PHP + 单文件 SQLite 数据库即可运行，几秒钟就能在任意小主机上搭好。
  en: An MIT-licensed Kanban board that eschews visual bloat in favor of fast keyboard navigation, Work-In-Progress (WIP) limits, automated triggers and a tiny SQLite footprint.
review:
  zh: |
    Kanboard 是 效率与知识管理 领域中一款值得长期留存的代表作。MIT 开源的极简主义看板软件。拒绝花哨臃肿的视觉特效，专注「限制在制品数量（WIP）」的核心看板方法论；资源占用极小，默认只需 PHP + 单文件 SQLite 数据库即可运行，几秒钟就能在任意小主机上搭好。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Linux、Windows、macOS 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Kanboard is a standout choice in productivity and knowledge management. An MIT-licensed Kanban board that eschews visual bloat in favor of fast keyboard navigation, Work-In-Progress (WIP) limits, automated triggers and a tiny SQLite footprint.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, ships with zero ads and no invasive telemetry. With native support across Web browsers, Linux, Windows, macOS, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
