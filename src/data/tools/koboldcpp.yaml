tagline:
  zh: 单文件免安装的本地大模型运行器，双击就能加载 GGUF 模型
  en: Zero-install single-file local LLM runner built on llama.cpp with a bundled Web UI
description:
  zh: 基于 llama.cpp 深度整合的单文件绿色软件。不需要安装依赖、不写注册表，下载一个可执行文件双击即可选择 GGUF 模型启动，同时内置聊天、故事续写、文生图（Stable Diffusion）、语音识别（Whisper）与 TTS，堪称本地 AI 的瑞士军刀。
  en: A single-file, zero-install executable built on llama.cpp. Download one file, pick a GGUF model and immediately get a web UI and API covering chat, creative writing, image generation, Whisper speech-to-text and TTS.
review:
  zh: |
    KoboldCpp 是 开源工具 领域中一款值得长期留存的代表作。基于 llama.cpp 深度整合的单文件绿色软件。不需要安装依赖、不写注册表，下载一个可执行文件双击即可选择 GGUF 模型启动，同时内置聊天、故事续写、文生图（Stable Diffusion）、语音识别（Whisper）与 TTS，堪称本地 AI 的瑞士军刀。

    在“真免费、少打扰”的维度上，它采用 AGPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    KoboldCpp is a standout choice in software tools. A single-file, zero-install executable built on llama.cpp. Download one file, pick a GGUF model and immediately get a web UI and API covering chat, creative writing, image generation, Whisper speech-to-text and TTS.

    From a user-freedom perspective, it is released under the AGPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
