tagline:
  zh: Jared Palmer 开源的本地 Jev 决策模型平替，百毫秒内返回强类型判断
  en: Open-source local Jev decision model family by Jared Palmer for sub-100ms typed decisions
description:
  zh: 基于 Qwen 架构训练的开源「System 1（系统一）」类型化决策模型家族。不做冗长的逐 Token 聊天生成，只接收程序状态与结构化问题（单选、多选、打分、布尔判断），在本机极低延迟下返回校准概率与类型安全结果，完全兼容 TypeSafe AI 的 Jev 接口契约。
  en: An open-source family of System 1 typed decision models built on Qwen bases. Instead of generating chat tokens, Kev takes program state and structured questions (select, multi-select, score, boolean) and returns calibrated probabilities locally in tens of milliseconds, matching the TypeSafe Jev API contract.
review:
  zh: |-
    TypeSafe AI 的 Jev 把「不写废话、只做结构化毫秒级决策」的 System 1 架构带火了，但官方模型闭源且只能走云端 API。Jared Palmer 开源的 Kev 就是社区最硬核的本地平替。

    它基于 Qwen 基座改造为仅做 Prefill + 指针头（Pointer Heads）的架构，专门用来跑工具路由、安全护栏、分类打分和 UI 动作选择。在自己的机器或内网服务器上跑，不仅零 Token 账单、完全离线，还能用自己的业务数据微调。
  en: |-
    TypeSafe AI's Jev popularized System 1 models that skip free-form text generation in favor of fast, typed decisions — but the official weights are closed. Jared Palmer's Kev is the leading open-source local alternative.

    Built on Qwen bases with a prefill-only architecture and pointer heads, it handles tool routing, guardrails, classification and UI action selection on your own hardware at zero API cost and with full fine-tuning scripts included.
