tagline:
  zh: 悉尼大学与加州理工联合研发的开源板块构造软件，在 3D 地球仪上倒放数亿年大陆漂移
  en: Open-source desktop software for the interactive visualization of plate tectonics through geological time
description:
  zh: 由悉尼大学、加州理工学院与挪威地质调查局联合开发的 GPL 开源古地理与板块构造可视化软件。拖动时间轴就能在三维地球仪上直观演示几亿年来盘古大陆如何裂解漂移成今天的七大洲，不论是地质学研究还是给孩子科普地球演化史都极其震撼。
  en: Developed by the University of Sydney and Caltech, GPlates lets researchers and students scrub through hundreds of millions of years of geological time on an interactive 3D globe to watch continents drift and collide.
review:
  zh: |
    GPlates 是 开源工具 领域中一款值得长期留存的代表作。由悉尼大学、加州理工学院与挪威地质调查局联合开发的 GPL 开源古地理与板块构造可视化软件。拖动时间轴就能在三维地球仪上直观演示几亿年来盘古大陆如何裂解漂移成今天的七大洲，不论是地质学研究还是给孩子科普地球演化史都极其震撼。

    在“真免费、少打扰”的维度上，它采用 GPL-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    GPlates is a standout choice in software tools. Developed by the University of Sydney and Caltech, GPlates lets researchers and students scrub through hundreds of millions of years of geological time on an interactive 3D globe to watch continents drift and collide.

    From a user-freedom perspective, it is released under the GPL-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
