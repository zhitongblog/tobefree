tagline:
  zh: 点一下把整个网页连带图片、字体和排版完美封存进单个独立 HTML 文件的存档神器
  en: Save a faithful copy of an entire web page (with images, fonts and styles) as a single HTML file
description:
  zh: AGPL-3.0 开源的网页永久存档扩展与 CLI 工具。浏览器自带的「网页另存为」总是拆出一堆零散文件夹还经常丢样式，SingleFile 则把页面上所有 CSS、矢量图、照片与字体内联打包进一个干干净净的 `.html` 文件，十年后断网双击依然原样打开。
  en: An AGPL-3.0 browser extension and CLI that packs a complete webpage — including CSS, images, web fonts and frames — into a single self-contained `.html` file that opens faithfully offline forever.
review:
  zh: |
    SingleFile 是 开源工具 领域中一款值得长期留存的代表作。AGPL-3.0 开源的网页永久存档扩展与 CLI 工具。浏览器自带的「网页另存为」总是拆出一堆零散文件夹还经常丢样式，SingleFile 则把页面上所有 CSS、矢量图、照片与字体内联打包进一个干干净净的 `.html` 文件，十年后断网双击依然原样打开。

    在“真免费、少打扰”的维度上，它采用 AGPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Windows、macOS、Linux、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    SingleFile is a standout choice in software tools. An AGPL-3.0 browser extension and CLI that packs a complete webpage — including CSS, images, web fonts and frames — into a single self-contained `.html` file that opens faithfully offline forever.

    From a user-freedom perspective, it is released under the AGPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Web browsers, Windows, macOS, Linux, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
