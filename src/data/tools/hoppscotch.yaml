description:
  zh: 轻量的开源 API 开发生态，浏览器里即开即用。支持 HTTP、GraphQL、WebSocket、MQTT 等协议，也提供桌面端与 CLI，还能自托管在自己的服务器上。
  en: A lightweight open-source API development ecosystem that runs right in the browser. It supports HTTP, GraphQL, WebSocket, MQTT and more, with desktop and CLI apps, and can be self-hosted on your own server.
review:
  zh: |
    Hoppscotch 是 开源工具 领域中一款值得长期留存的代表作。轻量的开源 API 开发生态，浏览器里即开即用。支持 HTTP、GraphQL、WebSocket、MQTT 等协议，也提供桌面端与 CLI，还能自托管在自己的服务器上。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Windows、macOS、Linux、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Hoppscotch is a standout choice in software tools. A lightweight open-source API development ecosystem that runs right in the browser. It supports HTTP, GraphQL, WebSocket, MQTT and more, with desktop and CLI apps, and can be self-hosted on your own server.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, ships with zero ads and no invasive telemetry. With native support across Web browsers, Windows, macOS, Linux, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
