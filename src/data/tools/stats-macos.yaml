tagline:
  zh: iStat Menus 的完美开源免费平替，在 Mac 菜单栏实时查看全套硬件状态
  en: Free, open-source macOS system monitor in your menu bar — a full alternative to iStat Menus
description:
  zh: MIT 开源的 macOS 菜单栏系统监控工具。涵盖 CPU、GPU、内存、磁盘读写、实时网速、电池健康度、传感器温度以及蓝牙设备电量，每个模块都能单独开关并自定义菜单栏图表样式，完全免费替代昂贵的付费监控软件。
  en: An MIT-licensed macOS menu bar monitor covering CPU, GPU, memory, disk, network, battery health, sensor temperatures and Bluetooth battery levels with customizable widgets.
review:
  zh: |
    Stats 是 开源工具 领域中一款值得长期留存的代表作。MIT 开源的 macOS 菜单栏系统监控工具。涵盖 CPU、GPU、内存、磁盘读写、实时网速、电池健康度、传感器温度以及蓝牙设备电量，每个模块都能单独开关并自定义菜单栏图表样式，完全免费替代昂贵的付费监控软件。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 macOS 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Stats is a standout choice in software tools. An MIT-licensed macOS menu bar monitor covering CPU, GPU, memory, disk, network, battery health, sensor temperatures and Bluetooth battery levels with customizable widgets.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across macOS, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
