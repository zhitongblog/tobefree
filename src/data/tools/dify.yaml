  zh: 熱門的 LLM 应用开发与可视化工作流平台。通过拖拽节点即可把本地大模型、知识库检索（RAG）、代码执行器与外部工具串联成完整的 AI 应用或 API，支持使用 Docker Compose 在本地或内网免费自建。
