tagline:
  zh: 两份文件哪里不一样，一眼看出来
  en: See exactly where two files differ, at a glance
description:
  zh: Windows 上的文件与文件夹差异对比工具。左右并排高亮显示差异，可以逐处合并，也能整棵目录树递归比较。支持文本、二进制、图片、Word/Excel/PDF（通过插件转换）对比，可以作为 Git 的外部 diff 和 merge 工具。
  en: A file and folder comparison tool for Windows. Differences are highlighted side by side and can be merged hunk by hunk, and entire directory trees compare recursively. It handles text, binary, image and — through plugins — Word, Excel and PDF comparison, and can serve as Git's external diff and merge tool.
review:
  zh: |
    "这两个版本到底哪不一样"是个高频问题：同事发回来一份改过的文档、
    备份目录和当前目录不知道差了哪些文件、配置文件改崩了想找出改动、
    Git 合并冲突要手工解决。

    WinMerge 是 Windows 上做这件事的老牌工具，9,095 颗星，GPL-2.0，维护了二十多年，
    当前版本 v2.16.58。

    两个核心能力：

    - **文件对比**。左右并排，差异行高亮，可以按块把左边的内容合并到右边或反过来。
      支持忽略空白、忽略大小写、忽略注释这类规则，
      避免因为格式化差异淹没真正的改动。
    - **文件夹对比**。选两个目录，它递归比较整棵树，列出"只在左边有""只在右边有"
      "两边都有但内容不同""完全相同"。同步备份目录、
      核对部署包和源码目录时特别有用，可以直接在结果里做双向同步。

    进阶用法：

    - **三方合并**。可以同时打开"我的版本""对方的版本""共同祖先"，
      这正是 Git 合并冲突的结构。在 Git 里配置成 mergetool 之后，
      `git mergetool` 会直接调它，比在编辑器里对着冲突标记手工改清楚得多。
    - **插件对比非文本文件**。装上插件后可以比较 Word、Excel、PDF 的文本内容，
      也能对比图片（像素差异高亮）和二进制文件（十六进制视图）。
    - **命令行调用**，可以写进脚本做自动化比对。

    要说清楚的：

    - **只有 Windows 版**。macOS 和 Linux 用户可以看 Meld（跨平台、界面更现代）
      或者直接用 `git diff`、`diff`、VS Code 内置的对比功能。
    - **界面是传统 Win32 风格**，功能密度高但谈不上好看。这是个二十年老工具该有的样子。
    - **大文件夹比较要花时间**，几十万个文件的目录树递归比较会跑一阵。

    如果你在 Windows 上写代码或者经常需要核对文件版本，这个工具装上不占空间，
    需要的时候能省很多眼力。
  en: |
    "What is actually different between these two versions" is a constant question: a colleague
    returns an edited document, a backup directory has drifted from the current one, a configuration
    file broke and you need to find the change, or a Git merge conflict needs resolving by hand.

    WinMerge is the veteran Windows tool for this. 9,095 stars, GPL-2.0, maintained for over two
    decades, currently at v2.16.58.

    Two core capabilities:

    - **File comparison.** Side by side with differing lines highlighted, and hunks mergeable in
      either direction. Rules for ignoring whitespace, case or comments keep formatting noise from
      burying the real changes.
    - **Folder comparison.** Point it at two directories and it recurses the whole tree, listing what
      exists only on the left, only on the right, in both but differing, or identical. Invaluable for
      reconciling backups or checking a deployment package against source, with two-way sync available
      directly from the results.

    Advanced uses:

    - **Three-way merge.** Open "mine", "theirs" and the common ancestor simultaneously — precisely
      the structure of a Git merge conflict. Configured as Git's mergetool, `git mergetool` invokes it
      directly, which is far clearer than editing conflict markers by hand.
    - **Plugin-based comparison of non-text files:** Word, Excel and PDF text content, plus images with
      pixel differences highlighted and binaries in a hex view.
    - **Command-line invocation** for scripted comparisons.

    To be clear about:

    - **Windows only.** macOS and Linux users should look at Meld, which is cross-platform with a more
      modern interface, or simply use `git diff`, `diff` or VS Code's built-in comparison.
    - **The interface is traditional Win32 styling** — dense with features, not attractive. Exactly
      what a twenty-year-old tool looks like.
    - **Large folder comparisons take time;** recursing a tree of hundreds of thousands of files runs
      for a while.

    If you write code on Windows or regularly reconcile file versions, this costs nothing to keep
    installed and saves considerable squinting when needed.
