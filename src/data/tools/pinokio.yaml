description:
  zh: 把繁琐的 Python 虚拟环境、CUDA 驱动、Git 克隆和依赖安装封装成一键脚本的开源 AI 应用管理器。无论是 ComfyUI、语音克隆、视频生成还是本地大模型，点一下就能在隔离环境中自动配好并启动，彻底告别命令行报错。
  en: An open-source autonomous browser that turns complex Python, Conda, Git and CUDA setups into one-click installs. Run ComfyUI, voice cloning, video generation and local LLMs in isolated environments without fighting terminal dependency errors.
