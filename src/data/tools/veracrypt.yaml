  zh: 给硬盘和 U 盘上锁的开源磁盘加密工具
  en: Open-source disk encryption that locks down drives and USB sticks
description:
  zh: 创建加密的虚拟磁盘或整盘加密，实时透明加解密，性能几乎无损。基于 TrueCrypt 改进而来，支持隐藏卷等高级功能，完全离线运行。
  en: Creates encrypted virtual disks or encrypts entire drives, with real-time transparent on-the-fly encryption and near-zero performance loss. Built on TrueCrypt with hidden volumes and other advanced features, running fully offline.
review:
  zh: |
    VeraCrypt 是 隐私、加密与安全防护 领域中一款值得长期留存的代表作。创建加密的虚拟磁盘或整盘加密，实时透明加解密，性能几乎无损。基于 TrueCrypt 改进而来，支持隐藏卷等高级功能，完全离线运行。

    在“真免费、少打扰”的维度上，它采用 Apache-2.0 / TrueCrypt License 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    VeraCrypt is a standout choice in privacy protection, encryption, and security. Creates encrypted virtual disks or encrypts entire drives, with real-time transparent on-the-fly encryption and near-zero performance loss. Built on TrueCrypt with hidden volumes and other advanced features, running fully offline.

    From a user-freedom perspective, it is released under the Apache-2.0 / TrueCrypt License open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
