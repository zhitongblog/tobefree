description:
  zh: 如果你在 NAS 上用 Navidrome 或 Jellyfin 搭了自己的私有无损音乐库，Feishin 就是电脑端体验最接近商业流媒体软件的 GPL-3.0 开源播放器。支持智能歌单、歌词显示、内置 MPV 音频后端直通播放与优雅的专辑墙浏览。
  en: A modern GPL-3.0 desktop and web music client for self-hosted Navidrome, Subsonic and Jellyfin servers, offering smart playlists, synchronized lyrics and an optional MPV audio backend.
