tagline:
  zh: 专为自建音乐库（Navidrome / Jellyfin）打造的高颜值开源桌面音乐客户端
  en: A modern open-source desktop music player for Navidrome, Subsonic and Jellyfin servers
description:
  zh: 如果你在 NAS 上用 Navidrome 或 Jellyfin 搭了自己的私有无损音乐库，Feishin 就是电脑端体验最接近商业流媒体软件的 GPL-3.0 开源播放器。支持智能歌单、歌词显示、内置 MPV 音频后端直通播放与优雅的专辑墙浏览。
  en: A modern GPL-3.0 desktop and web music client for self-hosted Navidrome, Subsonic and Jellyfin servers, offering smart playlists, synchronized lyrics and an optional MPV audio backend.
review:
  zh: |
    Feishin 是 开源工具 领域中一款值得长期留存的代表作。如果你在 NAS 上用 Navidrome 或 Jellyfin 搭了自己的私有无损音乐库，Feishin 就是电脑端体验最接近商业流媒体软件的 GPL-3.0 开源播放器。支持智能歌单、歌词显示、内置 MPV 音频后端直通播放与优雅的专辑墙浏览。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、Web 浏览器 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Feishin is a standout choice in software tools. A modern GPL-3.0 desktop and web music client for self-hosted Navidrome, Subsonic and Jellyfin servers, offering smart playlists, synchronized lyrics and an optional MPV audio backend.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, Web browsers, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
