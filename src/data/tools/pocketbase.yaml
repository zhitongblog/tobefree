tagline:
  zh: 仅需一个可执行文件的开源后端，内置 SQLite 数据库、用户鉴权与管理后台
  en: Open-source backend in 1 file with embedded SQLite database, realtime subscriptions, auth and admin UI
description:
  zh: 用 Go 编写的单文件 MIT 开源后端（BaaS）。下载一个十几兆的文件执行 `./pocketbase serve`，立刻获得带可视化网页后台的 SQLite 数据库、REST 与实时订阅 API、OAuth2 用户登录以及本地/S3 文件存储，是独立开发与内部小工具的绝配。
  en: An MIT-licensed backend packed into a single Go executable. Run one file to get an embedded SQLite database, realtime API subscriptions, user authentication, file storage and a clean web admin dashboard.
review:
  zh: |
    PocketBase 是 开源工具 领域中一款值得长期留存的代表作。用 Go 编写的单文件 MIT 开源后端（BaaS）。下载一个十几兆的文件执行 `./pocketbase serve`，立刻获得带可视化网页后台的 SQLite 数据库、REST 与实时订阅 API、OAuth2 用户登录以及本地/S3 文件存储，是独立开发与内部小工具的绝配。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    PocketBase is a standout choice in software tools. An MIT-licensed backend packed into a single Go executable. Run one file to get an embedded SQLite database, realtime API subscriptions, user authentication, file storage and a clean web admin dashboard.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
