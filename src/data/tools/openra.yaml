tagline:
  zh: 用现代开源引擎重制的《红色警戒》《命令与征服》与《沙丘 2000》，原生高分屏与联机大厅
  en: Open-source classic RTS game engine recreating Red Alert, Command & Conquer and Dune 2000
description:
  zh: GPL-3.0 开源的经典即时战略（RTS）游戏重制引擎。完美支持现代高分辨率宽屏、战争迷雾、单位生产队列、战局录像回放以及全球免费多人联机大厅，装完即可直接免费畅玩初代《红色警戒》《泰伯利亚黎明》与《沙丘 2000》。
  en: A GPL-3.0 engine that modernizes classic Westwood strategy games (Red Alert, Tiberian Dawn, Dune 2000) for current operating systems with widescreen support, fog of war, replays and built-in online multiplayer.
review:
  zh: |
    OpenRA 是 开源工具 领域中一款值得长期留存的代表作。GPL-3.0 开源的经典即时战略（RTS）游戏重制引擎。完美支持现代高分辨率宽屏、战争迷雾、单位生产队列、战局录像回放以及全球免费多人联机大厅，装完即可直接免费畅玩初代《红色警戒》《泰伯利亚黎明》与《沙丘 2000》。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    OpenRA is a standout choice in software tools. A GPL-3.0 engine that modernizes classic Westwood strategy games (Red Alert, Tiberian Dawn, Dune 2000) for current operating systems with widescreen support, fog of war, replays and built-in online multiplayer.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
