tagline:
  zh: 用 Rust 编写的高颜值实时网络流量监控软件，一眼看清本机正在和哪些国家的服务器通信
  en: Comfortable, cross-platform Rust application to comfortably monitor your Internet traffic in real time
description:
  zh: 如果你觉得 Wireshark 满屏十六进制报文像天书，用 Rust 编写的 Sniffnet 就是专门为普通人和开发者打造的直观网络监控仪。选择网卡后即可实时绘制上下行流量图，列出当前电脑连了哪些进程、目标 IP 归属国旗、ASN 运营商与服务端口。
  en: 'Written in Rust, Sniffnet makes network traffic inspection approachable for everyone: pick an adapter and watch live throughput charts, active processes, destination countries and ASN owners.'
review:
  zh: |
    Sniffnet 是 开源工具 领域中一款值得长期留存的代表作。如果你觉得 Wireshark 满屏十六进制报文像天书，用 Rust 编写的 Sniffnet 就是专门为普通人和开发者打造的直观网络监控仪。选择网卡后即可实时绘制上下行流量图，列出当前电脑连了哪些进程、目标 IP 归属国旗、ASN 运营商与服务端口。

    在“真免费、少打扰”的维度上，它采用 MIT / Apache-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Sniffnet is a standout choice in software tools. Written in Rust, Sniffnet makes network traffic inspection approachable for everyone: pick an adapter and watch live throughput charts, active processes, destination countries and ASN owners.

    From a user-freedom perspective, it is released under the MIT / Apache-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
