tagline:
  zh: 简洁直观的 MIT 开源自建月度预算与个人净值追踪面板
  en: A simple, self-hosted personal finance app for tracking monthly budgets and net worth
description:
  zh: MIT 开源的自托管个人财务看板（Mint 停服后的热门轻量替代方案）。界面清爽不复杂，一屏展示银行账户余额、信用卡账单、月度分类预算进度条与长期净值增长曲线，支持 CSV 导入与 Docker 一键部署。
  en: An MIT-licensed self-hosted finance dashboard built as a clean replacement for Mint, tracking transactions, monthly category budgets, savings goals and net worth trends.
review:
  zh: |
    Budget Board 是 开源工具 领域中一款值得长期留存的代表作。MIT 开源的自托管个人财务看板（Mint 停服后的热门轻量替代方案）。界面清爽不复杂，一屏展示银行账户余额、信用卡账单、月度分类预算进度条与长期净值增长曲线，支持 CSV 导入与 Docker 一键部署。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Linux、Windows、macOS 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Budget Board is a standout choice in software tools. An MIT-licensed self-hosted finance dashboard built as a clean replacement for Mint, tracking transactions, monthly category budgets, savings goals and net worth trends.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, ships with zero ads and no invasive telemetry. With native support across Web browsers, Linux, Windows, macOS, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
