tagline:
  zh: 搬进 SSH 字符终端里的 Wireshark，在无图形界面的远程服务器上直接交互式看 pcap 包
  en: A terminal UI for tshark, inspired by Wireshark, for inspecting packet captures over SSH
description:
  zh: MIT 开源的终端网络抓包分析界面（基于 tshark）。当你在远程 Linux 服务器上抓了一个 `.pcap` 包，不用大费周章拉回本地电脑，直接在 SSH 终端里运行 Termshark 就能像用桌面版 Wireshark 一样按显示过滤器筛选、展开每一层协议头并重组 TCP 流。
  en: An MIT-licensed terminal UI for tshark that brings Wireshark’s packet list, protocol tree dissection and TCP stream reassembly directly into your SSH session.
review:
  zh: |
    Termshark 是 开源工具 领域中一款值得长期留存的代表作。MIT 开源的终端网络抓包分析界面（基于 tshark）。当你在远程 Linux 服务器上抓了一个 `.pcap` 包，不用大费周章拉回本地电脑，直接在 SSH 终端里运行 Termshark 就能像用桌面版 Wireshark 一样按显示过滤器筛选、展开每一层协议头并重组 TCP 流。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Termshark is a standout choice in software tools. An MIT-licensed terminal UI for tshark that brings Wireshark’s packet list, protocol tree dissection and TCP stream reassembly directly into your SSH session.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
