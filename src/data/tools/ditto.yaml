  zh: 复制过的东西都还在，随时翻回来
  en: Everything you ever copied is still there, one hotkey away
description:
  zh: Windows 剪贴板历史管理器。保存你复制过的所有文本、图片和文件路径，按热键呼出列表，可以搜索、置顶常用条目、按分组归类。数据存在本地数据库，支持加密和局域网内多台电脑同步。安装包约 6 MB。
  en: A clipboard history manager for Windows. It keeps every text, image and file path you have copied, recalled through a hotkey with search, pinned frequently used entries and grouping. Data lives in a local database, with optional encryption and sync between machines on a local network. The installer is about 6 MB.
review:
  zh: |
    "刚才复制的那段又被覆盖了"——这是每个人每天都会遇到几次的小挫折。
    Windows 10 之后系统自带了剪贴板历史（Win+V），但它只存 25 条、
    重启就清空、不能搜索、要开云同步才能跨设备。

    Ditto 是这个领域用了快二十年的老工具。6,953 颗星，GPL-3.0，安装包 6 MB。

    它做的事：**你复制过的每一样东西都留着**。按热键（默认 Ctrl+反引号）
    弹出列表，最近的在最上面，直接输入关键词就能在历史里搜索——
    这是它比系统自带功能强最多的地方。找到之后回车粘贴。

    实用功能：

    - **全文搜索**。上周复制过的那个订单号、那段代码、那个地址，
      记得几个字就能找回来。历史条数可以设成几千条甚至不限。
    - **置顶常用条目**。签名、常用地址、模板文本可以固定在列表顶部，
      不会被新内容挤下去。
    - **支持多种格式**。纯文本、富文本、HTML、图片、文件路径都能存，
      粘贴时可以选择"以纯文本粘贴"去掉格式——这个功能单独就值得装它。
    - **分组管理**。工作用的、私人用的可以分开。
    - **局域网同步**。几台电脑之间同步剪贴板，不经过云端。
    - **加密存储**。数据库可以加密码。

    要说清楚的：

    - **只有 Windows**。macOS 上对应的是 Maccy 或 Raycast 的剪贴板功能，
      Linux 上有 CopyQ（跨平台，也可以在 Windows 上用）。
    - **发版节奏放缓**。当前版本 3.25.113.0 发布于 2025 年 9 月，
      仓库在 2026 年仍有提交但更新不频繁。它是一个功能已经稳定成熟的工具，
      不是无人维护，但别期待新特性。
    - **有隐私含义，要想清楚**。它会记录你复制的一切——
      包括你从密码管理器复制出来的密码。建议在设置里排除密码管理器的进程，
      或者给数据库加密，并且在共用电脑上谨慎使用。
      这不是它的缺陷，是所有剪贴板历史工具的共同特性。

    如果你每天大量复制粘贴，这是那种装上一周就再也离不开的工具。
  en: |
    "The thing I just copied got overwritten" is a small frustration everyone hits several times a day.
    Windows has had clipboard history since Windows 10 (Win+V), but it holds 25 items, clears on
    restart, cannot be searched, and needs cloud sync to cross devices.

    Ditto has been doing this job for nearly two decades. 6,953 stars, GPL-3.0, a 6 MB installer.

    Its premise: **everything you copy is kept.** A hotkey (Ctrl+backtick by default) brings up the
    list with the most recent on top, and typing searches the entire history — which is where it most
    exceeds the built-in feature. Enter pastes the match.

    Useful capabilities:

    - **Full-text search.** That order number, code snippet or address you copied last week comes back
      from a few remembered characters. History length is configurable into the thousands or unlimited.
    - **Pinned entries.** Signatures, frequent addresses and template text stay at the top instead of
      being pushed out by new content.
    - **Multiple formats.** Plain text, rich text, HTML, images and file paths are all retained, and
      "paste as plain text" strips formatting — a feature worth the install on its own.
    - **Groups** to keep work and personal material separate.
    - **Local network sync** between machines without a cloud service.
    - **Encrypted storage** with a password on the database.

    To be clear about:

    - **Windows only.** macOS equivalents are Maccy or Raycast's clipboard feature; Linux has CopyQ,
      which is cross-platform and also runs on Windows.
    - **Releases have slowed.** The current version, 3.25.113.0, shipped in September 2025, and the
      repository still saw commits through 2026 without frequent releases. It is a mature, stable tool
      rather than an abandoned one, but do not expect new features.
    - **Think about the privacy implications.** It records everything you copy — including passwords
      copied out of a password manager. Exclude your password manager's process in settings, or encrypt
      the database, and be careful on shared computers. This is not a flaw in Ditto; it is inherent to
      every clipboard history tool.

    If you copy and paste heavily, this is the kind of tool you cannot give up a week after installing.
