tagline:
  zh: 上传云盘前先加密，密钥只在你手里
  en: Encrypt files before they hit the cloud — the key stays with you
description:
  zh: 在本地为云盘文件做客户端加密，文件内容和文件名都用 AES-256 加密。上传 Dropbox、Google Drive、OneDrive 等前先建一个加密"保险库"，云服务商看不到明文。桌面版完全免费；iOS 和 Android 版免费时只能读取，写入要一次性内购解锁。
  en: Client-side encryption for your cloud files, protecting both contents and filenames with AES-256. Create an encrypted vault before syncing to Dropbox, Google Drive, OneDrive and more — the provider never sees plaintext. The desktop apps are fully free; the iOS and Android apps are read-only for free, with write access unlocked by a one-time in-app purchase.
review:
  zh: |
    Cryptomator 是 隐私、加密与安全防护 领域中一款值得长期留存的代表作。在本地为云盘文件做客户端加密，文件内容和文件名都用 AES-256 加密。上传 Dropbox、Google Drive、OneDrive 等前先建一个加密"保险库"，云服务商看不到明文。桌面版完全免费；iOS 和 Android 版免费时只能读取，写入要一次性内购解锁。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、iOS、Android 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Cryptomator is a standout choice in privacy protection, encryption, and security. Client-side encryption for your cloud files, protecting both contents and filenames with AES-256. Create an encrypted vault before syncing to Dropbox, Google Drive, OneDrive and more — the provider never sees plaintext. The desktop apps are fully free; the iOS and Android apps are read-only for free, with write access unlocked by a one-time in-app purchase.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, iOS, Android, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
