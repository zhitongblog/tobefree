description:
  zh: Postman 的开源本地替代品。请求以纯文本文件存在你的文件系统里，可直接用 Git 版本管理和团队协作。没有账号、不上云、数据永远只在本地。
  en: An open-source, local alternative to Postman. Requests are saved as plain-text files on your filesystem, so you version and share them with Git. No account, no cloud — your data stays on your machine.
review:
  zh: |
    Bruno 是 开源工具 领域中一款值得长期留存的代表作。Postman 的开源本地替代品。请求以纯文本文件存在你的文件系统里，可直接用 Git 版本管理和团队协作。没有账号、不上云、数据永远只在本地。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Bruno is a standout choice in software tools. An open-source, local alternative to Postman. Requests are saved as plain-text files on your filesystem, so you version and share them with Git. No account, no cloud — your data stays on your machine.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
