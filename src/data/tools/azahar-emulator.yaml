tagline:
  zh: Citra 停更后由 Lime3DS 与 PabloMK7 两大核心分支强强合并而成的正统开源 3DS 模拟器
  en: The unified open-source Nintendo 3DS emulator born from the merger of Lime3DS and PabloMK7’s Citra fork
description:
  zh: 在老牌 3DS 模拟器 Citra 关停后，社区最活跃的两大继承分支（Lime3DS 与原 Citra 核心开发者 PabloMK7 的分支）正式合并推出的 GPL 开源正统续作。支持 Vulkan 高倍分辨率渲染、右摇杆视角映射与陀螺仪模拟，无任何山寨收费套路。
  en: Created by merging the two leading post-Citra projects (Lime3DS and PabloMK7’s fork), Azahar is the flagship GPL-2.0 Nintendo 3DS emulator across desktop and Android.
