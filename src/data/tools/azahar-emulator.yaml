tagline:
  zh: Citra 停更后由 Lime3DS 与 PabloMK7 两大核心分支强强合并而成的正统开源 3DS 模拟器
  en: The unified open-source Nintendo 3DS emulator born from the merger of Lime3DS and PabloMK7’s Citra fork
description:
  zh: 在老牌 3DS 模拟器 Citra 关停后，社区最活跃的两大继承分支（Lime3DS 与原 Citra 核心开发者 PabloMK7 的分支）正式合并推出的 GPL 开源正统续作。支持 Vulkan 高倍分辨率渲染、右摇杆视角映射与陀螺仪模拟，无任何山寨收费套路。
  en: Created by merging the two leading post-Citra projects (Lime3DS and PabloMK7’s fork), Azahar is the flagship GPL-2.0 Nintendo 3DS emulator across desktop and Android.
review:
  zh: |
    Azahar (3DS) 是 开源工具 领域中一款值得长期留存的代表作。在老牌 3DS 模拟器 Citra 关停后，社区最活跃的两大继承分支（Lime3DS 与原 Citra 核心开发者 PabloMK7 的分支）正式合并推出的 GPL 开源正统续作。支持 Vulkan 高倍分辨率渲染、右摇杆视角映射与陀螺仪模拟，无任何山寨收费套路。

    在“真免费、少打扰”的维度上，它采用 GPL-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、Android 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Azahar (3DS) is a standout choice in software tools. Created by merging the two leading post-Citra projects (Lime3DS and PabloMK7’s fork), Azahar is the flagship GPL-2.0 Nintendo 3DS emulator across desktop and Android.

    From a user-freedom perspective, it is released under the GPL-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, Android, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
