tagline:
  zh: 解锁完整 about:config 高级设置与海量扩展支持的安卓 Firefox 开源强化分支
  en: An open-source Android browser forked from Firefox with broad add-on support and about:config unlocked
description:
  zh: 基于 Mozilla Android 组件构建的开源手机浏览器。针对官方移动版 Firefox 正式版隐藏 `about:config` 及部分高级选项的限制，Iceraven 默认开放完整底层配置、剥离遥测统计，并提供极其丰富的自定义扩展安装列表。
  en: An MPL-2.0 Android browser based on Mozilla Fenix that unlocks `about:config` in stable builds, strips telemetry and exposes an expanded catalog of browser extensions and UI tweaks.
