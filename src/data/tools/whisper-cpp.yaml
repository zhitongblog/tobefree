description:
  zh: "OpenAI Whisper 的 C++ 推理实现，不依赖 Python 环境，CPU 上也能跑完整模型。没有图形界面，提供命令行和库两种用法，适合接进脚本和自己的程序。五个常见选择里最活跃的一个。"
  en: "A C++ inference implementation of OpenAI Whisper with no Python dependency, capable of running full models on CPU. No GUI; it ships as a command line tool and a library, suited to scripts and your own programs. The most actively developed of the common options."
review:
  zh: |
    whisper.cpp 是把本地语音转文字接进自己流程时最省心的一个。52,897 颗星，MIT 协议，
    最新 v1.9.2 发布于 2026 年 8 月 4 日，是这一批里更新最勤的。

    它最大的实际好处是不需要 Python 环境——很多人卡在装依赖上，这个直接编译或用包管理器装完就能跑。
    CPU 也能出结果，只是慢。

    它没有图形界面。想点开就用的话看 Vibe 或 Buzz；要做字幕分说话人看 whisperX。

    还有个跟工具无关但更要紧的点：中文准不准取决于你跑多大的模型。tiny 只有 75 MiB 但错字多，
    large-v3 要 2.9 GiB，量化版 1.1 GiB 是机器一般时的折中。
  en: |
    whisper.cpp is the least painful way to wire local transcription into your own workflow.
    52,897 stars, MIT, and the latest v1.9.2 shipped on 4 August 2026 — the most frequently
    updated of this group.

    Its practical advantage is needing no Python environment. Dependency setup is where most
    people get stuck; here you compile it or install via a package manager and it runs. CPU-only
    works, just slower.

    There is no GUI. For point-and-click use see Vibe or Buzz; for subtitles with speaker labels
    see whisperX.

    One thing that matters more than the tool choice: accuracy depends on the model size you can
    run. tiny is 75 MiB but error-prone; large-v3 needs 2.9 GiB, with the quantized build at
    1.1 GiB as the sensible middle ground.
