tagline:
  zh: 80+ 款程序员与运维常用在线小工具合集，一条 Docker 命令自建内网工具站
  en: Collection of 80+ handy web utilities for developers and sysadmins, ready to self-host via Docker
description:
  zh: GPL-3.0 开源的 Web 工具箱，汇集了 Token 生成、哈希加密、Docker run 转 docker-compose、Chmod 计算器、IPv4 子网划分、二维码生成、JSON/YAML/TOML 互转等 80 多种高频工具。官网直接免费免登录可用，也能用一条 Docker 命令部署在自己内网。
  en: A GPL-3.0 web app bundling over 80 everyday utilities — Docker run to Compose converter, subnet calculator, token generator, crontab helper, JSON/YAML converters and more. Use it free on the web or self-host with one Docker command.
review:
  zh: |
    IT-Tools 是 开源工具 领域中一款值得长期留存的代表作。GPL-3.0 开源的 Web 工具箱，汇集了 Token 生成、哈希加密、Docker run 转 docker-compose、Chmod 计算器、IPv4 子网划分、二维码生成、JSON/YAML/TOML 互转等 80 多种高频工具。官网直接免费免登录可用，也能用一条 Docker 命令部署在自己内网。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Linux、Windows、macOS 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    IT-Tools is a standout choice in software tools. A GPL-3.0 web app bundling over 80 everyday utilities — Docker run to Compose converter, subnet calculator, token generator, crontab helper, JSON/YAML converters and more. Use it free on the web or self-host with one Docker command.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Web browsers, Linux, Windows, macOS, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
