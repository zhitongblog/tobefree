tagline:
  zh: 安静无打扰的开源桌面番茄钟，自带内置任务清单与休息强制提醒
  en: A sleek, distraction-free open-source Pomodoro timer for desktop with built-in task lists
description:
  zh: MIT 开源的跨平台番茄工作法计时器。现在连个简单的倒计时软件都流行弹广告或收订阅费，Pomatez 完全离线、零账号、零弹窗推销，支持自定义专注/短休/长休时长、内置当前任务待办列表与全局快捷键。
  en: An MIT-licensed desktop Pomodoro timer that stays completely offline with zero account prompts or subscription nags. Includes customizable work/break intervals, a built-in task list and global shortcuts.
review:
  zh: |
    Pomatez 是 效率与知识管理 领域中一款值得长期留存的代表作。MIT 开源的跨平台番茄工作法计时器。现在连个简单的倒计时软件都流行弹广告或收订阅费，Pomatez 完全离线、零账号、零弹窗推销，支持自定义专注/短休/长休时长、内置当前任务待办列表与全局快捷键。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Pomatez is a standout choice in productivity and knowledge management. An MIT-licensed desktop Pomodoro timer that stays completely offline with zero account prompts or subscription nags. Includes customizable work/break intervals, a built-in task list and global shortcuts.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
