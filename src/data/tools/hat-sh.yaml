tagline:
  zh: 不用装任何软件，直接在浏览器本地完成大文件加密与公钥加密的开源小站
  en: Fast, serverless client-side file encryption in your browser using XChaCha20-Poly1305
description:
  zh: MIT 开源的无服务端网页文件加密工具。利用现代浏览器的 WebCrypto 与流式分块加密技术，文件全程一字节都不会上传到服务器，支持使用密码或 X25519 公钥对几个 GB 的大文件在本地浏览器内秒级加密。
  en: An MIT-licensed web app that encrypts and decrypts large files completely inside your browser via chunked XChaCha20-Poly1305 and Argon2id — zero bytes ever leave your device.
