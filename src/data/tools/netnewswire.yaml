tagline:
  zh: 苹果生态最纯粹的 MIT 开源原生 RSS 阅读器，支持 iCloud 与 FreshRSS 同步
  en: Free, open-source native RSS reader for Mac, iPhone and iPad with zero tracking
description:
  zh: Mac 与 iOS 上历史最悠久、口碑最好的开源原生 RSS 阅读器。不要求注册任何账号，不收集任何阅读习惯，支持直接本地抓取订阅源，也可以免费通过系统自带的 iCloud 或你自建的 FreshRSS / Miniflux 跨设备同步已读状态。
  en: A beloved MIT-licensed native RSS reader for macOS and iOS. Requires no account, collects zero analytics, and syncs directly via iCloud or self-hosted FreshRSS/Miniflux servers.
review:
  zh: |
    NetNewsWire 是 效率与知识管理 领域中一款值得长期留存的代表作。Mac 与 iOS 上历史最悠久、口碑最好的开源原生 RSS 阅读器。不要求注册任何账号，不收集任何阅读习惯，支持直接本地抓取订阅源，也可以免费通过系统自带的 iCloud 或你自建的 FreshRSS / Miniflux 跨设备同步已读状态。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 macOS、iOS 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    NetNewsWire is a standout choice in productivity and knowledge management. A beloved MIT-licensed native RSS reader for macOS and iOS. Requires no account, collects zero analytics, and syncs directly via iCloud or self-hosted FreshRSS/Miniflux servers.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across macOS, iOS, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
