tagline:
  zh: 苹果生态最纯粹的 MIT 开源原生 RSS 阅读器，支持 iCloud 与 FreshRSS 同步
  en: Free, open-source native RSS reader for Mac, iPhone and iPad with zero tracking
description:
  zh: Mac 与 iOS 上历史最悠久、口碑最好的开源原生 RSS 阅读器。不要求注册任何账号，不收集任何阅读习惯，支持直接本地抓取订阅源，也可以免费通过系统自带的 iCloud 或你自建的 FreshRSS / Miniflux 跨设备同步已读状态。
  en: A beloved MIT-licensed native RSS reader for macOS and iOS. Requires no account, collects zero analytics, and syncs directly via iCloud or self-hosted FreshRSS/Miniflux servers.
