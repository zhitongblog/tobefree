tagline:
  zh: 开源游戏史上内容最宏大的奇幻六角格战棋大作，内置十几个长篇战役与上百个社区模组
  en: Classic open-source turn-based hex tactical strategy game with 17 campaigns and ratusan add-ons
description:
  zh: 持续开发超过二十年的殿堂级 GPL 开源回合制战棋游戏（《韦诺之战》）。自带完整的官方中文，包含 17 个主线长篇单人剧情战役、六大种族兵种晋升树、地形闪避与昼夜系统，游戏内直接提供完全免费的社区创意工坊下载数百个玩家自制战役。
  en: Polished over two decades under GPL-2.0, Wesnoth is a deep turn-based fantasy tactical strategy game featuring 17 official single-player campaigns, unit leveling trees, multiplayer and an in-game add-on server.
