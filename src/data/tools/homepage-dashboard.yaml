description:
  zh: 专为 Homelab 与 NAS 玩家打造的 GPL-3.0 开源起始页。支持通过 Docker 标签自动发现容器服务，并内置对 Jellyfin、qBittorrent、AdGuard Home、Immich、Nextcloud 等上百款自建服务的深度 API 集成，直接在图标卡片上显示实时下载速度、拦截数与排队任务。
  en: A GPL-3.0 startpage for homelabs and NAS setups. Discovers services automatically via Docker labels and ships over 100 built-in API widgets showing live stats from Jellyfin, qBittorrent, Pi-hole, Immich and Nextcloud.
