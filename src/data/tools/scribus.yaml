review:
  zh: |
    Scribus 是 设计、图像与音视频创作 领域中一款值得长期留存的代表作。专业级桌面出版工具，支持 CMYK、专色、ICC 色彩管理和高质量 PDF 输出，适合排版报刊、画册、海报与书籍。装完即用，永不订阅。

    在“真免费、少打扰”的维度上，它采用 GPL-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Scribus is a standout choice in creative design, imaging, and audio/video production. A professional desktop publishing tool with CMYK, spot colors, ICC color management and high-quality PDF output — ideal for newsletters, brochures, posters and books. Install once, never subscribe.

    From a user-freedom perspective, it is released under the GPL-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
