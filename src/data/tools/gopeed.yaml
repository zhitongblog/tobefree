tagline:
  zh: 用 Go + Flutter 编写的全平台开源高速下载器，支持 HTTP、BT 磁力与自定义解析扩展
  en: High-speed open-source download manager supporting HTTP, BitTorrent and Magnet across all platforms
description:
  zh: GPL-3.0 开源的全平台下载器（Go 后端 + Flutter 界面，覆盖电脑、手机与 Docker Web 端）。不依赖外部 aria2 进程，原生支持多线程 HTTP 与 BitTorrent / 磁力链接下载，并独创 JavaScript 插件机制，可通过社区扩展直接解析网盘或音视频流媒体地址。
  en: Written in Go and Flutter under GPL-3.0, Gopeed runs natively on desktop, mobile and Docker, handling HTTP multi-threading, BitTorrent/Magnet links and custom JavaScript extractor extensions.
review:
  zh: |
    Gopeed 是 开源工具 领域中一款值得长期留存的代表作。GPL-3.0 开源的全平台下载器（Go 后端 + Flutter 界面，覆盖电脑、手机与 Docker Web 端）。不依赖外部 aria2 进程，原生支持多线程 HTTP 与 BitTorrent / 磁力链接下载，并独创 JavaScript 插件机制，可通过社区扩展直接解析网盘或音视频流媒体地址。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、Android、iOS、Web 浏览器 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Gopeed is a standout choice in software tools. Written in Go and Flutter under GPL-3.0, Gopeed runs natively on desktop, mobile and Docker, handling HTTP multi-threading, BitTorrent/Magnet links and custom JavaScript extractor extensions.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, Android, iOS, Web browsers, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
