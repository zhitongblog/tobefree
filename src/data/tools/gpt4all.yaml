description:
  zh: 由 Nomic AI 开源的跨平台本地大模型桌面应用。主打零配置与普通消费级电脑友好，内置「LocalDocs」功能，只需指定本地文件夹即可离线针对 PDF、Word 和 Markdown 文档提问，全程无需联网或注册账号。
  en: An open-source desktop application by Nomic AI designed to run LLMs on everyday consumer hardware. Its built-in LocalDocs feature lets you point at a local folder of PDFs, Word docs and Markdown files and chat with them completely offline.
