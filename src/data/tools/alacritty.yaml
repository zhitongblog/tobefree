tagline:
  zh: "GPU 渲染的极简终端，故意不做标签页"
  en: "A GPU-rendered minimal terminal that deliberately omits tabs"
description:
  zh: "Apache-2.0 开源的跨平台终端，65,406 颗星，用 Rust 写，GPU 渲染。配置写在 TOML 文件里。它刻意不做标签页和分屏——那些交给 tmux，所以喜欢的人觉得干净，不喜欢的人觉得功能缺失。"
  en: "An Apache-2.0 cross-platform terminal with 65,406 stars, written in Rust with GPU rendering and configured through a TOML file. It deliberately omits tabs and splits, leaving those to tmux — which reads as clean to some people and as missing features to others."
review:
  zh: |
    Alacritty 的定位很清楚：把一件事做到最快，其余交给别的工具。65,406 颗星，Apache-2.0，
    Rust 写的，GPU 渲染。

    它不做标签页也不做分屏，官方立场就是那是 tmux 的活。已经在用 tmux 的人会觉得这很干净，
    没用过 tmux 的人第一反应通常是「怎么连标签页都没有」。

    配置是 TOML 文件，没有图形界面。想点着配就看 Tabby。
  en: |
    Alacritty's position is unambiguous: do one thing as fast as possible and delegate the rest.
    65,406 stars, Apache-2.0, written in Rust with GPU rendering.

    It has no tabs and no splits, and the project's stance is that those belong to tmux. If you
    already live in tmux this feels clean; if you do not, the first reaction is usually "it does not
    even have tabs?"

    Configuration is a TOML file with no GUI. If you want to click through settings, see Tabby.
