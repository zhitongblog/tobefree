tagline:
  zh: Arduino 与树莓派创客必用的开源电子设计软件，面包板接线图一键同步转 PCB
  en: Open-source electronics design tool that bridges breadboard prototypes, schematics and PCBs
description:
  zh: 创客与硬件教程里出镜率最高的 GPL-3.0 开源电子设计软件。你只需在可视化的虚拟面包板上把传感器、电阻与 Arduino 开发板用杜邦线连好，软件就会自动同步生成标准电路原理图与可打样的 PCB 版图。
  en: A GPL-3.0 electronics prototyping tool that lets makers wire virtual breadboards with Arduino and Raspberry Pi components and switch seamlessly to schematics and PCB layout.
review:
  zh: |
    Fritzing 是 开源工具 领域中一款值得长期留存的代表作。创客与硬件教程里出镜率最高的 GPL-3.0 开源电子设计软件。你只需在可视化的虚拟面包板上把传感器、电阻与 Arduino 开发板用杜邦线连好，软件就会自动同步生成标准电路原理图与可打样的 PCB 版图。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Fritzing is a standout choice in software tools. A GPL-3.0 electronics prototyping tool that lets makers wire virtual breadboards with Arduino and Raspberry Pi components and switch seamlessly to schematics and PCB layout.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
