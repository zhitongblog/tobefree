tagline:
  zh: Mac 安全专家打造的开源免费出站防火墙，拦截软件后台悄悄传数据
  en: Free, open-source macOS outbound firewall by Objective-See that blocks unknown connections
description:
  zh: 由知名苹果安全研究机构 Objective-See（Patrick Wardle）开源的 macOS 防火墙。macOS 自带防火墙只管外部连入、不管内部软件往外发数据，LuLu 则专门盯防本机软件的出站请求，帮你一举掐断破解软件后门或流氓应用的遥测上报。
  en: Built by macOS security researcher Patrick Wardle (Objective-See), LuLu monitors outgoing network traffic on your Mac and alerts you whenever an app or background daemon tries to phone home without permission.
