tagline:
  zh: 用标准 Python 语法统合近百个开源数学库的科研级数学软件系统
  en: Free open-source mathematics software system unifying NumPy, SciPy, SymPy, Maxima, GAP and PARI/GP
description:
  zh: 以「创造 Magma、Maple、Mathematica 和 MATLAB 的开源自由替代品」为使命的大型 GPL-3.0 数学软件。它不是从零造轮子，而是用统一的 Python 接口把数论（PARI/GP）、群论（GAP）、符号计算（Maxima/SymPy）和科学计算（NumPy/SciPy）无缝整合在一起，密码学与纯数学研究者必装。
  en: Built under GPL-3.0 to provide a viable free open-source alternative to Magma, Maple, Mathematica and MATLAB by integrating GAP, Maxima, PARI/GP, SymPy and SciPy behind a unified Python-based interface.
