tagline:
  zh: 用标准 Python 语法统合近百个开源数学库的科研级数学软件系统
  en: Free open-source mathematics software system unifying NumPy, SciPy, SymPy, Maxima, GAP and PARI/GP
description:
  zh: 以「创造 Magma、Maple、Mathematica 和 MATLAB 的开源自由替代品」为使命的大型 GPL-3.0 数学软件。它不是从零造轮子，而是用统一的 Python 接口把数论（PARI/GP）、群论（GAP）、符号计算（Maxima/SymPy）和科学计算（NumPy/SciPy）无缝整合在一起，密码学与纯数学研究者必装。
  en: Built under GPL-3.0 to provide a viable free open-source alternative to Magma, Maple, Mathematica and MATLAB by integrating GAP, Maxima, PARI/GP, SymPy and SciPy behind a unified Python-based interface.
review:
  zh: |
    SageMath 是 开源工具 领域中一款值得长期留存的代表作。以「创造 Magma、Maple、Mathematica 和 MATLAB 的开源自由替代品」为使命的大型 GPL-3.0 数学软件。它不是从零造轮子，而是用统一的 Python 接口把数论（PARI/GP）、群论（GAP）、符号计算（Maxima/SymPy）和科学计算（NumPy/SciPy）无缝整合在一起，密码学与纯数学研究者必装。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Linux、macOS、Windows、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    SageMath is a standout choice in software tools. Built under GPL-3.0 to provide a viable free open-source alternative to Magma, Maple, Mathematica and MATLAB by integrating GAP, Maxima, PARI/GP, SymPy and SciPy behind a unified Python-based interface.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Linux, macOS, Windows, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
