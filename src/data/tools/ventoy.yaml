tagline:
  zh: 拖进 ISO 就能启动的多系统 U 盘方案
  en: Drop in an ISO and boot — the multi-ISO USB solution
description:
  zh: 一次安装到 U 盘，之后只需把 ISO/WIM/IMG 等文件直接拖进去即可启动，无需反复格式化。一个 U 盘承载多个系统，启动时菜单选择。
  en: Install once to a USB drive, then just drag ISO/WIM/IMG files onto it and boot directly — no reformatting ever again. One stick holds many systems with a boot-time menu.
review:
  zh: |
    Ventoy 是 开源工具 领域中一款值得长期留存的代表作。一次安装到 U 盘，之后只需把 ISO/WIM/IMG 等文件直接拖进去即可启动，无需反复格式化。一个 U 盘承载多个系统，启动时菜单选择。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Ventoy is a standout choice in software tools. Install once to a USB drive, then just drag ISO/WIM/IMG files onto it and boot directly — no reformatting ever again. One stick holds many systems with a boot-time menu.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
