tagline:
  zh: 在电脑与 Steam Deck 上免登录索尼云端、支持 HDR 与自适应扳机的开源 PS5 / PS4 远程串流客户端
  en: Open-source PlayStation 5 and PS4 Remote Play client supporting HDR and DualSense haptics
description:
  zh: 索尼官方 Remote Play 客户端不仅限制多、不支持 Linux/Steam Deck，还经常因为外网连不上 PSN 就不让在自家客厅局域网串流。chiaki-ng 是 GPL-3.0 开源的第三方串流神器，支持纯局域网唤醒直连、HDR 高动态范围画面与 DualSense 手柄完整震动反馈。
  en: A GPL-3.0 PlayStation Remote Play client for Windows, macOS, Linux and Steam Deck offering higher bitrates, HDR streaming, DualSense adaptive triggers and offline LAN connection.
review:
  zh: |
    chiaki-ng 是 开源工具 领域中一款值得长期留存的代表作。索尼官方 Remote Play 客户端不仅限制多、不支持 Linux/Steam Deck，还经常因为外网连不上 PSN 就不让在自家客厅局域网串流。chiaki-ng 是 GPL-3.0 开源的第三方串流神器，支持纯局域网唤醒直连、HDR 高动态范围画面与 DualSense 手柄完整震动反馈。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    chiaki-ng is a standout choice in software tools. A GPL-3.0 PlayStation Remote Play client for Windows, macOS, Linux and Steam Deck offering higher bitrates, HDR streaming, DualSense adaptive triggers and offline LAN connection.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
