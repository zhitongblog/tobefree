description:
  zh: 开源的图表绘制工具，用于流程图、架构图、UML、网络拓扑、思维导图和原型草图。桌面版完全离线，文件存在你自己的硬盘上。图形库覆盖 AWS、Azure、Kubernetes、Cisco 等主流技术图标，可导出 PNG、SVG、PDF 和可再编辑的 XML。
  en: An open-source diagramming tool for flowcharts, architecture diagrams, UML, network topology, mind maps and wireframes. The desktop build works entirely offline with files stored on your own disk. Shape libraries cover AWS, Azure, Kubernetes, Cisco and other major technology icon sets, and exports include PNG, SVG, PDF and re-editable XML.
review:
  zh: |
    画个流程图这件事，商业工具的套路已经很成熟了：免费版限 3 张图、
    高级图形要订阅、导出高清要付费、文件存在他们的云上、
    团队协作按人头收月费。

    draw.io 把这些全部去掉了。Apache-2.0 开源，**图的数量不限、
    图形库全部开放、导出没有水印和分辨率限制、不需要注册账号**。

    强烈建议装**桌面版**而不是只用网页版。桌面版完全离线运行，
    文件是普通的 `.drawio` 文件，存在你自己的硬盘或 Git 仓库里，
    不经过任何服务器。对于画公司内部架构图这类场景，这一点很重要——
    很多人没意识到自己把内网拓扑画在了别人的云上。

    图形库的覆盖是它的隐藏优势：AWS、Azure、GCP、Kubernetes、Cisco、
    各种网络设备和机架图标都是官方风格的现成图形，
    画云架构图不用自己找素材。UML、ER 图、泳道图、BPMN 也都有模板。

    几个实用细节：

    - **导出格式丰富**。PNG、JPG、SVG、PDF 都有，SVG 和 PDF 是矢量的，
      放大不糊，写文档和做 PPT 时很有用。
    - **可编辑的导出**。导出 PNG 时可以勾选"包含图表副本"，
      别人拿到这张 PNG 拖回 draw.io 就能继续编辑，不用另外传源文件。
    - **和文档工具集成好**。VS Code 有官方扩展可以直接编辑 `.drawio` 文件，
      Confluence、Notion 等也有集成。
    - **纯文本格式**。`.drawio` 本质是 XML，能进 Git 做版本管理，改动能看 diff。

    要说清楚的：

    - **它偏"工程图"而不是"美术图"**。做技术文档、流程说明、系统架构非常合适；
      要做视觉精美的信息图或海报，Inkscape 或 Penpot 更对路。
    - **实时多人协作需要接第三方存储**（比如 Google Drive、OneDrive），
      不像商业工具那样开箱即用。个人和小团队通常用不上这个。
    - 桌面版的下载在 drawio-desktop 仓库的 Releases 里，别下错成源码。
  en: |
    Drawing a flowchart has a well-established commercial playbook: three diagrams on the free tier,
    advanced shape libraries behind a subscription, high-resolution export as a paid feature, files
    stored in their cloud, and per-seat monthly billing for collaboration.

    draw.io removes all of it. Apache-2.0, and **unlimited diagrams, every shape library open, exports
    without watermarks or resolution caps, and no account required.**

    Install the **desktop build** rather than relying on the web version. It runs fully offline, and
    your files are ordinary `.drawio` files on your own disk or in a Git repository, never touching a
    server. That matters more than people realize for internal architecture diagrams — plenty of
    network topologies have been drawn onto someone else's cloud without a second thought.

    The shape libraries are an underrated advantage: AWS, Azure, GCP, Kubernetes, Cisco, network
    equipment and rack diagrams all ship as official-style ready-made shapes, so cloud architecture
    diagrams need no asset hunting. UML, ER diagrams, swimlanes and BPMN have templates too.

    Practical details worth knowing:

    - **Rich export formats.** PNG, JPG, SVG and PDF, with SVG and PDF vector-based so they stay sharp
      when scaled — genuinely useful for documents and slides.
    - **Editable exports.** When exporting PNG you can include a copy of the diagram, so whoever
      receives that PNG can drag it back into draw.io and keep editing without a separate source file.
    - **Good tooling integration.** VS Code has an official extension for editing `.drawio` files
      directly, and Confluence, Notion and others integrate as well.
    - **A plain-text format.** `.drawio` is XML underneath, so it version-controls in Git with readable
      diffs.

    To be clear about:

    - **It leans toward engineering diagrams rather than visual design.** Excellent for technical
      documentation, process descriptions and system architecture; for polished infographics or
      posters, Inkscape or Penpot fit better.
    - **Real-time collaboration requires third-party storage** such as Google Drive or OneDrive rather
      than working out of the box. Individuals and small teams rarely need it.
    - Desktop downloads live in the drawio-desktop repository's releases — do not grab the source
      repository by mistake.
