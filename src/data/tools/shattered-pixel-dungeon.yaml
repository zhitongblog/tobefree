description:
  zh: GPL-3.0 开源的《破碎的像素地牢》。每一局都是随机生成的 26 层地牢、随机药水卷轴鉴定与五大独特职业，没有任何体力限制、复活广告或属性内购，GitHub Releases 与 F-Droid 直接提供全平台免费安装包。
  en: A beloved GPL-3.0 roguelike RPG with five distinct heroes, randomized levels and hundreds of items across 26 dungeon floors — completely playable offline with zero ads or pay-to-win microtransactions.
