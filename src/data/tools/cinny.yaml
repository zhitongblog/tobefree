tagline:
  zh: 颜值最高、交互最像 Discord 的现代 Matrix 端到端加密聊天客户端
  en: A sleek, modern Matrix client focusing on a clean, Discord-like interface and end-to-end encryption
description:
  zh: AGPL-3.0 开源的 Matrix 协议网页与桌面客户端。如果你觉得官方 Element 的界面还是偏传统技术风，Cinny 提供了极度清爽的现代化社区频道（Spaces）、话题串、表情回应与完整的端到端加密（E2EE）支持。
  en: An AGPL-3.0 Matrix client for web and desktop that pairs full end-to-end encryption and decentralized server support with a clean, Discord-inspired Spaces and channel layout.
review:
  zh: |
    Cinny 是 开源工具 领域中一款值得长期留存的代表作。AGPL-3.0 开源的 Matrix 协议网页与桌面客户端。如果你觉得官方 Element 的界面还是偏传统技术风，Cinny 提供了极度清爽的现代化社区频道（Spaces）、话题串、表情回应与完整的端到端加密（E2EE）支持。

    在“真免费、少打扰”的维度上，它采用 AGPL-3.0 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Cinny is a standout choice in software tools. An AGPL-3.0 Matrix client for web and desktop that pairs full end-to-end encryption and decentralized server support with a clean, Discord-inspired Spaces and channel layout.

    From a user-freedom perspective, it is released under the AGPL-3.0 open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, ships with zero ads and no invasive telemetry. With native support across Web browsers, Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
