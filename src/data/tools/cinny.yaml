  zh: AGPL-3.0 开源的 Matrix 协议网页与桌面客户端。如果你觉得官方 Element 的界面还是偏传统技术风，Cinny 提供了极度清爽的现代化社区频道（Spaces）、话题串、表情回应与完整的端到端加密（E2EE）支持。
