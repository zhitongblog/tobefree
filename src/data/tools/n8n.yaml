description:
  zh: 全球最受欢迎的自托管工作流自动化平台。在可视化画布上把 Webhook、定时任务、数据库、飞书/Telegram/Slack 通知、自定义 JS/Python 代码以及本地 Ollama 大模型串联成全自动流水线，个人与内部业务使用 Docker 自建完全免费且不限执行次数。
  en: A node-based workflow automation tool that lets you wire webhooks, cron jobs, databases, chat apps, custom JS/Python code and local LLMs together. Free for self-hosting on your own server with unlimited workflow executions.
