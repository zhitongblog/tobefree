tagline:
  zh: 可免费自建的 Zapier 强力替代品，内置 400+ 集成节点与本地 AI 工作流
  en: Self-hostable workflow automation platform with 400+ integrations and native AI agent nodes
description:
  zh: 全球最受欢迎的自托管工作流自动化平台。在可视化画布上把 Webhook、定时任务、数据库、飞书/Telegram/Slack 通知、自定义 JS/Python 代码以及本地 Ollama 大模型串联成全自动流水线，个人与内部业务使用 Docker 自建完全免费且不限执行次数。
  en: A node-based workflow automation tool that lets you wire webhooks, cron jobs, databases, chat apps, custom JS/Python code and local LLMs together. Free for self-hosting on your own server with unlimited workflow executions.
review:
  zh: |
    n8n 是 开源工具 领域中一款值得长期留存的代表作。全球最受欢迎的自托管工作流自动化平台。在可视化画布上把 Webhook、定时任务、数据库、飞书/Telegram/Slack 通知、自定义 JS/Python 代码以及本地 Ollama 大模型串联成全自动流水线，个人与内部业务使用 Docker 自建完全免费且不限执行次数。

    在“真免费、少打扰”的维度上，它采用 Sustainable Use License 授权，核心功能对个人用户诚意开放，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Linux、macOS、Windows 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    n8n is a standout choice in software tools. A node-based workflow automation tool that lets you wire webhooks, cron jobs, databases, chat apps, custom JS/Python code and local LLMs together. Free for self-hosting on your own server with unlimited workflow executions.

    From a user-freedom perspective, it is distributed under Sustainable Use License with a generous free experience, can be self-hosted on your own server or homelab to avoid vendor lock-in, ships with zero ads and no invasive telemetry. With native support across Web browsers, Linux, macOS, Windows, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
