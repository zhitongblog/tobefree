description:
  zh: MIT 开源的跨平台开发者日常工具箱，内置 JSON 格式化、JWT 解码、Cron 表达式解析、文本对比、哈希生成、正则测试、颜色与图片压缩等 30+ 常用小工具。智能剪贴板会自动识别复制的内容并推荐对应工具，全程本地离线运行。
  en: 'An MIT-licensed cross-platform desktop toolbox featuring 30+ everyday utilities: JSON formatting, JWT decoding, Cron parsing, diffs, hashing, regex testing and image conversion. Smart clipboard detection suggests the right tool automatically, all 100% offline.'
review:
  zh: |
    DevToys 是 开源工具 领域中一款值得长期留存的代表作。MIT 开源的跨平台开发者日常工具箱，内置 JSON 格式化、JWT 解码、Cron 表达式解析、文本对比、哈希生成、正则测试、颜色与图片压缩等 30+ 常用小工具。智能剪贴板会自动识别复制的内容并推荐对应工具，全程本地离线运行。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    DevToys is a standout choice in software tools. An MIT-licensed cross-platform desktop toolbox featuring 30+ everyday utilities: JSON formatting, JWT decoding, Cron parsing, diffs, hashing, regex testing and image conversion. Smart clipboard detection suggests the right tool automatically, all 100% offline.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
