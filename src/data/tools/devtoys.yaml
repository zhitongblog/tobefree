description:
  zh: MIT 开源的跨平台开发者日常工具箱，内置 JSON 格式化、JWT 解码、Cron 表达式解析、文本对比、哈希生成、正则测试、颜色与图片压缩等 30+ 常用小工具。智能剪贴板会自动识别复制的内容并推荐对应工具，全程本地离线运行。
  en: 'An MIT-licensed cross-platform desktop toolbox featuring 30+ everyday utilities: JSON formatting, JWT decoding, Cron parsing, diffs, hashing, regex testing and image conversion. Smart clipboard detection suggests the right tool automatically, all 100% offline.'
