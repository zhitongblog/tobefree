review:
  zh: |
    很多桌面视频下载器要么套着笨重的 Electron 壳，要么塞满弹窗广告和「会员解锁 4K」套路。OmniGet 采用 Tauri 2.0 + Rust 编写，安装包极小、内存占用低，打开粘贴链接即可选择最高画质或仅提取音频，干净利落。
  en: |
    Unlike bloated Electron downloaders or ad-ridden shareware that paywall 4K resolutions, OmniGet is built with Tauri 2.0 and Rust—delivering a tiny, fast desktop UI for downloading videos and audio from 1,800+ sites for free.
