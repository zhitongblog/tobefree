description:
  zh: 图形界面的 IP 和端口扫描器。给定一个网段，多线程并发 ping 每个地址，列出在线主机的主机名、MAC 地址、网卡厂商和开放端口，Windows 设备还能读到 NetBIOS 计算机名。结果可以导出成 CSV、TXT、XML。
  en: A graphical IP and port scanner. Give it a range and it pings every address concurrently, listing live hosts with hostname, MAC address, network card vendor and open ports, plus NetBIOS computer names for Windows machines. Results export to CSV, TXT or XML.
review:
  zh: |
    GPL-2.0 协议，5,100 颗星，Java 写的，界面用 SWT 调系统原生控件。
    2026 年 8 月底发布了 3.10.0。

    它和 Nmap 的分工很清楚：Nmap 什么都能查，参数要学；Angry IP Scanner 只回答
    「这个网段里有哪些机器在线、开了哪几个常用端口」，打开就会用。
    填起止 IP，点 Start，扫完出一张表：
    IP、响应时间、主机名、开放端口，右键能直接对某台机器 ping、traceroute、打开网页或 SSH。

    常见用途是找设备。新买的打印机、摄像头、树莓派接上网以后不知道分到了哪个 IP，
    在 Fetchers 里加上 MAC 厂商这一列，一看就能认出来。可加的列还有 NetBIOS 信息、Web 服务器识别、TTL 等。

    它也能从命令行调用，自动开始扫描、导出结果后退出：

    ```
    ipscan -f:range 192.168.1.1 192.168.1.254 -s -q -o result.csv
    ```

    要说清楚的：

    - **只扫你自己的或者有授权的网络。** 这一条和 Nmap 一样，未经授权扫别人的网段在很多地方违法，
      公司内网也通常有明文规定。
    - **杀毒软件可能报毒。** 扫描器本身就是会被标记的那类程序，官方下载页专门有一条 FAQ 解释误报。
      只从 angryip.org 或 GitHub Releases 下载。
    - Windows 选带 Java 运行时的安装包；独立 exe 和 Linux 的 deb/rpm 需要自己装 Java 21 以上。
      macOS 包自带运行时，首次打开要在安全设置里放行。
    - 端口扫描只做基本的 TCP 连接探测，没有服务版本识别和系统指纹。要查细节，换 Nmap。
  en: |
    GPL-2.0, 5,100 stars, written in Java with an SWT interface that uses native system widgets.
    Version 3.10.0 shipped at the end of August 2026.

    Its division of labour with Nmap is clear. Nmap can find out anything and has flags to learn; Angry
    IP Scanner answers only "which machines on this range are up and which common ports are open", and
    you can use it the moment it opens. Enter a start and end IP, press Start, and you get a table of
    IP, response time, hostname and open ports. Right-click a host to ping it, traceroute it, open it in a browser or SSH in.

    The common use is finding devices. A new printer, camera or Raspberry Pi joins the network and you
    have no idea which address it got; add the MAC vendor column under Fetchers and it is identifiable
    at a glance. Other columns include NetBIOS information, web server detection and TTL.

    It can also be driven from the command line, starting the scan, exporting and quitting:

    ```
    ipscan -f:range 192.168.1.1 192.168.1.254 -s -q -o result.csv
    ```

    To be clear about:

    - **Only scan networks you own or are authorized to test.** As with Nmap, scanning other people's
      ranges without permission is illegal in many places, and corporate networks usually have explicit
      rules.
    - **Antivirus software may flag it.** Scanners are exactly the kind of program that gets flagged,
      and the official download page links an FAQ entry about false positives. Download only from
      angryip.org or GitHub Releases.
    - On Windows, choose the installer that bundles the Java runtime; the standalone exe and the Linux
      deb/rpm packages need Java 21 or newer installed separately. The macOS bundles include the runtime
      and must be allowed in Security settings on first launch.
    - Port scanning is a basic TCP connect probe, with no service version detection or OS
      fingerprinting. For detail, use Nmap.
