tagline:
  zh: 比传统 find 快数倍、语法极度直觉的命令行文件搜索工具
  en: A simple, fast and user-friendly alternative to the classic Unix find command
description:
  zh: 与 bat 同作者的 Rust 命令行文件搜索器。不需要像传统 find 那样敲一堆 -name 参数，直接输入 fd pattern 就能并行遍历目录，默认自动忽略 .gitignore 与隐藏目录，速度往往比传统 find 快出数倍。
  en: 'Written in Rust by the author of bat, fd replaces awkward find syntax with intuitive defaults: just run fd pattern to search directories in parallel, automatically respecting .gitignore and hidden files at a fraction of the runtime.'
review:
  zh: |
    fd 是 开源工具 领域中一款值得长期留存的代表作。与 bat 同作者的 Rust 命令行文件搜索器。不需要像传统 find 那样敲一堆 -name 参数，直接输入 fd pattern 就能并行遍历目录，默认自动忽略 .gitignore 与隐藏目录，速度往往比传统 find 快出数倍。

    在“真免费、少打扰”的维度上，它采用 MIT / Apache-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    fd is a standout choice in software tools. Written in Rust by the author of bat, fd replaces awkward find syntax with intuitive defaults: just run fd pattern to search directories in parallel, automatically respecting .gitignore and hidden files at a fraction of the runtime.

    From a user-freedom perspective, it is released under the MIT / Apache-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
