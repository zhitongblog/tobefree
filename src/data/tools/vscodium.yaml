tagline:
  zh: 去掉微软遥测的 VS Code 干净构建版
  en: Clean, telemetry-free builds of VS Code
description:
  zh: 用微软开源的 VS Code 源码，按 MIT 许可重新构建的干净版本，默认关闭遥测、去掉微软品牌与专有授权。使用体验与 VS Code 几乎一致，插件也照常用。
  en: Freely-licensed binaries built from VS Code's open-source code under MIT, with telemetry disabled and Microsoft branding removed by default. The experience mirrors VS Code, and extensions still work.
review:
  zh: |
    VSCodium 是 开源工具 领域中一款值得长期留存的代表作。用微软开源的 VS Code 源码，按 MIT 许可重新构建的干净版本，默认关闭遥测、去掉微软品牌与专有授权。使用体验与 VS Code 几乎一致，插件也照常用。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    VSCodium is a standout choice in software tools. Freely-licensed binaries built from VS Code's open-source code under MIT, with telemetry disabled and Microsoft branding removed by default. The experience mirrors VS Code, and extensions still work.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
