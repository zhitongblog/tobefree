tagline:
  zh: 准确度极高、支持本地无线联机与高清 OpenGL 渲染的开源 NDS / DSi 模拟器
  en: Fast, accurate open-source Nintendo DS and DSi emulator with local wireless multiplayer
description:
  zh: 目前公认最优秀的 GPL-3.0 开源任天堂 DS / DSi 掌机模拟器。相比老旧的 DeSmuME，melonDS 不仅模拟精度更高、OpenGL 3D 高倍内部分辨率渲染更流畅，还完整还原了 NDS 本地无线通信与自定义 Wi-Fi 服务器联机功能。
  en: The leading GPL-3.0 Nintendo DS and DSi emulator, offering high-resolution OpenGL 3D upscaling, DSi mode support, local wireless multiplayer and custom WFC online server connectivity.
review:
  zh: |
    melonDS 是 开源工具 领域中一款值得长期留存的代表作。目前公认最优秀的 GPL-3.0 开源任天堂 DS / DSi 掌机模拟器。相比老旧的 DeSmuME，melonDS 不仅模拟精度更高、OpenGL 3D 高倍内部分辨率渲染更流畅，还完整还原了 NDS 本地无线通信与自定义 Wi-Fi 服务器联机功能。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    melonDS is a standout choice in software tools. The leading GPL-3.0 Nintendo DS and DSi emulator, offering high-resolution OpenGL 3D upscaling, DSi mode support, local wireless multiplayer and custom WFC online server connectivity.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
