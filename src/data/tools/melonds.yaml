tagline:
  zh: 准确度极高、支持本地无线联机与高清 OpenGL 渲染的开源 NDS / DSi 模拟器
  en: Fast, accurate open-source Nintendo DS and DSi emulator with local wireless multiplayer
description:
  zh: 目前公认最优秀的 GPL-3.0 开源任天堂 DS / DSi 掌机模拟器。相比老旧的 DeSmuME，melonDS 不仅模拟精度更高、OpenGL 3D 高倍内部分辨率渲染更流畅，还完整还原了 NDS 本地无线通信与自定义 Wi-Fi 服务器联机功能。
  en: The leading GPL-3.0 Nintendo DS and DSi emulator, offering high-resolution OpenGL 3D upscaling, DSi mode support, local wireless multiplayer and custom WFC online server connectivity.
