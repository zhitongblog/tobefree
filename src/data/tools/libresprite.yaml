tagline:
  zh: 源自 Aseprite 最后一个 GPL 开源版本的免费像素画与帧动画制作软件
  en: Free and open-source pixel art and animated sprite editor forked from the last GPL version of Aseprite
description:
  zh: 当知名像素画软件 Aseprite 从 GPL-2.0 转向闭源专有许可后，社区基于其最后一个开源版本持续维护的免费分支。完整保留了经典的像素画笔、洋葱皮帧动画时间轴、瓦片地图（Tilemap）模式与调色板管理，开箱即用无需自己编译。
  en: Forked from the last GPLv2 commit of Aseprite before it went proprietary, LibreSprite provides pre-built binaries with onion-skinning timelines, layer groups, palette control and tilemap modes for 2D pixel artists.
review:
  zh: |
    LibreSprite 是 设计、图像与音视频创作 领域中一款值得长期留存的代表作。当知名像素画软件 Aseprite 从 GPL-2.0 转向闭源专有许可后，社区基于其最后一个开源版本持续维护的免费分支。完整保留了经典的像素画笔、洋葱皮帧动画时间轴、瓦片地图（Tilemap）模式与调色板管理，开箱即用无需自己编译。

    在“真免费、少打扰”的维度上，它采用 GPL-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    LibreSprite is a standout choice in creative design, imaging, and audio/video production. Forked from the last GPLv2 commit of Aseprite before it went proprietary, LibreSprite provides pre-built binaries with onion-skinning timelines, layer groups, palette control and tilemap modes for 2D pixel artists.

    From a user-freedom perspective, it is released under the GPL-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
