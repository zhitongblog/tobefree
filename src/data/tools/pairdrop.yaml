tagline:
  zh: 不用装任何 App，两台设备打开网页就能像 AirDrop 一样点对点秒传文件
  en: Local and cross-network peer-to-peer file sharing right in your browser — inspired by Apple AirDrop
description:
  zh: 经典项目 Snapdrop 的 GPL-3.0 强化继承者。当你在别人的电脑或公司机器上不方便安装 LocalSend 时，只要手机和电脑同时用浏览器打开 `pairdrop.net`（或输入 6 位房间码跨网配对），就能通过 WebRTC 点对点直接互传大文件和剪贴板文本，也支持一条 Docker 命令自建。
  en: A GPL-3.0 WebRTC file-sharing web app inspired by Apple AirDrop. Open the page in any browser on your phone and PC to transfer files and text peer-to-peer over your LAN or via temporary 6-digit rooms with zero app installation.
review:
  zh: |
    PairDrop 是 开源工具 领域中一款值得长期留存的代表作。经典项目 Snapdrop 的 GPL-3.0 强化继承者。当你在别人的电脑或公司机器上不方便安装 LocalSend 时，只要手机和电脑同时用浏览器打开 `pairdrop.net`（或输入 6 位房间码跨网配对），就能通过 WebRTC 点对点直接互传大文件和剪贴板文本，也支持一条 Docker 命令自建。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Windows、macOS、Linux、iOS、Android 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    PairDrop is a standout choice in software tools. A GPL-3.0 WebRTC file-sharing web app inspired by Apple AirDrop. Open the page in any browser on your phone and PC to transfer files and text peer-to-peer over your LAN or via temporary 6-digit rooms with zero app installation.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Web browsers, Windows, macOS, Linux, iOS, Android, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
