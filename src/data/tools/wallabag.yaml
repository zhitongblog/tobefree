tagline:
  zh: 把文章存下来慢慢读，而且是真的存下来了
  en: Save articles to read later — and they are genuinely saved
description:
  zh: 自建的稍后读服务。一键保存网页，它会抓取正文并去掉广告、弹窗和侧边栏，生成干净的阅读版本存进你的库。支持标签、全文搜索、标注、导出 EPUB/PDF/MOBI，有浏览器扩展和手机 App。
  en: A self-hosted read-later service. Save a page with one click and it extracts the article text, stripping ads, pop-ups and sidebars into a clean reading version stored in your library. It supports tags, full-text search, annotations, and export to EPUB, PDF and MOBI, with browser extensions and mobile apps.
review:
  zh: |
    "稍后读"服务的历史给人上了一课：Pocket 被收购、多次改版、
    然后在 2025 年宣布关停，很多人存了十年的文章要匆忙导出。
    Instapaper 几度易主。这类工具存的是你的阅读史，
    交给一家公司，就得接受它随时可能消失。

    wallabag 的方案是**你自己跑一个**。12,896 颗星，MIT 协议。
    它的功能对标 Pocket，但服务器是你的。

    核心能力：

    - **正文提取**。保存的不是网页截图或链接，而是抓下来的正文——
      广告、导航栏、推荐位、弹窗全部去掉，只留标题、作者、正文和图片。
      **即使原网页以后删了或改版了，你存的这份还在。**
    - **多端保存**。浏览器扩展一键存、手机 App 分享菜单里存、
      也能通过邮件或 API 存。
    - **标签和全文搜索**。存久了几千篇文章，靠标签和搜索找回来。
    - **标注和高亮**，读的时候画重点。
    - **导出**。单篇或批量导出成 EPUB、PDF、MOBI、纯文本——
      导出成 EPUB 塞进电纸书里读长文很舒服。
    - **导入**。支持从 Pocket、Instapaper、Readability 导入历史数据，
      迁移不丢东西。

    关于"免费"要说清楚：

    **软件本身是 MIT 开源、完全免费的**，你自己部署没有任何限制。
    官方另外提供一个托管服务（wallabag.it），按年收费，
    面向不想自己维护服务器的人。我们收录的是**自建这条路**，
    标为「有免费版」是因为官方托管是付费的，避免有人点进去发现要钱。

    要说清楚的：

    - **需要部署**。PHP 应用，官方有 Docker 镜像。
      对已经在自建其他服务的人（比如跑着 FreshRSS 或 Nextcloud）几乎没有额外成本。
    - **发版节奏偏慢**。当前稳定版 2.6.14 发布于 2025 年 10 月，
      仓库在 2026 年仍有提交。功能稳定，但不是快速迭代的项目。
    - **正文提取不是百分百成功**。结构复杂的页面、需要登录的内容、
      大量交互的页面可能抓不干净，偶尔要手动修。这是所有同类工具的共同问题。
    - **它和 RSS 是两回事**。FreshRSS 负责"有什么新东西"，
      wallabag 负责"这篇我要存下来认真读"。两个一起用是很自然的组合。
  en: |
    The history of read-later services taught a lesson: Pocket was acquired, redesigned repeatedly and
    then announced its shutdown in 2025, sending people scrambling to export a decade of saved
    articles. Instapaper changed hands several times. These tools hold your reading history, and
    handing that to a company means accepting it can vanish.

    wallabag's answer is to **run your own.** 12,896 stars, MIT licensed, matching Pocket's
    functionality on a server you control.

    Core capabilities:

    - **Article extraction.** What gets saved is not a screenshot or a link but the extracted text —
      ads, navigation, recommendation blocks and pop-ups removed, leaving title, author, body and
      images. **Even if the original page is later deleted or redesigned, your copy remains.**
    - **Save from anywhere:** a browser extension, a phone's share menu, email, or the API.
    - **Tags and full-text search** to retrieve any of the thousands of articles that accumulate.
    - **Annotations and highlights** while reading.
    - **Export** individually or in bulk to EPUB, PDF, MOBI or plain text — EPUB onto an e-reader makes
      long articles genuinely pleasant.
    - **Import** from Pocket, Instapaper and Readability, so migration loses nothing.

    On "free", to be precise:

    **The software itself is MIT open source and entirely free** with no restrictions when
    self-hosted. Separately the project offers a paid hosted service (wallabag.it) for people who do
    not want to maintain a server. What we list is **the self-hosted path**; it carries the freemium
    label so nobody clicks through expecting the hosted option to be free.

    To be clear about:

    - **Deployment required.** It is a PHP application with an official Docker image, and for anyone
      already self-hosting — running FreshRSS or Nextcloud, say — the additional cost is close to zero.
    - **Releases are slow.** The current stable version, 2.6.14, shipped in October 2025 with continuing
      commits through 2026. Stable, but not rapidly iterating.
    - **Extraction is not always perfect.** Complex layouts, login-gated content and highly interactive
      pages may not parse cleanly and occasionally need manual fixing — a limitation shared by every
      tool of this type.
    - **It is distinct from RSS.** FreshRSS answers "what is new"; wallabag answers "I want to keep this
      and read it properly". Using both together is a natural pairing.
