tagline:
  zh: Kubernetes 终端可视化管理 TUI 的事实标准，告别冗长繁琐的 kubectl 命令
  en: The gold-standard terminal UI to observe, navigate, and manage Kubernetes clusters in real time
description:
  zh: 实时监控 K8s 集群中 Pod、Deployment、Service 等所有资源的健康状态，一键追踪实时日志、进入容器 Shell、端口转发、弹性扩缩容与故障排查。
  en: Continuously watches your Kubernetes clusters and offers instant keyboard shortcuts to stream pod logs, shell into containers, port-forward, edit manifests, and diagnose cluster bottlenecks.
review:
  zh: |
    只要你日常接触 Kubernetes，K9s 就是装机必装的第一神器。它把原本需要敲几十个字符的 `kubectl get/describe/logs/exec` 命令浓缩成了直观的实时终端大盘，按一个键就能看日志、进容器、做端口转发，完全开源免费。
  en: |
    K9s is indispensable for anyone working with Kubernetes. It replaces verbose kubectl commands with a responsive real-time terminal dashboard for streaming logs, shelling into pods, port-forwarding, and inspecting cluster health.
