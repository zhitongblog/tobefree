tagline:
  zh: 比 Grafana 轻十倍的开源服务器与 Docker 容器资源监控面板
  en: Lightweight server resource monitoring hub with historical data, Docker stats and alerts
description:
  zh: 基于 PocketBase 构建的超轻量级自建服务器监控中心。如果你觉得 Prometheus + Grafana 太重，而 Uptime Kuma 只能看在线率看不了 CPU、内存、磁盘温度和各个 Docker 容器的资源历史曲线，Beszel 只需几兆内存就能完美解决，还自带阈值告警。
  en: Built on PocketBase, Beszel fills the gap between Uptime Kuma and heavy Prometheus/Grafana stacks. Tracks historical CPU, RAM, disk I/O, GPU temperatures and per-container Docker stats across all your servers with minimal RAM.
review:
  zh: |
    Beszel 是 开源工具 领域中一款值得长期留存的代表作。基于 PocketBase 构建的超轻量级自建服务器监控中心。如果你觉得 Prometheus + Grafana 太重，而 Uptime Kuma 只能看在线率看不了 CPU、内存、磁盘温度和各个 Docker 容器的资源历史曲线，Beszel 只需几兆内存就能完美解决，还自带阈值告警。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Linux、macOS、Windows、Web 浏览器 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Beszel is a standout choice in software tools. Built on PocketBase, Beszel fills the gap between Uptime Kuma and heavy Prometheus/Grafana stacks. Tracks historical CPU, RAM, disk I/O, GPU temperatures and per-container Docker stats across all your servers with minimal RAM.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Linux, macOS, Windows, Web browsers, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
