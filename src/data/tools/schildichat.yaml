tagline:
  zh: 对标微信/Telegram 统一收件箱体验的 Element 开源增强分支
  en: Feature-rich open-source Matrix client based on Element with unified chat lists and message bubbles
description:
  zh: 基于 Element 代码库持续维护的开源 Matrix 客户端。修复了许多普通用户觉得 Element 别扭的交互细节：支持把私聊和群聊合并在同一个紧凑的时间流列表里、更舒服的气泡样式与标记未读体验。
  en: A community fork of Element that adds a unified single-list inbox view (mixing direct messages and group rooms chronologically), customizable message bubbles and power-user tweaks.
