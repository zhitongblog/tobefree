tagline:
  zh: 极简到只需拖入文件输密码，但底层采用 XChaCha20 与 Argon2id 顶级密码学的加密工具
  en: A very small, very simple, yet audited and ultra-secure file encryption desktop tool
description:
  zh: 通过独立第三方密码学安全审计的 GPL-3.0 开源文件加密小工具。如果你觉得 VeraCrypt 每次都要建虚拟磁盘太繁琐，Picocrypt 只需把任意文件或文件夹拖进窗口、设个密码（或密钥文件），一秒生成带 Reed-Solomon 抗损坏纠错码的 `.pcv` 加密包。
  en: An independently audited GPL-3.0 file encryption app. Drag and drop files, enter a password or keyfile, and encrypt immediately with XChaCha20-Poly1305, Argon2id and optional Reed-Solomon data corruption recovery.
review:
  zh: |
    Picocrypt 是 隐私、加密与安全防护 领域中一款值得长期留存的代表作。通过独立第三方密码学安全审计的 GPL-3.0 开源文件加密小工具。如果你觉得 VeraCrypt 每次都要建虚拟磁盘太繁琐，Picocrypt 只需把任意文件或文件夹拖进窗口、设个密码（或密钥文件），一秒生成带 Reed-Solomon 抗损坏纠错码的 `.pcv` 加密包。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Picocrypt is a standout choice in privacy protection, encryption, and security. An independently audited GPL-3.0 file encryption app. Drag and drop files, enter a password or keyfile, and encrypt immediately with XChaCha20-Poly1305, Argon2id and optional Reed-Solomon data corruption recovery.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
