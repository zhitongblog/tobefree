tagline:
  zh: 小巧快速的可启动 U 盘制作工具
  en: A tiny, fast bootable USB creator
description:
  zh: 只有几百 KB 的绿色小工具，把 Windows、Linux 等 ISO 快速写入 U 盘制成启动盘，支持 UEFI 与 BIOS、GPT 与 MBR。免安装、开源、无广告。
  en: A few-hundred-KB portable tool that writes Windows, Linux and other ISOs to USB as a bootable drive, with UEFI/BIOS and GPT/MBR support. No install, open source, ad-free.
review:
  zh: |
    Rufus 是 开源工具 领域中一款值得长期留存的代表作。只有几百 KB 的绿色小工具，把 Windows、Linux 等 ISO 快速写入 U 盘制成启动盘，支持 UEFI 与 BIOS、GPT 与 MBR。免安装、开源、无广告。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Rufus is a standout choice in software tools. A few-hundred-KB portable tool that writes Windows, Linux and other ISOs to USB as a bootable drive, with UEFI/BIOS and GPT/MBR support. No install, open source, ad-free.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
