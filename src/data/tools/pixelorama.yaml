  en: Pixel art and sprite animation — the free answer to Aseprite
description:
  zh: 开源像素画编辑器。逐帧动画时间轴、洋葱皮预览、图层与图层组、调色板管理、瓦片地图模式、精灵图（sprite sheet）导入导出。用 Godot 引擎开发，桌面三平台加网页版都能跑。
  en: An open-source pixel art editor with a frame-by-frame animation timeline, onion skinning, layers and layer groups, palette management, a tilemap mode, and sprite sheet import and export. Built with the Godot engine, it runs on all three desktop platforms and in the browser.
review:
  zh: |
    像素画这个领域的事实标准是 Aseprite，做得非常好，但要付费
    （源码开放但按协议不能免费分发编译好的版本）。
    对刚开始做游戏、或者只是想画着玩的人，这是一道门槛。

    Pixelorama 是目前最完整的免费替代品。10,104 颗星，MIT 协议，
    用 Godot 引擎写的，所以桌面三平台和网页版都能跑
    （网页版意味着不用装就能试）。

    做像素画和精灵动画需要的东西基本都有：

    - **像素级绘图工具**：铅笔、橡皮、油漆桶、选区、
      直线和形状工具，都是像素精确的，不会有抗锯齿糊边。
    - **动画时间轴**。逐帧动画，可以设每帧时长，实时预览播放。
    - **洋葱皮（onion skin）**。半透明显示前后帧，画走路循环这类动画时是刚需。
    - **图层和图层组**，可以分开画角色的身体、装备、特效。
    - **调色板管理**。像素画非常依赖限定色板，它支持导入常见的
      调色板格式，也能从图片提取色板、锁定只用调色板内的颜色。
    - **瓦片地图模式**（Tilemap）：画地图瓦片时自动对齐网格、复用图块。
    - **导入导出精灵图**：把动画帧导出成一张 sprite sheet 供游戏引擎使用，
      也能反向从 sprite sheet 切分成帧。
    - **3D 层和着色器**等进阶功能，用来做参考或特效。

    要说清楚的：

    - **和 Aseprite 比仍有差距**。Aseprite 在手感细节、
      快捷键效率、脚本扩展和一些高级功能上更成熟，
      毕竟是多年商业打磨的产品。**Pixelorama 是"够用且免费"，不是"更强"。**
      如果你靠像素画吃饭，Aseprite 那点钱值得花。
    - **它不是通用绘图软件**。画插画、厚涂、板绘请用 Krita，
      Pixelorama 的所有设计都围绕"每个像素都要精确"。
    - **网页版功能略有限制**，重度使用建议装桌面版。
    - **版本迭代较快**（当前 v1.2），偶尔会有界面调整。

    适合谁：独立游戏开发者做素材、想学像素画的人、
    以及需要做小尺寸图标和精灵动画的任何人。
  en: |
    The de facto standard in pixel art is Aseprite — excellent, but paid (its source is open, while the
    licence does not permit free distribution of compiled builds). For someone starting a game or just
    experimenting, that is a barrier.

    Pixelorama is the most complete free alternative. 10,104 stars, MIT, built with the Godot engine,
    so it runs on all three desktop platforms and in a browser — the web build meaning you can try it
    without installing anything.

    Essentially everything pixel art and sprite animation require is here:

    - **Pixel-precise drawing tools:** pencil, eraser, bucket, selection, line and shape tools, all
      aliasing-free so edges stay crisp.
    - **An animation timeline** for frame-by-frame work with per-frame durations and live playback.
    - **Onion skinning** showing adjacent frames semi-transparently, essential for walk cycles.
    - **Layers and layer groups** to separate a character's body, equipment and effects.
    - **Palette management.** Pixel art depends heavily on constrained palettes; it imports common
      palette formats, extracts palettes from images, and can restrict drawing to palette colors.
    - **Tilemap mode** with grid snapping and tile reuse for map work.
    - **Sprite sheet import and export,** turning animation frames into a sheet for a game engine and
      slicing sheets back into frames.
    - **3D layers and shaders** among the more advanced features, useful for references and effects.

    To be clear about:

    - **It still trails Aseprite.** Aseprite is more refined in feel, shortcut efficiency, scripting and
      several advanced features, being a commercially polished product. **Pixelorama is "sufficient and
      free", not "better".** If pixel art is your livelihood, Aseprite's modest price is worth paying.
    - **It is not a general drawing program.** Illustration and painting belong in Krita; every design
      decision here assumes each pixel must be exact.
    - **The web build is slightly limited;** install the desktop version for heavy use.
    - **It iterates fairly quickly** (currently v1.2), so the interface occasionally shifts.

    Who it suits: indie game developers making assets, anyone learning pixel art, and anyone who needs
    small icons and sprite animations.
