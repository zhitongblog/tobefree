tagline:
  zh: 被称为「赛博瑞士军刀」的数据编码、加解密与格式转换神器，纯本地浏览器运行
  en: The Cyber Swiss Army Knife for encoding, encryption, compression and data analysis in your browser
description:
  zh: Apache-2.0 开源的纯前端数据料理工作台，内置超过 300 种操作（Base64、Hex、JWT、AES/RSA、Gzip、正则提取、时间戳、二进制解析等）。支持像搭积木一样串联多步转换配方，所有计算 100% 在本地浏览器内完成，也可下载单个 HTML 断网使用。
  en: An Apache-2.0 web app packing over 300 operations — Base64, Hex, JWT, AES/RSA, compression, regex extraction, timestamps and binary parsing. Chain steps into reusable recipes; everything executes 100% client-side and downloads as a standalone offline HTML bundle.
review:
  zh: |
    CyberChef 是 开源工具 领域中一款值得长期留存的代表作。Apache-2.0 开源的纯前端数据料理工作台，内置超过 300 种操作（Base64、Hex、JWT、AES/RSA、Gzip、正则提取、时间戳、二进制解析等）。支持像搭积木一样串联多步转换配方，所有计算 100% 在本地浏览器内完成，也可下载单个 HTML 断网使用。

    在“真免费、少打扰”的维度上，它采用 Apache-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    CyberChef is a standout choice in software tools. An Apache-2.0 web app packing over 300 operations — Base64, Hex, JWT, AES/RSA, compression, regex extraction, timestamps and binary parsing. Chain steps into reusable recipes; everything executes 100% client-side and downloads as a standalone offline HTML bundle.

    From a user-freedom perspective, it is released under the Apache-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Web browsers, Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
