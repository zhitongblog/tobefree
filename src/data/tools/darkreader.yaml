tagline:
  zh: 为全球任意刺眼白底网站实时生成舒适深色模式的 MIT 开源浏览器扩展
  en: MIT-licensed browser extension that creates real-time dark themes for every website on the fly
description:
  zh: 拥有数百万用户的 MIT 开源护眼浏览器扩展。智能分析网页 CSS 与对比度，把刺眼的纯白网页实时转换为柔和的深色主题（而不会把照片和视频错误反色），完全不含任何广告插入或浏览记录上传。
  en: An MIT-licensed browser extension that analyzes page styles in real time to invert bright white websites into high-contrast dark modes without mangling images, with zero ads or tracking.
review:
  zh: |
    Dark Reader 是 开源工具 领域中一款值得长期留存的代表作。拥有数百万用户的 MIT 开源护眼浏览器扩展。智能分析网页 CSS 与对比度，把刺眼的纯白网页实时转换为柔和的深色主题（而不会把照片和视频错误反色），完全不含任何广告插入或浏览记录上传。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Dark Reader is a standout choice in software tools. An MIT-licensed browser extension that analyzes page styles in real time to invert bright white websites into high-contrast dark modes without mangling images, with zero ads or tracking.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Web browsers, Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
