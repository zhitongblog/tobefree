review:
  zh: |
    7-Zip 是 开源工具 领域中一款值得长期留存的代表作。支持几乎所有压缩格式，压缩率高、速度快。开源、无广告、无捆绑，是 WinRAR 弹窗的终结者。

    在“真免费、少打扰”的维度上，它采用 LGPL-2.1 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    7-Zip is a standout choice in software tools. Handles nearly every archive format with high ratios and speed. Open source, ad-free, no bundleware — the cure for WinRAR nag screens.

    From a user-freedom perspective, it is released under the LGPL-2.1 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
