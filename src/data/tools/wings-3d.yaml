tagline:
  zh: 专注纯粹多边形与细分曲面造型、右键菜单交互极度高效的轻量开源 3D 建模器
  en: An advanced open-source subdivision 3D modeler focused on fast context-menu polygon modeling
description:
  zh: 用 Erlang 编写的老牌 BSD 开源细分曲面（Subdivision）三维建模软件。砍掉了繁杂的骨骼动画与渲染管线，把全部精力放在多边形点线面推拉捏合与 AutoUV 展平上，右键上下文菜单随手即得，非常适合快速构建机械外壳与三维打印原型。
  en: A BSD-licensed polygon and subdivision surface 3D modeler with a context-sensitive right-click workflow and built-in AutoUV mapping.
review:
  zh: |
    Wings 3D 是 开源工具 领域中一款值得长期留存的代表作。用 Erlang 编写的老牌 BSD 开源细分曲面（Subdivision）三维建模软件。砍掉了繁杂的骨骼动画与渲染管线，把全部精力放在多边形点线面推拉捏合与 AutoUV 展平上，右键上下文菜单随手即得，非常适合快速构建机械外壳与三维打印原型。

    在“真免费、少打扰”的维度上，它采用 BSD-3-Clause 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Wings 3D is a standout choice in software tools. A BSD-licensed polygon and subdivision surface 3D modeler with a context-sensitive right-click workflow and built-in AutoUV mapping.

    From a user-freedom perspective, it is released under the BSD-3-Clause open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
