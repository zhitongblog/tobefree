tagline:
  zh: 主打自动矢量补间与骨骼变形的开源 2D 动画制作软件，单人也能做长篇动画
  en: Open-source 2D vector animation software with automatic tweening and bone rigging
description:
  zh: GPL-3.0 开源的 2D 矢量与位图动画软件。不同于需要逐帧手绘的 Pencil2D，Synfig 主打矢量形状变形（Morphing）与骨骼绑定系统，电脑会自动计算关键帧之间的平滑过渡补间，大幅减少制作二维角色动画的画工工作量。
  en: A GPL-3.0 2D animation studio engineered around vector tweening and bone systems, eliminating the need to draw every single frame by hand.
