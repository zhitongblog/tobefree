tagline:
  zh: 3D 打印与三维扫描玩家必备的开源三角网格修复、减面、补洞与点云重建神器
  en: The open-source system for processing, cleaning, healing and converting 3D triangular meshes
description:
  zh: 由意大利国家研究委员会视觉计算实验室研发的 GPL-3.0 开源三维网格处理系统。当你从网上下载的 STL 模型有破面、法线反转无法切片，或者三维扫描仪扫出来的几千万面点云需要重建、平滑和减面时，MeshLab 是行业里最权威的免费手术刀。
  en: Developed by the ISTI-CNR Visual Computing Lab under GPL-3.0, MeshLab is the go-to tool for cleaning, healing, remeshing, simplifying and inspecting dense 3D triangular meshes and 3D scan point clouds before 3D printing.
review:
  zh: |
    MeshLab 是 开源工具 领域中一款值得长期留存的代表作。由意大利国家研究委员会视觉计算实验室研发的 GPL-3.0 开源三维网格处理系统。当你从网上下载的 STL 模型有破面、法线反转无法切片，或者三维扫描仪扫出来的几千万面点云需要重建、平滑和减面时，MeshLab 是行业里最权威的免费手术刀。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    MeshLab is a standout choice in software tools. Developed by the ISTI-CNR Visual Computing Lab under GPL-3.0, MeshLab is the go-to tool for cleaning, healing, remeshing, simplifying and inspecting dense 3D triangular meshes and 3D scan point clouds before 3D printing.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
