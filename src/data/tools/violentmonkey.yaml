tagline:
  zh: 真正 MIT 完全开源、无暗藏统计代码的纯净油猴用户脚本管理器（暴力猴）
  en: Truly open-source userscript manager for browsers — the clean alternative to closed-source Tampermonkey
description:
  zh: 很多人不知道如今最火的 Tampermonkey（篡改猴）早就变成了闭源商业扩展。Violentmonkey（暴力猴）则是真正坚守 MIT 开源协议、代码完全透明且无任何后台追踪的油猴脚本管理器，完美兼容 Greasy Fork 等站点的全部 `.user.js` 脚本。
  en: While Tampermonkey has been closed-source for years, Violentmonkey remains 100% open source under the MIT license with zero tracking, running all standard `.user.js` scripts across Chrome, Firefox and Edge.
review:
  zh: |
    Violentmonkey 是 开源工具 领域中一款值得长期留存的代表作。很多人不知道如今最火的 Tampermonkey（篡改猴）早就变成了闭源商业扩展。Violentmonkey（暴力猴）则是真正坚守 MIT 开源协议、代码完全透明且无任何后台追踪的油猴脚本管理器，完美兼容 Greasy Fork 等站点的全部 `.user.js` 脚本。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Violentmonkey is a standout choice in software tools. While Tampermonkey has been closed-source for years, Violentmonkey remains 100% open source under the MIT license with zero tracking, running all standard `.user.js` scripts across Chrome, Firefox and Edge.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Web browsers, Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
