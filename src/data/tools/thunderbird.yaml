description:
  zh: 由 Mozilla 维护的开源邮件客户端，支持 IMAP/POP/SMTP/Exchange，可同时管理多个邮箱账户，并内置日历与联系人。不投放广告、不收集个人数据。
  en: A Mozilla-maintained open-source email client supporting IMAP/POP/SMTP/Exchange, managing multiple accounts at once with built-in calendar and contacts. No ads, no personal data collection.
review:
  zh: |
    Mozilla Thunderbird 是 开源工具 领域中一款值得长期留存的代表作。由 Mozilla 维护的开源邮件客户端，支持 IMAP/POP/SMTP/Exchange，可同时管理多个邮箱账户，并内置日历与联系人。不投放广告、不收集个人数据。

    在“真免费、少打扰”的维度上，它采用 MPL-2.0 开源协议，代码公开透明、可独立审计，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、Android 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Mozilla Thunderbird is a standout choice in software tools. A Mozilla-maintained open-source email client supporting IMAP/POP/SMTP/Exchange, managing multiple accounts at once with built-in calendar and contacts. No ads, no personal data collection.

    From a user-freedom perspective, it is released under the MPL-2.0 open-source license with publicly auditable code, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, Android, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
