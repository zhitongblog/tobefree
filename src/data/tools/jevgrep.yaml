description:
  zh: 结合传统快速文本过滤与 Jev 并发打分的命令行代码搜索工具（同时可作为 MCP Server 运行）。不需要提前给整个代码库建庞大的 Embedding 向量库，直接用自然语言提问即可按语义相关性对代码片段和 Git diff 快速重排。
  en: A command-line semantic code search utility (and MCP server) that combines fast lexical filtering with parallel Jev relevance scoring. Query your codebase in plain language and rank code chunks or diffs without maintaining a heavy embedding database.
