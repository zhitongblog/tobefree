review:
  zh: |
    Okular 是 开源工具 领域中一款值得长期留存的代表作。一个阅读器打开几乎所有文档格式：PDF、EPUB、DjVu、漫画（CBR/CBZ）、图片等，支持高亮、批注、内嵌笔记与表单填写，完全免费开源。

    在“真免费、少打扰”的维度上，它采用 GPL-2.0-or-later 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Okular is a standout choice in software tools. One reader for almost every document format — PDF, EPUB, DjVu, comics (CBR/CBZ), images and more — with highlighting, annotations, inline notes and form filling, all free and open source.

    From a user-freedom perspective, it is released under the GPL-2.0-or-later open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
