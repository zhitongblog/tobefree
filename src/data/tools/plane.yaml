  en: Open-source project management tool to track issues, cycles and product roadmaps
description:
  zh: AGPL-3.0 开源的现代团队项目管理平台。集成了看板、列表、甘特图、迭代周期（Cycles）、模块拆分与内置 Wiki 页面（Pages），界面清爽流畅，支持通过 Docker 在团队自己的服务器上免费自建。
  en: An AGPL-3.0 project management platform combining issue tracking, Kanban boards, sprint cycles, roadmaps and wiki pages in a clean interface you can self-host via Docker.
review:
  zh: |
    Plane 是 效率与知识管理 领域中一款值得长期留存的代表作。AGPL-3.0 开源的现代团队项目管理平台。集成了看板、列表、甘特图、迭代周期（Cycles）、模块拆分与内置 Wiki 页面（Pages），界面清爽流畅，支持通过 Docker 在团队自己的服务器上免费自建。

    在“真免费、少打扰”的维度上，它采用 AGPL-3.0 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Linux、macOS、Windows 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Plane is a standout choice in productivity and knowledge management. An AGPL-3.0 project management platform combining issue tracking, Kanban boards, sprint cycles, roadmaps and wiki pages in a clean interface you can self-host via Docker.

    From a user-freedom perspective, it is released under the AGPL-3.0 open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, ships with zero ads and no invasive telemetry. With native support across Web browsers, Linux, macOS, Windows, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
