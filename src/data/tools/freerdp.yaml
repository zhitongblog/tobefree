tagline:
  zh: Remmina 与 Guacamole 背后的开源 RDP 远程桌面协议实现本尊
  en: The flagship Apache-2.0 open-source implementation of the Remote Desktop Protocol (RDP)
description:
  zh: Apache-2.0 开源的远程桌面协议（RDP）标准实现。Linux 与 macOS 上几乎所有好用的远程桌面客户端底层都调用了 FreeRDP，直接使用其命令行客户端 `xfreerdp` / `wlfreerdp` 可以解锁极其丝滑的动态分辨率自适应、多显示器透传、USB 重定向与无缝应用模式（RemoteApp）。
  en: An Apache-2.0 implementation of Microsoft’s RDP protocol supporting dynamic resolution resizing, multi-monitor spanning, audio/USB redirection and seamless RemoteApp windows.
review:
  zh: |
    FreeRDP 是 开源工具 领域中一款值得长期留存的代表作。Apache-2.0 开源的远程桌面协议（RDP）标准实现。Linux 与 macOS 上几乎所有好用的远程桌面客户端底层都调用了 FreeRDP，直接使用其命令行客户端 `xfreerdp` / `wlfreerdp` 可以解锁极其丝滑的动态分辨率自适应、多显示器透传、USB 重定向与无缝应用模式（RemoteApp）。

    在“真免费、少打扰”的维度上，它采用 Apache-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    FreeRDP is a standout choice in software tools. An Apache-2.0 implementation of Microsoft’s RDP protocol supporting dynamic resolution resizing, multi-monitor spanning, audio/USB redirection and seamless RemoteApp windows.

    From a user-freedom perspective, it is released under the Apache-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
