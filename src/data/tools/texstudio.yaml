tagline:
  zh: 学术界最经典的本地离线 LaTeX 论文集成编写环境，告别云端编译排队与断网焦虑
  en: The classic, full-featured open-source integrated writing environment for LaTeX documents
description:
  zh: GPL-3.0 开源的本地 LaTeX 集成编辑环境（IDE）。内置超过 1000 个数学符号面板、公式鼠标悬停即时预览、表格向导、BibTeX 文献自动补全以及代码与右侧 PDF 正反向同步跳转，不限编译时长、断网照写论文。
  en: A comprehensive GPL-3.0 LaTeX IDE offering 1000+ math symbol palettes, inline formula hover previews, table wizards, BibTeX completion and instant SyncTeX source-to-PDF jumping completely offline.
review:
  zh: |
    TeXstudio 是 开源工具 领域中一款值得长期留存的代表作。GPL-3.0 开源的本地 LaTeX 集成编辑环境（IDE）。内置超过 1000 个数学符号面板、公式鼠标悬停即时预览、表格向导、BibTeX 文献自动补全以及代码与右侧 PDF 正反向同步跳转，不限编译时长、断网照写论文。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    TeXstudio is a standout choice in software tools. A comprehensive GPL-3.0 LaTeX IDE offering 1000+ math symbol palettes, inline formula hover previews, table wizards, BibTeX completion and instant SyncTeX source-to-PDF jumping completely offline.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
