tagline:
  zh: 横跨 iPad、安卓平板与电脑的开源手写笔记软件，深色模式下连 PDF 底色都自动反色护眼
  en: Open-source cross-platform handwritten notes app built for tablets with smart dark-mode PDF inversion
description:
  zh: GPL-3.0 开源的全平台手写笔记应用（GoodNotes / Notability 的开源替代方案）。针对夜间学习做了智能反色（深色模式下黑白 PDF 与字迹自动反色，而彩色插图保持原色），并支持使用你自己的 Nextcloud / WebDAV 服务器进行端到端加密同步。
  en: A GPL-3.0 cross-platform handwriting app for iPad, Android tablets and desktop. Intelligently inverts black-and-white PDFs in dark mode while keeping diagrams in color, and syncs via your own Nextcloud/WebDAV server.
review:
  zh: |
    Saber 是 开源工具 领域中一款值得长期留存的代表作。GPL-3.0 开源的全平台手写笔记应用（GoodNotes / Notability 的开源替代方案）。针对夜间学习做了智能反色（深色模式下黑白 PDF 与字迹自动反色，而彩色插图保持原色），并支持使用你自己的 Nextcloud / WebDAV 服务器进行端到端加密同步。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、iOS、Android 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Saber is a standout choice in software tools. A GPL-3.0 cross-platform handwriting app for iPad, Android tablets and desktop. Intelligently inverts black-and-white PDFs in dark mode while keeping diagrams in color, and syncs via your own Nextcloud/WebDAV server.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, iOS, Android, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
