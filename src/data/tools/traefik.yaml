tagline:
  zh: 专为容器与微服务设计的开源反向代理网关，自动发现新增 Docker 容器并签发 HTTPS 证书
  en: Cloud-native open-source reverse proxy and load balancer with automatic Docker discovery and Let’s Encrypt SSL
description:
  zh: 无需在每次新装一个 Docker 服务时手动去改反代配置文件并重启。只需在 docker-compose.yml 里加两行 Label，Traefik 就会自动识别新服务、绑定子域名并自动申请续期通配符 SSL 证书。
  en: Automatically detects new Docker containers or Kubernetes ingresses via labels, routes traffic dynamically without restarts, and provisions Let’s Encrypt certificates out of the box.
review:
  zh: |
    如果你在服务器上维护二三十个 Docker Compose 自建服务，Traefik 的「纯 Label 自动发现」会让运维变得无比优雅：新启动一个容器，子域名和 HTTPS 证书当场自动生效，连管理面板都不用点。
  en: |
    Traefik is a favorite among homelabbers and DevOps engineers because it discovers new Docker containers automatically via compose labels and handles HTTPS certificates dynamically under the MIT license.
