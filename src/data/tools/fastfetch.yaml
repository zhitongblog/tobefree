tagline:
  zh: 用纯 C 语言重写的极速系统信息展示工具，Neofetch 停更后的标准继承者
  en: A maintained, feature-rich and blazingly fast system information tool written in C
description:
  zh: 在老牌工具 Neofetch 归档停更后成为社区标准的系统软硬件信息概览工具。由纯 C 语言编写，把原本需要几百毫秒的 Shell 脚本检测压缩到十几毫秒内完成，一眼列出操作系统、内核、显示器分辨率、CPU/GPU、内存与本地 IP。
  en: The community-standard successor to Neofetch, written primarily in C for instantaneous execution. Prints OS, kernel, uptime, display resolution, CPU, GPU, memory, disk and local IP alongside ASCII distro logos in milliseconds.
review:
  zh: |
    Fastfetch 是 开源工具 领域中一款值得长期留存的代表作。在老牌工具 Neofetch 归档停更后成为社区标准的系统软硬件信息概览工具。由纯 C 语言编写，把原本需要几百毫秒的 Shell 脚本检测压缩到十几毫秒内完成，一眼列出操作系统、内核、显示器分辨率、CPU/GPU、内存与本地 IP。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Fastfetch is a standout choice in software tools. The community-standard successor to Neofetch, written primarily in C for instantaneous execution. Prints OS, kernel, uptime, display resolution, CPU, GPU, memory, disk and local IP alongside ASCII distro logos in milliseconds.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
