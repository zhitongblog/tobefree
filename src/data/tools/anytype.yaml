description:
  zh: 本地优先的个人知识库，数据默认存在自己设备上，多设备之间走点对点同步和端到端加密，没有中心服务器保管你的内容。用「对象」和关系来组织信息，可以自己定义类型和属性，像给自己搭一个小型数据库而不是记流水账。
  en: A local-first personal knowledge base that keeps data on your own devices by default and syncs between them peer-to-peer with end-to-end encryption, so no central server holds your content. It organises information as objects and relations with types and properties you define — closer to building yourself a small database than keeping a running log.
review:
  zh: |
    源码可见，协议是自定的 Any Source Available License 1.0，桌面端仓库 8.8k 颗星。

    它和 Notion 的根本区别在存储位置。Notion 的内容在 Notion 的服务器上，
    Anytype 的内容在你的设备上，多设备同步靠点对点加端到端加密，
    中间没有一台服务器能看到明文。断网完全可用，同步只是设备之间的事。

    组织方式是「对象」：一本书、一个人、一个项目都是对象，
    对象有类型、有属性、能互相关联，类型和属性都能自己定义。
    这套模型比一页页文档更接近数据库，适合长期积累和交叉查询，
    代价是上手要先理解它的概念。

    要说清楚的：

    - **协议不是 OSI 认可的开源协议**，是 Any Source Available License 1.0，
      源码可读可自建，但附加了使用限制。所以我们没有给它「开源」徽章，
      跟 Open WebUI 的处理一致。要纯开源的看 AFFiNE（MIT）或思源（AGPL-3.0）。
    - **要建一个 Any ID 才能用。** 但这个 ID 是本机生成的密钥，
      不要邮箱、不要手机号，恢复靠一串本地保管的助记词。
      这跟「交出邮箱注册账号」不是一回事，不过它确实不是打开就能写，
      所以「无需注册」徽章也没给。助记词丢了没人能帮你恢复。
    - 生态和插件比 Obsidian 少得多，导出格式也相对有限。
  en: |
    Source-available under its own Any Source Available License 1.0; the desktop repository has 8,800
    stars.

    The fundamental difference from Notion is where content sits. Notion's lives on Notion's servers;
    Anytype's lives on your devices, syncing peer-to-peer with end-to-end encryption so no server in the
    middle ever sees plaintext. It is fully usable offline, with sync being purely a device-to-device
    matter.

    The organising model is objects: a book, a person, a project are each objects with types,
    properties and relations to one another, and you define the types and properties yourself. That is
    closer to a database than to a stack of pages, which suits long-term accumulation and cross-cutting
    queries at the cost of learning its concepts first.

    To be clear about:

    - **The licence is not OSI-approved open source.** Any Source Available License 1.0 lets you read
      the code and self-host, with added restrictions attached, so it carries no open-source badge —
      the same treatment we gave Open WebUI. For genuinely open licences, see AFFiNE (MIT) or SiYuan
      (AGPL-3.0).
    - **You must create an Any ID.** That ID is a key generated on your own machine — no email, no phone
      number, with recovery through a locally stored seed phrase. It is not the same as handing over an
      email address, but it is also not open-and-write, so the no-sign-up badge stays off. Lose the seed
      phrase and nobody can recover it for you.
    - The ecosystem and plugin selection are far smaller than Obsidian's, and export formats are
      comparatively limited.
