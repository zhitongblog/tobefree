tagline:
  zh: 凭一句口令就能在地球任意两台电脑间端到端加密直传文件的命令行神器
  en: Easily and securely send files or folders between any two computers via CLI using a code phrase
description:
  zh: 用 Go 编写的 MIT 开源跨网文件传输命令行工具。不需要配端口映射、不需要加好友，发送方执行 `croc send 文件`，接收方在另一台电脑输入屏幕提示的三词口令，双方即通过 PAKE 密码学握手建立端到端加密通道，支持多文件并发、断点续传以及自建中继服务。
  en: An MIT-licensed Go CLI that transfers files and folders between any two computers across NATs using a single generated code phrase, secured by PAKE end-to-end encryption and supporting resumeable transfers.
review:
  zh: |
    croc 是 开源工具 领域中一款值得长期留存的代表作。用 Go 编写的 MIT 开源跨网文件传输命令行工具。不需要配端口映射、不需要加好友，发送方执行 `croc send 文件`，接收方在另一台电脑输入屏幕提示的三词口令，双方即通过 PAKE 密码学握手建立端到端加密通道，支持多文件并发、断点续传以及自建中继服务。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    croc is a standout choice in software tools. An MIT-licensed Go CLI that transfers files and folders between any two computers across NATs using a single generated code phrase, secured by PAKE end-to-end encryption and supporting resumeable transfers.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
