tagline:
  zh: 用原生 C++ 与 Qt 编写的超低内存占用 Matrix 桌面客户端
  en: Native C++ and Qt desktop client for the Matrix protocol with low memory usage
description:
  zh: 如果你讨厌聊天软件动辄吃掉上百兆甚至上 G 内存（因为套了浏览器内核），Nheko 是用纯 C++ 与 Qt 原生编写的 GPL-3.0 Matrix 客户端，常驻内存仅几十分之一，同时完整支持 E2EE 端到端加密与 VoIP 语音通话。
  en: A native C++/Qt desktop Matrix client under GPL-3.0 that uses a fraction of the RAM of Electron-based apps while supporting full end-to-end encryption and VoIP calls.
