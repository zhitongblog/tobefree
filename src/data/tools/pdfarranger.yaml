tagline:
  zh: 像在桌面上摆扑克牌一样直观拖拽合并、拆分、旋转和裁剪 PDF 页面的小工具
  en: A small open-source desktop app to merge, split, rotate, crop and rearrange PDF pages visually
description:
  zh: 基于 pikepdf 的轻量级 GPL-3.0 开源桌面软件。很多时候你只是想把两份 PDF 拼在一起、删掉其中几页空白页或者把扫倒了的一页转正，用 PDF Arranger 直接在缩略图网格里鼠标拖拽就能搞定，几秒导出且绝无水印。
  en: A lightweight GPL-3.0 desktop utility built on pikepdf. Drop multiple PDFs into a visual thumbnail grid, drag pages around to reorder, delete blank pages, rotate scans or crop margins, and save instantly offline with no watermarks.
review:
  zh: |
    PDF Arranger 是 开源工具 领域中一款值得长期留存的代表作。基于 pikepdf 的轻量级 GPL-3.0 开源桌面软件。很多时候你只是想把两份 PDF 拼在一起、删掉其中几页空白页或者把扫倒了的一页转正，用 PDF Arranger 直接在缩略图网格里鼠标拖拽就能搞定，几秒导出且绝无水印。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    PDF Arranger is a standout choice in software tools. A lightweight GPL-3.0 desktop utility built on pikepdf. Drop multiple PDFs into a visual thumbnail grid, drag pages around to reorder, delete blank pages, rotate scans or crop margins, and save instantly offline with no watermarks.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
