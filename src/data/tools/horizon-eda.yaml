tagline:
  zh: 从零现代设计的开源电子电路原理图与 PCB 布局软件，内置严谨的元器件库与 3D 预览
  en: Modern free and open-source Electronic Design Automation package for schematic capture and PCB layout
description:
  zh: GPL-3.0 开源的现代电子设计自动化（EDA）套件。吸收了商业软件在元器件封装管理上的精髓（明确区分实体器件、逻辑符号与焊盘封装），集成 KiCad 的交互式推挤布线器、实时设计规则检查（DRC）以及极速的 OpenGL 3D 电路板预览。
  en: A modern GPL-3.0 EDA package featuring unified library management from symbol to 3D package, an interactive push-and-shove router, live DRC checks and hardware-accelerated 3D board previews.
review:
  zh: |
    Horizon EDA 是 开源工具 领域中一款值得长期留存的代表作。GPL-3.0 开源的现代电子设计自动化（EDA）套件。吸收了商业软件在元器件封装管理上的精髓（明确区分实体器件、逻辑符号与焊盘封装），集成 KiCad 的交互式推挤布线器、实时设计规则检查（DRC）以及极速的 OpenGL 3D 电路板预览。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Horizon EDA is a standout choice in software tools. A modern GPL-3.0 EDA package featuring unified library management from symbol to 3D package, an interactive push-and-shove router, live DRC checks and hardware-accelerated 3D board previews.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
