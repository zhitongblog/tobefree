tagline:
  zh: 阿姆斯特丹大学研发的开源免费统计软件，点选之间替代昂贵笨重的商业 SPSS
  en: Free and open-source graphical statistical software offering both classical and Bayesian analysis
description:
  zh: 由阿姆斯特丹大学团队支持开发的开源统计分析软件（底层基于 R 语言）。针对社科、医学与心理学研究者不想写代码的痛点，提供比商业软件 SPSS 更清爽的左侧勾选变量、右侧实时刷新 APA 标准学术三线表与高清配图的交互体验，同时原生支持经典频率学派与贝叶斯统计。
  en: Developed with support from the University of Amsterdam, JASP is an intuitive, open-source alternative to SPSS. Check variables on the left and watch publication-ready APA tables and plots update live on the right.
review:
  zh: |
    JASP 是 开源工具 领域中一款值得长期留存的代表作。由阿姆斯特丹大学团队支持开发的开源统计分析软件（底层基于 R 语言）。针对社科、医学与心理学研究者不想写代码的痛点，提供比商业软件 SPSS 更清爽的左侧勾选变量、右侧实时刷新 APA 标准学术三线表与高清配图的交互体验，同时原生支持经典频率学派与贝叶斯统计。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    JASP is a standout choice in software tools. Developed with support from the University of Amsterdam, JASP is an intuitive, open-source alternative to SPSS. Check variables on the left and watch publication-ready APA tables and plots update live on the right.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
