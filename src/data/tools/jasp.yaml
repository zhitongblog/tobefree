tagline:
  zh: 阿姆斯特丹大学研发的开源免费统计软件，点选之间替代昂贵笨重的商业 SPSS
  en: Free and open-source graphical statistical software offering both classical and Bayesian analysis
description:
  zh: 由阿姆斯特丹大学团队支持开发的开源统计分析软件（底层基于 R 语言）。针对社科、医学与心理学研究者不想写代码的痛点，提供比商业软件 SPSS 更清爽的左侧勾选变量、右侧实时刷新 APA 标准学术三线表与高清配图的交互体验，同时原生支持经典频率学派与贝叶斯统计。
  en: Developed with support from the University of Amsterdam, JASP is an intuitive, open-source alternative to SPSS. Check variables on the left and watch publication-ready APA tables and plots update live on the right.
