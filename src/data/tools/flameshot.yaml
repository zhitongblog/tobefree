tagline:
  zh: 简单顺手的开源截图标注工具
  en: A simple, handy open-source screenshot annotator
description:
  zh: 一键截取屏幕区域，即时用箭头、文字、马赛克、高亮等工具标注，快捷高效。跨平台、开源、无广告，命令行也能调用。
  en: Grab a screen region with one shortcut and annotate it on the spot with arrows, text, blur and highlight. Cross-platform, open source, ad-free, with a CLI as well.
review:
  zh: |
    Flameshot 是 开源工具 领域中一款值得长期留存的代表作。一键截取屏幕区域，即时用箭头、文字、马赛克、高亮等工具标注，快捷高效。跨平台、开源、无广告，命令行也能调用。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、Linux、macOS 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Flameshot is a standout choice in software tools. Grab a screen region with one shortcut and annotate it on the spot with arrows, text, blur and highlight. Cross-platform, open source, ad-free, with a CLI as well.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, Linux, macOS, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
