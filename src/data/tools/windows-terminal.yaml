description:
  zh: "微软官方开源终端，104,622 颗星，是这一批里星数最高的。标签页、分屏、GPU 渲染、配置文件都齐全，Windows 10/11 自带或从商店安装。只支持 Windows。"
  en: "Microsoft's official open-source terminal and the most-starred of this group at 104,622 stars. Tabs, panes, GPU rendering and profile configuration are all there; it ships with Windows 10/11 or installs from the Store. Windows only."
review:
  zh: |
    Windows 上不想折腾就用它。104,622 颗星，MIT，微软自己维护，系统自带或商店一键装。

    标签页、分屏、GPU 渲染、JSON 配置这些该有的都有，跟 WSL、PowerShell、CMD 的集成也是最顺的。

    唯一的限制很明确：只有 Windows。跨平台的活得看 Tabby、WezTerm 或 Ghostty。
  en: |
    On Windows, if you do not want to tinker, use this. 104,622 stars, MIT, maintained by
    Microsoft, and it either ships with the OS or installs from the Store in one click.

    Tabs, panes, GPU rendering and JSON configuration are all present, and integration with WSL,
    PowerShell and CMD is the smoothest available.

    The one limitation is clear: Windows only. For cross-platform work look at Tabby, WezTerm or
    Ghostty.
