description:
  zh: 基于间隔重复算法的记忆卡片软件，帮你把时间花在快忘的内容上。桌面版（Windows/macOS/Linux）、AnkiDroid 安卓版与 AnkiWeb 网页同步全部免费。
  en: Flashcard software built on spaced repetition, so you spend time on what you're about to forget. The desktop apps (Windows/macOS/Linux), AnkiDroid for Android, and AnkiWeb sync are all free.
review:
  zh: |
    Anki 是 开源工具 领域中一款值得长期留存的代表作。基于间隔重复算法的记忆卡片软件，帮你把时间花在快忘的内容上。桌面版（Windows/macOS/Linux）、AnkiDroid 安卓版与 AnkiWeb 网页同步全部免费。

    在“真免费、少打扰”的维度上，它采用 AGPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、Android、Web 浏览器 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Anki is a standout choice in software tools. Flashcard software built on spaced repetition, so you spend time on what you're about to forget. The desktop apps (Windows/macOS/Linux), AnkiDroid for Android, and AnkiWeb sync are all free.

    From a user-freedom perspective, it is released under the AGPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, Android, Web browsers, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
