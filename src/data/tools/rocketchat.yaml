tagline:
  zh: 支持全套私有化部署的开源团队即时通讯平台，数据完全留在企业自己服务器
  en: Open-source, self-hostable team communications platform for organizations requiring full data ownership
description:
  zh: 老牌开源团队协作与即时通讯平台。提供频道、私聊、消息话题串、文件共享、端到端加密以及与 Matrix 联邦互通能力，支持使用 Docker 在内网完全断外网环境独立部署，配套全平台桌面与手机客户端。
  en: A mature self-hostable team chat platform featuring channels, threads, file sharing, end-to-end encryption and Matrix federation, with native apps across desktop and mobile.
review:
  zh: |
    Rocket.Chat 是 开源工具 领域中一款值得长期留存的代表作。老牌开源团队协作与即时通讯平台。提供频道、私聊、消息话题串、文件共享、端到端加密以及与 Matrix 联邦互通能力，支持使用 Docker 在内网完全断外网环境独立部署，配套全平台桌面与手机客户端。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Windows、macOS、Linux、iOS、Android 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Rocket.Chat is a standout choice in software tools. A mature self-hostable team chat platform featuring channels, threads, file sharing, end-to-end encryption and Matrix federation, with native apps across desktop and mobile.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, ships with zero ads and no invasive telemetry. With native support across Web browsers, Windows, macOS, Linux, iOS, Android, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
