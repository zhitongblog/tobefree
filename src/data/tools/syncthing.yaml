description:
  zh: 在你自己的多台设备之间实时同步文件，数据只存在你的设备上，没有中央服务器。全程 TLS 加密，隐私优先。开源免费，可自托管。
  en: Sync files between your own devices in real time. Data lives only on your machines with no central server, all traffic TLS-encrypted, privacy-first. Open source, free and self-hostable.
review:
  zh: |
    Syncthing 是 开源工具 领域中一款值得长期留存的代表作。在你自己的多台设备之间实时同步文件，数据只存在你的设备上，没有中央服务器。全程 TLS 加密，隐私优先。开源免费，可自托管。

    在“真免费、少打扰”的维度上，它采用 MPL-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Syncthing is a standout choice in software tools. Sync files between your own devices in real time. Data lives only on your machines with no central server, all traffic TLS-encrypted, privacy-first. Open source, free and self-hostable.

    From a user-freedom perspective, it is released under the MPL-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
