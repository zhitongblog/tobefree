tagline:
  zh: 面向自由职业者与小微团队的开源自建财务会计系统，含客户账单、供应商与现金流报表
  en: Free and open-source accounting software for freelancers and small businesses
description:
  zh: 基于 Laravel 构建的 GPL-3.0 开源小微企业与独立开发者财务系统。支持自建在自己的服务器上，管理客户报价单、发票（Invoicing）、周期性收款、供应商采购账单以及多币种损益表。
  en: A GPL-3.0 self-hostable accounting system built for freelancers and small teams to manage client invoicing, vendor bills, expense tracking and profit-and-loss reporting on their own server.
review:
  zh: |
    Akaunting 是 开源工具 领域中一款值得长期留存的代表作。基于 Laravel 构建的 GPL-3.0 开源小微企业与独立开发者财务系统。支持自建在自己的服务器上，管理客户报价单、发票（Invoicing）、周期性收款、供应商采购账单以及多币种损益表。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Linux、Windows、macOS 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Akaunting is a standout choice in software tools. A GPL-3.0 self-hostable accounting system built for freelancers and small teams to manage client invoicing, vendor bills, expense tracking and profit-and-loss reporting on their own server.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, ships with zero ads and no invasive telemetry. With native support across Web browsers, Linux, Windows, macOS, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
