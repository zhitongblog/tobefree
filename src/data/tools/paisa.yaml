tagline:
  zh: 建立在纯文本复式记账（Ledger）之上的可视化个人资产与收益分析面板
  en: Open-source personal finance and net-worthvisualizer built on top of plain-text Ledger accounting
description:
  zh: 专为纯文本复式记账（Ledger / hledger）用户打造的 GPL-3.0 图形化资产管理软件。底层账本依然是你随时可以用 Git 管理的纯文本文件，但打开 Paisa 即可自动绘出家庭净值走势、退休金预测、资产配置比例与年化内部收益率（XIRR）。
  en: A GPL-3.0 desktop and web dashboard built on plain-text accounting. Keep your transactions in human-readable Ledger files while inspecting interactive charts for net worth, asset allocation and XIRR returns.
review:
  zh: |
    Paisa 是 开源工具 领域中一款值得长期留存的代表作。专为纯文本复式记账（Ledger / hledger）用户打造的 GPL-3.0 图形化资产管理软件。底层账本依然是你随时可以用 Git 管理的纯文本文件，但打开 Paisa 即可自动绘出家庭净值走势、退休金预测、资产配置比例与年化内部收益率（XIRR）。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、Web 浏览器 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Paisa is a standout choice in software tools. A GPL-3.0 desktop and web dashboard built on plain-text accounting. Keep your transactions in human-readable Ledger files while inspecting interactive charts for net worth, asset allocation and XIRR returns.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, Web browsers, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
