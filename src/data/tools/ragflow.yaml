tagline:
  zh: 主打深度文档布局理解与精准溯源的开源 RAG 知识库引擎
  en: Open-source RAG engine built around deep document layout understanding and grounded citations
description:
  zh: Apache-2.0 开源的检索增强生成（RAG）引擎。不同于粗暴按字数切块的普通知识库，它内置专门的文档布局分析模型，能精准识别复杂 PDF 中的多栏排版、表格和扫描件，回答问题时直接高亮原文依据，支持全套私有化部署。
  en: An Apache-2.0 RAG engine that replaces naive text chunking with deep document layout recognition. Accurately parses complex multi-column PDFs, tables and scans, returning answers with highlighted source citations on your own server.
review:
  zh: |
    RAGFlow 是 开源工具 领域中一款值得长期留存的代表作。Apache-2.0 开源的检索增强生成（RAG）引擎。不同于粗暴按字数切块的普通知识库，它内置专门的文档布局分析模型，能精准识别复杂 PDF 中的多栏排版、表格和扫描件，回答问题时直接高亮原文依据，支持全套私有化部署。

    在“真免费、少打扰”的维度上，它采用 Apache-2.0 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Linux、macOS、Windows、Web 浏览器 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    RAGFlow is a standout choice in software tools. An Apache-2.0 RAG engine that replaces naive text chunking with deep document layout recognition. Accurately parses complex multi-column PDFs, tables and scans, returning answers with highlighted source citations on your own server.

    From a user-freedom perspective, it is released under the Apache-2.0 open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Linux, macOS, Windows, Web browsers, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
