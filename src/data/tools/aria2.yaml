tagline:
  zh: 几乎所有开源下载器背后的多线程引擎本尊，仅占几兆内存即可跑满千兆宽带
  en: Ultra-lightweight multi-protocol and multi-source command-line download utility with JSON-RPC
description:
  zh: Motrix 等无数图形下载器底层的核心引擎（C++ 编写，GPL-2.0 开源）。本身是一个只占几兆内存的命令行与后台 RPC 服务，支持同时从 HTTP/HTTPS、FTP、SFTP、BitTorrent 和 Metalink 多源切片并发下载同一个文件，是 NAS 与服务器挂机下载的绝对主力。
  en: The battle-tested GPL-2.0 C++ download engine that powers countless GUI frontends. Downloads files concurrently across HTTP/HTTPS, FTP, SFTP and BitTorrent while consuming just a few megabytes of RAM.
review:
  zh: |
    aria2 是 开源工具 领域中一款值得长期留存的代表作。Motrix 等无数图形下载器底层的核心引擎（C++ 编写，GPL-2.0 开源）。本身是一个只占几兆内存的命令行与后台 RPC 服务，支持同时从 HTTP/HTTPS、FTP、SFTP、BitTorrent 和 Metalink 多源切片并发下载同一个文件，是 NAS 与服务器挂机下载的绝对主力。

    在“真免费、少打扰”的维度上，它采用 GPL-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    aria2 is a standout choice in software tools. The battle-tested GPL-2.0 C++ download engine that powers countless GUI frontends. Downloads files concurrently across HTTP/HTTPS, FTP, SFTP and BitTorrent while consuming just a few megabytes of RAM.

    From a user-freedom perspective, it is released under the GPL-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
