tagline:
  zh: 纯 Rust 编写的超轻量代码编辑器，内置 LSP、Vim 模式与远程开发
  en: Lightning-fast open-source code editor written in pure Rust with built-in LSP and remote development
description:
  zh: 采用纯 Rust 与 Floem 原生 UI 框架编写的开源代码编辑器。摒弃笨重的 Electron，启动几乎零延迟，内存占用极低；同时直接内置语言服务器协议（LSP）、一等公民的模态编辑（Vim-like）、内置终端以及类似 VS Code Remote 的 SSH 远程开发支持。
  en: An Apache-2.0 code editor built in pure Rust with native GPU-accelerated UI. Starts instantly without Electron bloat while shipping built-in LSP support, modal (Vim-style) editing, an integrated terminal and SSH remote development out of the box.
