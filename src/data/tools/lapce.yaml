tagline:
  zh: 纯 Rust 编写的超轻量代码编辑器，内置 LSP、Vim 模式与远程开发
  en: Lightning-fast open-source code editor written in pure Rust with built-in LSP and remote development
description:
  zh: 采用纯 Rust 与 Floem 原生 UI 框架编写的开源代码编辑器。摒弃笨重的 Electron，启动几乎零延迟，内存占用极低；同时直接内置语言服务器协议（LSP）、一等公民的模态编辑（Vim-like）、内置终端以及类似 VS Code Remote 的 SSH 远程开发支持。
  en: An Apache-2.0 code editor built in pure Rust with native GPU-accelerated UI. Starts instantly without Electron bloat while shipping built-in LSP support, modal (Vim-style) editing, an integrated terminal and SSH remote development out of the box.
review:
  zh: |
    Lapce 是 开源工具 领域中一款值得长期留存的代表作。采用纯 Rust 与 Floem 原生 UI 框架编写的开源代码编辑器。摒弃笨重的 Electron，启动几乎零延迟，内存占用极低；同时直接内置语言服务器协议（LSP）、一等公民的模态编辑（Vim-like）、内置终端以及类似 VS Code Remote 的 SSH 远程开发支持。

    在“真免费、少打扰”的维度上，它采用 Apache-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Lapce is a standout choice in software tools. An Apache-2.0 code editor built in pure Rust with native GPU-accelerated UI. Starts instantly without Electron bloat while shipping built-in LSP support, modal (Vim-style) editing, an integrated terminal and SSH remote development out of the box.

    From a user-freedom perspective, it is released under the Apache-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
