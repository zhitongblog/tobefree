tagline:
  zh: 用 Rust 编写的开源矢量手写笔记与 PDF 批注软件，专为数位板和触控笔设计
  en: An open-source vector-based drawing app for sketching, handwritten notes and PDF annotation
description:
  zh: 用 Rust 与 GTK4 开发的跨平台开源矢量手写软件。支持压感触控笔、逼真的钢笔与刷子笔触、无限延展或固定页边距画布，可以直接导入老师发的 PDF 讲义在上面流畅手写推导公式，然后再导出为高清矢量 PDF。
  en: Written in Rust and GTK4, Rnote is a pressure-sensitive vector handwriting and sketching app built for stylus tablets, making it easy to annotate PDF lecture slides or sketch on infinite canvases offline.
review:
  zh: |
    Rnote 是 开源工具 领域中一款值得长期留存的代表作。用 Rust 与 GTK4 开发的跨平台开源矢量手写软件。支持压感触控笔、逼真的钢笔与刷子笔触、无限延展或固定页边距画布，可以直接导入老师发的 PDF 讲义在上面流畅手写推导公式，然后再导出为高清矢量 PDF。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Rnote is a standout choice in software tools. Written in Rust and GTK4, Rnote is a pressure-sensitive vector handwriting and sketching app built for stylus tablets, making it easy to annotate PDF lecture slides or sketch on infinite canvases offline.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
