review:
  zh: |
    SillyTavern 是 开源工具 领域中一款值得长期留存的代表作。面向进阶用户的开源大模型前端界面，支持连接 Ollama、KoboldCpp、llama.cpp 及各类云端 API。提供极其精细的上下文模板、正则后处理、世界书（World Info 动态触发词库）、群聊协作与 TTS 语音合成，所有对话数据纯本地存储。

    在“真免费、少打扰”的维度上，它采用 AGPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、Web 浏览器 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    SillyTavern is a standout choice in software tools. An open-source LLM frontend built for power users. Connects to Ollama, KoboldCpp, llama.cpp and cloud APIs while offering granular context templates, World Info keyword lorebooks, group chats, regex post-processing and local data storage.

    From a user-freedom perspective, it is released under the AGPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, Web browsers, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
