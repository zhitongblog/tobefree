description:
  zh: 面向进阶用户的开源大模型前端界面，支持连接 Ollama、KoboldCpp、llama.cpp 及各类云端 API。提供极其精细的上下文模板、正则后处理、世界书（World Info 动态触发词库）、群聊协作与 TTS 语音合成，所有对话数据纯本地存储。
  en: An open-source LLM frontend built for power users. Connects to Ollama, KoboldCpp, llama.cpp and cloud APIs while offering granular context templates, World Info keyword lorebooks, group chats, regex post-processing and local data storage.
