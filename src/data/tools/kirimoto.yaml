tagline:
  zh: 直接在浏览器本地完成 3D 打印切片、CNC 铣削刀路与激光切割排版的开源工具
  en: Browser-based open-source slicer and toolpath generator for 3D printing, CNC milling and laser cutting
description:
  zh: MIT 开源的三合一数字化制造切片器。无需安装几百兆的桌面切片软件，打开网页即可在浏览器本地将 STL / STEP 模型生成 FDM/SLA 3D 打印 G-code、三轴 CNC 加工刀路或激光切割矢量路径，模型数据完全留在本地。
  en: An MIT-licensed client-side web slicer that generates G-code and toolpaths for FDM/SLA 3D printers, CNC mills and laser cutters right in your browser with zero cloud uploads.
review:
  zh: |
    Kiri:Moto 是 开源工具 领域中一款值得长期留存的代表作。MIT 开源的三合一数字化制造切片器。无需安装几百兆的桌面切片软件，打开网页即可在浏览器本地将 STL / STEP 模型生成 FDM/SLA 3D 打印 G-code、三轴 CNC 加工刀路或激光切割矢量路径，模型数据完全留在本地。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Kiri:Moto is a standout choice in software tools. An MIT-licensed client-side web slicer that generates G-code and toolpaths for FDM/SLA 3D printers, CNC mills and laser cutters right in your browser with zero cloud uploads.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Web browsers, Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
