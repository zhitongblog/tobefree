description:
  zh: 用共振峰合成的轻量语音引擎，支持一百多种语言和口音，整个程序只有几 MB，在极低配置的设备上也能跑。声音是明显的机器音，胜在体积、速度、语言覆盖和完全离线，是很多屏幕阅读器的底层引擎。
  en: A compact formant-synthesis speech engine covering more than a hundred languages and accents in a few megabytes, running on very low-powered hardware. The voice is plainly synthetic; the strengths are size, speed, language coverage and being entirely offline. It is the engine underneath many screen readers.
