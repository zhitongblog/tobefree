tagline:
  zh: Lazygit 作者出品的 Docker 终端管理面板，一个界面看全日志、容器与占用
  en: The lazier way to manage everything Docker from a single terminal UI
description:
  zh: 与 Lazygit 出自同一作者的 MIT 开源终端工具。无需记一长串 docker 与 docker-compose 命令，在终端里用键盘或鼠标就能实时查看容器状态、实时日志流、CPU/内存折线图，并一键重启、清理悬空镜像或进入容器 Shell。
  en: An MIT-licensed terminal UI for Docker and docker-compose by the creator of Lazygit. Inspect container state, tail logs, watch live CPU/memory graphs, prune unused images and jump into shells with single keystrokes.
review:
  zh: |
    Lazydocker 是 开源工具 领域中一款值得长期留存的代表作。与 Lazygit 出自同一作者的 MIT 开源终端工具。无需记一长串 docker 与 docker-compose 命令，在终端里用键盘或鼠标就能实时查看容器状态、实时日志流、CPU/内存折线图，并一键重启、清理悬空镜像或进入容器 Shell。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Lazydocker is a standout choice in software tools. An MIT-licensed terminal UI for Docker and docker-compose by the creator of Lazygit. Inspect container state, tail logs, watch live CPU/memory graphs, prune unused images and jump into shells with single keystrokes.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
