tagline:
  zh: 完全开源的 Cursor 替代编辑器，支持直接连接本地模型与自有 API
  en: The open-source Cursor alternative built on VS Code with direct local and BYOK model connections
description:
  zh: 基于 VS Code 源码分支构建的开源 AI 代码编辑器。提供与 Cursor 一致的行内修改、全局代码库问答、智能补全与 Agent 体验，但所有 AI 请求直接从你的电脑发往本地 Ollama 或你自己的模型密钥，不经过任何中间商服务器截留，兼容全部 VS Code 插件。
  en: An open-source AI code editor forked from VS Code as a privacy-first alternative to Cursor. Offers inline edits, codebase chat, tab autocomplete and agentic tools while sending requests directly to your local Ollama or personal API keys with zero middleman proxy.
review:
  zh: |
    Void 是 开源工具 领域中一款值得长期留存的代表作。基于 VS Code 源码分支构建的开源 AI 代码编辑器。提供与 Cursor 一致的行内修改、全局代码库问答、智能补全与 Agent 体验，但所有 AI 请求直接从你的电脑发往本地 Ollama 或你自己的模型密钥，不经过任何中间商服务器截留，兼容全部 VS Code 插件。

    在“真免费、少打扰”的维度上，它采用 Apache-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Void is a standout choice in software tools. An open-source AI code editor forked from VS Code as a privacy-first alternative to Cursor. Offers inline edits, codebase chat, tab autocomplete and agentic tools while sending requests directly to your local Ollama or personal API keys with zero middleman proxy.

    From a user-freedom perspective, it is released under the Apache-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
