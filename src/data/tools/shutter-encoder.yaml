tagline:
  zh: 专业剪辑师私藏的开源视频转码瑞士军刀，不仅能压 H.264/AV1 还能转 ProRes 与 DNxHD
  en: Professional video, audio and image converter built by video editors on top of FFmpeg
description:
  zh: 由专业影视剪辑师开发并 GPL-3.0 开源的全能媒体转码工具。如果说 HandBrake 只适合把视频压成 MP4/MKV，Shutter Encoder 则把 FFmpeg 的全部功力做成直观界面：支持转苹果 ProRes / 达芬奇 DNxHR 中间片编码、无损抽音轨、烧录字幕、封装替换、帧率插值与响度标准化。
  en: Designed by video editors under GPL-3.0, Shutter Encoder goes beyond consumer transcoders like HandBrake by supporting broadcast codecs (Apple ProRes, Avid DNxHR, GoPro CineForm), lossless re-wrapping, audio normalization and subtitle burn-in.
review:
  zh: |
    Shutter Encoder 是 开源工具 领域中一款值得长期留存的代表作。由专业影视剪辑师开发并 GPL-3.0 开源的全能媒体转码工具。如果说 HandBrake 只适合把视频压成 MP4/MKV，Shutter Encoder 则把 FFmpeg 的全部功力做成直观界面：支持转苹果 ProRes / 达芬奇 DNxHR 中间片编码、无损抽音轨、烧录字幕、封装替换、帧率插值与响度标准化。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Shutter Encoder is a standout choice in software tools. Designed by video editors under GPL-3.0, Shutter Encoder goes beyond consumer transcoders like HandBrake by supporting broadcast codecs (Apple ProRes, Avid DNxHR, GoPro CineForm), lossless re-wrapping, audio normalization and subtitle burn-in.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
