tagline:
  zh: 支持双书同屏对照阅读的现代化全平台开源电子书阅读器
  en: Modern open-source cross-platform ebook reader with side-by-side parallel reading
description:
  zh: 基于 Tauri v2 构建的现代化全平台开源阅读器（支持 EPUB、MOBI、AZW3、PDF 等）。最大的亮点是支持在同一窗口内同时打开两本书（比如中英文原版对照阅读），排版细腻、启动轻快，本地阅读与批注完全免费无需登录。
  en: Built with Tauri v2, Readest is a sleek open-source ebook reader supporting EPUB, MOBI, AZW3 and PDF across desktop and mobile, featuring a standout parallel view for reading two books or translations side by side.
