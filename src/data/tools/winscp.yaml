  zh: Windows 上免费好用的 SFTP/FTP 文件传输客户端
  en: A free, capable SFTP/FTP file-transfer client for Windows
description:
  zh: 老牌 Windows 文件传输工具，支持 SFTP、FTP、FTPS、SCP、S3、WebDAV。提供双栏与资源管理器两种界面，可做目录同步与脚本自动化，免费且源码开源。
  en: A long-standing Windows file-transfer tool supporting SFTP, FTP, FTPS, SCP, S3 and WebDAV. It offers Norton-Commander and Explorer-style interfaces, directory sync and scripting automation — free, with source code open.
review:
  zh: |
    WinSCP 是 开源工具 领域中一款值得长期留存的代表作。老牌 Windows 文件传输工具，支持 SFTP、FTP、FTPS、SCP、S3、WebDAV。提供双栏与资源管理器两种界面，可做目录同步与脚本自动化，免费且源码开源。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 · 源码开源 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    WinSCP is a standout choice in software tools. A long-standing Windows file-transfer tool supporting SFTP, FTP, FTPS, SCP, S3 and WebDAV. It offers Norton-Commander and Explorer-style interfaces, directory sync and scripting automation — free, with source code open.

    From a user-freedom perspective, it is released under the GPL-3.0 · 源码开源 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
