description:
  zh: 一款以隐私和长期可用为设计理念的开源加密笔记工具，免费版即可无限笔记、无限设备加密同步，也可自建服务器；付费仅解锁编辑器、主题等增强功能。
  en: An open-source encrypted notes app built around privacy and longevity. The free tier gives unlimited notes and encrypted sync across unlimited devices, and you can self-host the server; paid tiers only add editors, themes and extras.
review:
  zh: |
    Standard Notes 是 效率与知识管理 领域中一款值得长期留存的代表作。一款以隐私和长期可用为设计理念的开源加密笔记工具，免费版即可无限笔记、无限设备加密同步，也可自建服务器；付费仅解锁编辑器、主题等增强功能。

    在“真免费、少打扰”的维度上，它采用 AGPL-3.0 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、iOS、Android、Web 浏览器 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Standard Notes is a standout choice in productivity and knowledge management. An open-source encrypted notes app built around privacy and longevity. The free tier gives unlimited notes and encrypted sync across unlimited devices, and you can self-host the server; paid tiers only add editors, themes and extras.

    From a user-freedom perspective, it is released under the AGPL-3.0 open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, iOS, Android, Web browsers, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
