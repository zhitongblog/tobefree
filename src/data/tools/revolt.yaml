tagline:
  zh: 专为游戏开黑与兴趣社区打造的开源 Discord 平替，不卖用户数据
  en: Open-source, user-first chat and voice platform built as a privacy-respecting alternative to Discord
description:
  zh: AGPL-3.0 开源的现代社区与游戏语音聊天平台。操作逻辑与 Discord 几乎零学习成本（支持自建服务器分组、自定义角色权限、文字频道与低延迟语音频道），但前后端代码全部开源，不拿你的聊天记录训练商业广告模型，也支持自己架设私有服务端。
  en: An AGPL-3.0 chat platform built from the ground up to feel immediately familiar to Discord users — with servers, custom roles, text channels and voice rooms — while remaining open source and self-hostable.
review:
  zh: |
    Revolt 是 开源工具 领域中一款值得长期留存的代表作。AGPL-3.0 开源的现代社区与游戏语音聊天平台。操作逻辑与 Discord 几乎零学习成本（支持自建服务器分组、自定义角色权限、文字频道与低延迟语音频道），但前后端代码全部开源，不拿你的聊天记录训练商业广告模型，也支持自己架设私有服务端。

    在“真免费、少打扰”的维度上，它采用 AGPL-3.0 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Windows、macOS、Linux、Android 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Revolt is a standout choice in software tools. An AGPL-3.0 chat platform built from the ground up to feel immediately familiar to Discord users — with servers, custom roles, text channels and voice rooms — while remaining open source and self-hostable.

    From a user-freedom perspective, it is released under the AGPL-3.0 open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, ships with zero ads and no invasive telemetry. With native support across Web browsers, Windows, macOS, Linux, Android, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
