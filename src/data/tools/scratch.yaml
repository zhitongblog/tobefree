description:
  zh: MIT 媒体实验室开发的图形化编程环境，用拖拽积木块的方式写程序，不用记语法、不会写错分号。可以做动画、小游戏和互动故事。桌面版完全离线，不需要注册账号。
  en: A visual programming environment from the MIT Media Lab where programs are assembled by dragging blocks — no syntax to memorize, no misplaced semicolons. Kids build animations, small games and interactive stories. The desktop version runs fully offline with no account required.
review:
  zh: |
    Scratch 是全世界用得最广的少儿编程入门工具，来自 MIT 媒体实验室，
    背后是一个非营利基金会。它的设计思路是把编程里"打字和语法"这一层完全拿掉——
    循环、条件、变量、事件都是彩色积木块，拖到一起就能拼成程序，形状不匹配的块根本拼不上去，
    所以孩子不会卡在"少了一个分号"这种和思维无关的问题上。

    但它不是玩具。顺序、循环、分支、变量、消息广播、并行执行、克隆体——
    这些都是真正的编程概念，只是换了一种表达方式。一个孩子在 Scratch 里做出一个能玩的游戏时，
    他已经理解了后面学 Python 或 JavaScript 时需要的大部分思维模型。

    对家长和老师最实用的一点：**有离线桌面版**。装在电脑上，
    断网也能用，孩子不会因为编程顺手点进浏览器里的别的东西。
    网页版则不用安装，打开就能开始。

    需要说明两处边界：

    - **在线分享作品需要注册账号**（分享到 Scratch 社区、看别人的作品、
      "改编"别人的项目）。只用离线版做自己的东西，完全不需要账号。
    - **授权情况比较复杂**：编辑器等主要组件是 AGPL-3.0 开源的（源码在 GitHub 上），
      但 Scratch 的名称、Logo 和猫的形象是商标，社区平台也不是完全开放的。
      我们按"核心可离线免费使用、无广告"收录它，但没有给完整的开源徽章。

    适合 8 岁以上。更小的孩子可以先看 ScratchJr（针对 5 到 7 岁的简化版，平板上用）。
  en: |
    Scratch is the most widely used introduction to programming for children in the world, created at
    the MIT Media Lab and stewarded by a non-profit foundation. Its design removes the typing-and-
    syntax layer entirely: loops, conditionals, variables and events are coloured blocks that snap
    together, and blocks whose shapes do not match simply will not connect — so a child never gets
    stuck on a missing semicolon, a problem that has nothing to do with thinking.

    It is not a toy, though. Sequence, iteration, branching, variables, message broadcasting, parallel
    execution, cloning — these are real programming concepts wearing a different notation. By the time
    a child has built a playable game in Scratch, they hold most of the mental models needed for
    Python or JavaScript later.

    The most practical point for parents and teachers: **there is an offline desktop version.**
    Installed locally it works without internet, so a child is not one click away from the rest of the
    browser. The web version needs no installation at all.

    Two boundaries worth stating:

    - **Sharing projects online requires an account** — publishing to the Scratch community, browsing
      others' work, or remixing a project. Working offline on your own creations needs no account.
    - **Licensing is layered:** the editor and main components are AGPL-3.0 open source with code on
      GitHub, but the Scratch name, logo and cat are trademarks, and the community platform is not
      fully open. We list it on the basis that the core is free, offline-capable and ad-free, without
      awarding a full open-source badge.

    Suitable from roughly age 8. For younger children, look at ScratchJr, a simplified tablet version
    aimed at ages 5 to 7.
