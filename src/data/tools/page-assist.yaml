tagline:
  zh: 把本地 Ollama 模型装进浏览器侧边栏，随时与当前网页对话
  en: An open-source browser sidebar and Web UI for your local Ollama and LM Studio models
description:
  zh: MIT 开源的浏览器扩展，为本地运行的 Ollama、LM Studio 或兼容 API 提供清爽的侧边栏与全屏聊天界面。看长文、读文档时按快捷键呼出侧边栏，直接用本机显卡总结网页或联网搜索，浏览记录与正文完全不经过第三方服务器。
  en: An MIT-licensed browser extension that brings a clean sidebar and full-page Web UI to your local Ollama or LM Studio models. Chat with the current webpage, summarize articles or run local RAG without sending your browsing data to third-party servers.
review:
  zh: |
    Page Assist 是 开源工具 领域中一款值得长期留存的代表作。MIT 开源的浏览器扩展，为本地运行的 Ollama、LM Studio 或兼容 API 提供清爽的侧边栏与全屏聊天界面。看长文、读文档时按快捷键呼出侧边栏，直接用本机显卡总结网页或联网搜索，浏览记录与正文完全不经过第三方服务器。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Page Assist is a standout choice in software tools. An MIT-licensed browser extension that brings a clean sidebar and full-page Web UI to your local Ollama or LM Studio models. Chat with the current webpage, summarize articles or run local RAG without sending your browsing data to third-party servers.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Web browsers, Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
