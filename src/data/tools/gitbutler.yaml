tagline:
  zh: 由 GitHub 联合创始人打造的虚拟分支 Git 客户端，同时处理多个任务不用切分支
  en: A modern Git client with virtual branches so you can work on multiple branches simultaneously
description:
  zh: 由 GitHub 联合创始人与《Pro Git》作者 Scott Chacon 推出的新型 Git 桌面客户端。独创「虚拟分支（Virtual Branches）」机制，在同一个工作目录里写代码后，直接把不同文件甚至不同代码行拖拽到不同分支泳道分别提交，彻底告别频繁 git stash 和 git checkout。
  en: 'Created by GitHub co-founder Scott Chacon, GitButler introduces Virtual Branches: work in a single working directory and drag individual files or hunks into separate branch lanes to commit or PR independently without constant stashing and switching.'
