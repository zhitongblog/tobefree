description:
  zh: 用 Go 编写的单二进制开源个人主页。不同于只摆一排图标的普通导航页，Glance 把你常看的 RSS 订阅、Hacker News、Reddit、GitHub Releases、天气预报、股票行情与内网服务器状态全部聚合在一屏信息流里，内存占用不到 20MB。
  en: A single-binary Go dashboard that aggregates your RSS feeds, Hacker News, Reddit, GitHub releases, weather, bookmarks and server status widgets into one fast, customizable startpage using under 20MB of RAM.
