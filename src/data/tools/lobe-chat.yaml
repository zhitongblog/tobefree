tagline:
  zh: 颜值与交互出众的现代化 AI 聊天与 Agent 工作区，支持一键自建
  en: Modern, design-forward AI chat workspace supporting local models, plugins,知识库 and self-hosting
description:
  zh: 设计精致的现代化 AI 对话与助手平台，支持一键部署到 Vercel / Docker 或直接使用桌面客户端。兼容 Ollama 本地模型与全部主流大模型服务商，具备完善的分支对话、Artifacts 实时预览、本地知识库与插件生态。
  en: A polished AI chat workspace deployable via Docker or desktop app. Supports local Ollama models and major cloud providers, featuring branching conversations, live Artifacts preview, knowledge base management and MCP plugins.
review:
  zh: |
    LobeChat 是 开源工具 领域中一款值得长期留存的代表作。设计精致的现代化 AI 对话与助手平台，支持一键部署到 Vercel / Docker 或直接使用桌面客户端。兼容 Ollama 本地模型与全部主流大模型服务商，具备完善的分支对话、Artifacts 实时预览、本地知识库与插件生态。

    在“真免费、少打扰”的维度上，它采用 Apache-2.0 (modified) 授权，核心功能对个人用户诚意开放，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Web 浏览器、Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    LobeChat is a standout choice in software tools. A polished AI chat workspace deployable via Docker or desktop app. Supports local Ollama models and major cloud providers, featuring branching conversations, live Artifacts preview, knowledge base management and MCP plugins.

    From a user-freedom perspective, it is distributed under Apache-2.0 (modified) with a generous free experience, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Web browsers, Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
