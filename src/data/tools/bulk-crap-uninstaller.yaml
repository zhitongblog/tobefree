tagline:
  zh: Windows 下最彻底的开源批量软件卸载器，连顽固流氓软件与残留注册表一起拔除
  en: Free, open-source bulk program uninstaller for Windows with deep leftover and registry detection
description:
  zh: Apache-2.0 开源的 Windows 强力卸载工具（Bulk Crap Uninstaller）。不仅能识别普通控制面板看不见的损坏安装项、Windows 商店应用和便携软件，还支持全自动静默批量卸载，并在卸载后深度扫描并清除残留文件夹与注册表项。
  en: An Apache-2.0 Windows uninstaller that detects standard apps, Microsoft Store packages, portable apps and broken installers. Automates unattended batch uninstalls and scrubs leftover directories and registry keys.
review:
  zh: |
    BCUninstaller 是 开源工具 领域中一款值得长期留存的代表作。Apache-2.0 开源的 Windows 强力卸载工具（Bulk Crap Uninstaller）。不仅能识别普通控制面板看不见的损坏安装项、Windows 商店应用和便携软件，还支持全自动静默批量卸载，并在卸载后深度扫描并清除残留文件夹与注册表项。

    在“真免费、少打扰”的维度上，它采用 Apache-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    BCUninstaller is a standout choice in software tools. An Apache-2.0 Windows uninstaller that detects standard apps, Microsoft Store packages, portable apps and broken installers. Automates unattended batch uninstalls and scrubs leftover directories and registry keys.

    From a user-freedom perspective, it is released under the Apache-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
