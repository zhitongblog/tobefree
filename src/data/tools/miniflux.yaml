tagline:
  zh: 极简、极快、专注纯粹文字阅读的 Go 语言自建 RSS 服务端
  en: Minimalist and opinionated self-hosted feed reader written in Go
description:
  zh: Apache-2.0 开源的自托管 RSS 阅读器。用 Go 语言编写，推崇极简与键盘优先，默认自动剥离追踪像素与广告脚本，内置一键抓取全文规则，并完整兼容 Fever 与 Google Reader API，可无缝对接 NetNewsWire、Reeder 等各平台客户端。
  en: An Apache-2.0 self-hosted RSS reader written in Go. Strips tracking pixels, fetches full article text for truncated feeds, supports keyboard-driven reading and exposes Fever/Google Reader APIs for mobile clients.
review:
  zh: |
    Miniflux 是 开源工具 领域中一款值得长期留存的代表作。Apache-2.0 开源的自托管 RSS 阅读器。用 Go 语言编写，推崇极简与键盘优先，默认自动剥离追踪像素与广告脚本，内置一键抓取全文规则，并完整兼容 Fever 与 Google Reader API，可无缝对接 NetNewsWire、Reeder 等各平台客户端。

    在“真免费、少打扰”的维度上，它采用 Apache-2.0 开源协议，代码公开透明、可独立审计，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Linux、macOS、Windows、Web 浏览器 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Miniflux is a standout choice in software tools. An Apache-2.0 self-hosted RSS reader written in Go. Strips tracking pixels, fetches full article text for truncated feeds, supports keyboard-driven reading and exposes Fever/Google Reader APIs for mobile clients.

    From a user-freedom perspective, it is released under the Apache-2.0 open-source license with publicly auditable code, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Linux, macOS, Windows, Web browsers, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
