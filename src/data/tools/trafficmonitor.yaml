tagline:
  zh: 干净纯粹的 Windows 任务栏网速、CPU、内存与硬件温度监控悬浮窗
  en: Clean, open-source Windows taskbar monitor for network speeds, CPU, RAM and temperatures
description:
  zh: 国内开发者开源的轻量级 Windows 状态监控小工具。曾经只有安全卫士全家桶才带的「桌面网速悬浮球」和「任务栏嵌入式监控」，用它只需几兆内存就能实现，完全开源、无弹窗、无后台驻留服务，支持自定义皮肤与硬件温度读取。
  en: A lightweight GPL-3.0 Windows utility that embeds real-time upload/download speeds, CPU/RAM load and hardware temperatures right into your taskbar or a tiny floating widget — with zero bloatware or pop-up ads.
review:
  zh: |
    TrafficMonitor 是 开源工具 领域中一款值得长期留存的代表作。国内开发者开源的轻量级 Windows 状态监控小工具。曾经只有安全卫士全家桶才带的「桌面网速悬浮球」和「任务栏嵌入式监控」，用它只需几兆内存就能实现，完全开源、无弹窗、无后台驻留服务，支持自定义皮肤与硬件温度读取。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    TrafficMonitor is a standout choice in software tools. A lightweight GPL-3.0 Windows utility that embeds real-time upload/download speeds, CPU/RAM load and hardware temperatures right into your taskbar or a tiny floating widget — with zero bloatware or pop-up ads.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
