tagline:
  zh: 纯净坚守二十余年的殿堂级本地无损音乐播放器，秒开十万首曲库
  en: Legendary lightweight, endlessly customizable local audio player supporting every lossless format
description:
  zh: 自 2002 年发布至今依然纯粹的免费本地音频播放器。没有任何在线歌单广告、直播间弹窗或会员推销，内存占用极小，原生通吃 FLAC、APE、WAV、DSD 等无损格式，并提供强大的批量标签管理、音频格式转换与 ReplayGain 响度均衡。
  en: A revered freeware audio player running strong for over two decades with zero ads, telemetry or streaming bloat. Handles massive libraries of FLAC, WAV, ALAC and DSD effortlessly with built-in format conversion and tagging.
review:
  zh: |
    foobar2000 是 开源工具 领域中一款值得长期留存的代表作。自 2002 年发布至今依然纯粹的免费本地音频播放器。没有任何在线歌单广告、直播间弹窗或会员推销，内存占用极小，原生通吃 FLAC、APE、WAV、DSD 等无损格式，并提供强大的批量标签管理、音频格式转换与 ReplayGain 响度均衡。

    在“真免费、少打扰”的维度上，它采用 Freeware 授权，核心功能对个人用户诚意开放，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、iOS、Android 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    foobar2000 is a standout choice in software tools. A revered freeware audio player running strong for over two decades with zero ads, telemetry or streaming bloat. Handles massive libraries of FLAC, WAV, ALAC and DSD effortlessly with built-in format conversion and tagging.

    From a user-freedom perspective, it is distributed under Freeware with a generous free experience, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, iOS, Android, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
