description:
  zh: 自 2002 年发布至今依然纯粹的免费本地音频播放器。没有任何在线歌单广告、直播间弹窗或会员推销，内存占用极小，原生通吃 FLAC、APE、WAV、DSD 等无损格式，并提供强大的批量标签管理、音频格式转换与 ReplayGain 响度均衡。
  en: A revered freeware audio player running strong for over two decades with zero ads, telemetry or streaming bloat. Handles massive libraries of FLAC, WAV, ALAC and DSD effortlessly with built-in format conversion and tagging.
