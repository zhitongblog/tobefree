tagline:
  zh: 由非营利组织打造、默认保护隐私的开源浏览器
  en: An open-source browser built by a nonprofit that protects privacy by default
description:
  zh: Mozilla 出品的开源浏览器，默认拦截数千种追踪器，隐私窗口关闭即清空记录。同步数据端到端加密，不出售用户信息，是主流浏览器里少有的以用户为先的选择。
  en: Mozilla's open-source browser blocks thousands of trackers by default, and Private Windows wipe everything on close. Synced data is end-to-end encrypted, your information is never sold — a rare user-first choice among mainstream browsers.
review:
  zh: |
    Firefox 是 开源工具 领域中一款值得长期留存的代表作。Mozilla 出品的开源浏览器，默认拦截数千种追踪器，隐私窗口关闭即清空记录。同步数据端到端加密，不出售用户信息，是主流浏览器里少有的以用户为先的选择。

    在“真免费、少打扰”的维度上，它采用 MPL-2.0 开源协议，代码公开透明、可独立审计，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、iOS、Android 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Firefox is a standout choice in software tools. Mozilla's open-source browser blocks thousands of trackers by default, and Private Windows wipe everything on close. Synced data is end-to-end encrypted, your information is never sold — a rare user-first choice among mainstream browsers.

    From a user-freedom perspective, it is released under the MPL-2.0 open-source license with publicly auditable code, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, iOS, Android, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
