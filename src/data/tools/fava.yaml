tagline:
  zh: 纯文本复式记账 Beancount 的官方级交互式网页界面，账本秒变专业资产负债表
  en: The official web interface for Beancount plain-text double-entry accounting
description:
  zh: 用 Beancount 做纯文本复式记账的人必装的 MIT 开源可视化前端。只需运行一行 `fava main.bean`，就能在本地浏览器里查看交互式损益表、资产负债表、桑基图资金流向、持仓成本并直接在网页编辑器里补录分录。
  en: An MIT-licensed web UI for Beancount plain-text accounting files. Turns your local `.bean` text ledger into interactive income statements, balance sheets, treemaps and journal editors.
review:
  zh: |
    Fava 是 开源工具 领域中一款值得长期留存的代表作。用 Beancount 做纯文本复式记账的人必装的 MIT 开源可视化前端。只需运行一行 `fava main.bean`，就能在本地浏览器里查看交互式损益表、资产负债表、桑基图资金流向、持仓成本并直接在网页编辑器里补录分录。

    在“真免费、少打扰”的维度上，它采用 MIT 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、Web 浏览器、命令行 (CLI) 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Fava is a standout choice in software tools. An MIT-licensed web UI for Beancount plain-text accounting files. Turns your local `.bean` text ledger into interactive income statements, balance sheets, treemaps and journal editors.

    From a user-freedom perspective, it is released under the MIT open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, Web browsers, CLI, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
