tagline:
  zh: 界面极度直观、专为 Git 版本控制优化的跨平台开源 PCB 电路板设计软件
  en: Free, intuitive, cross-platform open-source EDA software with human-readable Git-friendly project files
description:
  zh: GPL-3.0 开源的跨平台电子电路设计软件。很多传统 EDA 软件的工程文件是一坨没法做 Git Diff 的乱码，而且换个版本就打不开；LibrePCB 界面极度干净易学，所有工程与封装库文件专门设计为对 Git 极度友好的可读文本结构，还内置一键导出打样文件功能。
  en: A GPL-3.0 cross-platform PCB design suite praised for its intuitive interface, built-in library manager, 3D viewer and canonical human-readable file format designed specifically for clean Git diffs.
review:
  zh: |
    LibrePCB 是 开源工具 领域中一款值得长期留存的代表作。GPL-3.0 开源的跨平台电子电路设计软件。很多传统 EDA 软件的工程文件是一坨没法做 Git Diff 的乱码，而且换个版本就打不开；LibrePCB 界面极度干净易学，所有工程与封装库文件专门设计为对 Git 极度友好的可读文本结构，还内置一键导出打样文件功能。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    LibrePCB is a standout choice in software tools. A GPL-3.0 cross-platform PCB design suite praised for its intuitive interface, built-in library manager, 3D viewer and canonical human-readable file format designed specifically for clean Git diffs.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
