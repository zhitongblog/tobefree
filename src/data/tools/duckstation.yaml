tagline:
  zh: 能消掉初代 PS1 画面多边形抖动、直出 4K 宽屏的现代 PlayStation 1 模拟器
  en: Fast PlayStation 1 emulator with PGXP perspective correction and 4K widescreen enhancements
description:
  zh: GPL-3.0 开源的初代索尼 PlayStation（PS1 / PSX）模拟器。除了无需折腾繁琐插件就能满帧运行，它最大的杀手锏是 PGXP 几何精度修正技术——能彻底消除当年 PS1 硬件缺少浮点坐标导致的贴图扭曲与多边形抖动，让三十年前的老游戏在 4K 显示器上焕然一新。
  en: A modern GPL-3.0 PlayStation 1 emulator that works out of the box without plugin headaches. Its standout PGXP feature fixes the classic PS1 polygon wobble and texture warping while upscaling 3D games to 4K widescreen.
review:
  zh: |
    DuckStation 是 开源工具 领域中一款值得长期留存的代表作。GPL-3.0 开源的初代索尼 PlayStation（PS1 / PSX）模拟器。除了无需折腾繁琐插件就能满帧运行，它最大的杀手锏是 PGXP 几何精度修正技术——能彻底消除当年 PS1 硬件缺少浮点坐标导致的贴图扭曲与多边形抖动，让三十年前的老游戏在 4K 显示器上焕然一新。

    在“真免费、少打扰”的维度上，它采用 GPL-3.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    DuckStation is a standout choice in software tools. A modern GPL-3.0 PlayStation 1 emulator that works out of the box without plugin headaches. Its standout PGXP feature fixes the classic PS1 polygon wobble and texture warping while upscaling 3D games to 4K widescreen.

    From a user-freedom perspective, it is released under the GPL-3.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
