description:
  zh: 原本是硅谷明星创业项目，后团队决定将价值百万美金的代码库以 AGPL-3.0 完全开源。界面设计堪称记账软件天花板，统一追踪日常流水、多币种账户、房产车辆、股票基金持仓与净值曲线，支持用 Docker Compose 在自己电脑或 NAS 上免费部署。
  en: Originally a VC-backed fintech startup that open-sourced its entire codebase under AGPL-3.0. Tracks cash flow, multi-currency accounts, debts, real estate and investment portfolios in a stunning self-hostable dashboard.
