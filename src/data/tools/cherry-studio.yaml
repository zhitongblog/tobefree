description:
  zh: 支持同时接入本地 Ollama / LM Studio 与数十家云端 API 的跨平台 AI 桌面工作台。内置本地知识库（RAG）、多模型同屏对比、数百个预设助手以及原生的 MCP Server 可视化管理，无需注册即可开箱使用。
  en: A cross-platform desktop AI workbench that connects to local Ollama/LM Studio models and dozens of cloud APIs. Includes built-in local knowledge bases (RAG), multi-model side-by-side comparison, preset assistants and visual MCP server management with no sign-up required.
