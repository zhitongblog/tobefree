description:
  zh: 几乎能播放任何音视频格式，无需另装解码器。开源、无广告、跨全平台，永远的桌面必备。
  en: Plays virtually any audio or video format with no extra codecs. Open source, ad-free, cross-platform — an eternal desktop staple.
review:
  zh: |
    VLC 是 开源工具 领域中一款值得长期留存的代表作。几乎能播放任何音视频格式，无需另装解码器。开源、无广告、跨全平台，永远的桌面必备。

    在“真免费、少打扰”的维度上，它采用 GPL-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、macOS、Linux、iOS、Android 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    VLC is a standout choice in software tools. Plays virtually any audio or video format with no extra codecs. Open source, ad-free, cross-platform — an eternal desktop staple.

    From a user-freedom perspective, it is released under the GPL-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, macOS, Linux, iOS, Android, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
