tagline:
  zh: 一屏同看几十台局域网电脑画面、一键屏幕广播与远程控制的开源机房/实验室神器
  en: Open-source computer monitoring and classroom management software for Windows and Linux
description:
  zh: GPL-2.0 开源的跨平台多机远程监控与控制软件。不仅适合学校机房和培训室（一屏网格查看所有机器画面、一键把主机屏幕广播给所有人、远程锁屏或分发文件），也非常适合家里或工作室管理多台测试机，完全局域网运行零费用。
  en: A GPL-2.0 LAN monitoring and remote control suite. View dozens of Windows and Linux screens in a single grid, broadcast your screen in real time, distribute files and take remote control with zero cloud relays.
review:
  zh: |
    Veyon 是 开源工具 领域中一款值得长期留存的代表作。GPL-2.0 开源的跨平台多机远程监控与控制软件。不仅适合学校机房和培训室（一屏网格查看所有机器画面、一键把主机屏幕广播给所有人、远程锁屏或分发文件），也非常适合家里或工作室管理多台测试机，完全局域网运行零费用。

    在“真免费、少打扰”的维度上，它采用 GPL-2.0 开源协议，代码公开透明、可独立审计，支持纯本地离线运行，核心数据保存在你自己的设备上，支持 Docker 或私有服务器自建部署，彻底摆脱第三方云服务锁定，无需强制注册账号即可直接上手使用，无广告弹窗与商业遥测追踪。目前原生覆盖 Windows、Linux 平台，非常适合希望摆脱昂贵订阅制或臃肿商业软件的用户作为主力替代方案。
  en: |
    Veyon is a standout choice in software tools. A GPL-2.0 LAN monitoring and remote control suite. View dozens of Windows and Linux screens in a single grid, broadcast your screen in real time, distribute files and take remote control with zero cloud relays.

    From a user-freedom perspective, it is released under the GPL-2.0 open-source license with publicly auditable code, works completely offline so your files and data stay on your own disk, can be self-hosted on your own server or homelab to avoid vendor lock-in, requires no mandatory account sign-up to get started, ships with zero ads and no invasive telemetry. With native support across Windows, Linux, it serves as a dependable, long-term alternative to subscription-heavy or ad-bloated commercial software.
