tagline:
  zh: 用写代码的方式建模，改参数比拖鼠标准
  en: Model by writing code — changing a parameter beats dragging a mouse
description:
  zh: 用脚本描述三维模型的建模软件。你写的不是鼠标操作，而是几何描述代码：立方体减去圆柱、沿路径阵列、按变量计算尺寸。模型可以版本管理、可以被生成、可以只改一个变量批量出一整套。
  en: A 3D modeler driven by a script rather than a mouse. You write geometry as code — subtract a cylinder from a cube, array along a path, derive dimensions from variables. Models can be version-controlled, generated programmatically, and re-parameterized wholesale by changing one variable.
review:
  zh: |
    OpenSCAD 的定位很特别：它不是给你拖拽建模的，而是让你**写代码描述模型**。
    左边写脚本，右边实时渲染出形状。听起来反直觉，但对某一类需求它是最优解。

    典型场景是做功能性零件。比如你要给某个设备做一个安装支架，
    孔距是 32 毫米、板厚 3 毫米、螺丝孔 M4。在 OpenSCAD 里这些都是变量，
    写好一次之后，下次遇到孔距 40 毫米的设备，改一个数字重新导出就行。
    需要同时出一整套不同尺寸的？写个循环。这种"参数化生成"的能力，
    图形界面的建模软件做起来要麻烦得多。

    附带的好处是**模型文件就是文本**——可以放进 Git 做版本管理、可以看 diff、
    可以协作、可以让程序生成。这在开源硬件项目里很受欢迎，
    Thingiverse 上大量可定制模型的底层就是 OpenSCAD 脚本。

    它的限制同样明确：**不适合做有机形状和外观造型**。
    曲面、圆角过渡、艺术化的外形，用它做会非常痛苦，那是 Blender 的领域。
    它擅长的是规规矩矩的机械件和结构件。

    **一个必须说明的情况**：它的正式发布版本停在 openscad-2021.01，
    已经好几年没有打新的稳定版了。但项目本身仍在活跃开发，
    官网提供持续更新的开发快照（development snapshot），
    实际上社区里大家用的就是快照版，新功能（比如更快的渲染后端）也都在里面。
    这是这个项目一贯的发版风格，不是无人维护——但你从官网下载时会看到两个选项，
    知道该选哪个比较重要。
  en: |
    OpenSCAD occupies an unusual position: you do not drag geometry, you **write code that describes
    it.** Script on the left, live-rendered shape on the right. It sounds backwards, and for one class
    of work it is the best answer available.

    The archetypal use is functional parts. Say you need a mounting bracket: hole spacing 32 mm, plate
    3 mm thick, M4 screws. In OpenSCAD those are variables — write it once, and the next device with
    40 mm spacing needs one number changed and a re-export. Need a whole set of sizes at once? Write a
    loop. That kind of parametric generation is far more laborious in a GUI modeler.

    A side benefit is that **the model file is text** — it goes into Git, produces readable diffs,
    supports collaboration, and can be generated by other programs. Open hardware projects love this,
    and a large share of the customizable models on Thingiverse are OpenSCAD scripts underneath.

    Its limits are equally clear: **it is wrong for organic shapes and styling.** Sculpted surfaces,
    flowing fillets and artistic forms are painful here — that is Blender's territory. What it does
    well is disciplined mechanical and structural parts.

    **One situation to be explicit about:** the tagged stable release is still openscad-2021.01, with
    no new stable version for several years. The project itself remains under active development and
    the official site offers continuously updated development snapshots — in practice, the snapshot is
    what the community runs, and new capabilities such as the faster rendering backend live there.
    This is simply how the project has always released, not abandonment — but you will see two options
    on the download page, and knowing which to take matters.
