tagline:
  zh: 把 Jev 的毫秒级引用核查、注入拦截与语义重排接入任意 MCP 客户端
  en: Expose Jev primitives (jev_verify, jev_screen, jev_find) as MCP tools for coding and chat agents
description:
  zh: 将 Jev 决策模型最核心的三大高频原语封装为标准 MCP 服务：jev_verify（实时核对模型回答是否忠于原文引用）、jev_screen（毫秒级提示词注入与安全护栏筛查）以及 jev_find（无需建向量库的轻量语义排序）。
  en: 'Wraps the most practical Jev decision patterns into an MCP server: jev_verify for citation grounding checks, jev_screen for fast prompt-injection screening, and jev_find for embedding-free semantic ranking.'
