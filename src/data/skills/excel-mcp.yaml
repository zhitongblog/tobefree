review:
  zh: |
    Excel MCP Server 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。开源（MIT）的 Excel MCP 服务器，让 AI 创建和修改 .xlsx 文件：读写单元格、写公式、改格式、建图表和数据透视表。电脑上不需要安装 Microsoft Excel，纯本地运行。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `uvx excel-mcp-server stdio` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Excel MCP Server is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. An open-source (MIT) Excel MCP server that lets AI create and edit .xlsx files — cells, formulas, formatting, charts and pivot tables. No Microsoft Excel install required; runs fully locally.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Any MCP client. You can set it up quickly via `uvx excel-mcp-server stdio`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
