review:
  zh: |
    Brave Search MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。Brave 官方的 MCP 服务器，通过 Brave Search API 提供网页、新闻、图片、视频和本地地点搜索。索引独立、注重隐私，适合给 Agent 做实时联网检索。需要免费 API Key。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `npx -y @brave/brave-search-mcp-server` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Brave Search MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. Brave's official MCP server exposing web, news, image, video and local search through the Brave Search API. An independent, privacy-focused index — ideal for giving agents live web retrieval. Requires a free API key.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `npx -y @brave/brave-search-mcp-server`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
