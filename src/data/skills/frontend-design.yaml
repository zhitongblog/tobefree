review:
  zh: |
    Frontend Design 是面向现代 AI 辅助编程与工作流的开源 AI Agent 技能包（Agent Skill）。Anthropic 官方开源（Apache-2.0）技能，在构建或改造界面时给 Claude 提供审美方向、字体排版和布局上的指导， 帮它做出有主张、不落俗套的设计，避免千篇一律的"默认模板"观感。

    在实用性与工程自由度上，它采用 Apache-2.0 协议开放源码，无缝兼容 Claude、Claude Code、Claude Desktop 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Frontend Design is an open-source modular AI Agent Skill built for modern AI-assisted development workflows. An official open-source (Apache-2.0) skill that gives Claude aesthetic direction, typography and layout guidance when building or reshaping UI, helping it make distinctive, intentional choices instead of templated defaults.

    Released under the Apache-2.0 license, it works across Claude, Claude Code, Claude Desktop. it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
