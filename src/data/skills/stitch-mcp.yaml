  zh: 把 Google Stitch 生成的 UI 直接接进你的代码
  en: Pipe Google Stitch-generated UI straight into your code
description:
  zh: 一个开源 MCP 服务器，把 Google Stitch 里 AI 生成的界面设计搬进你的开发流程 —— 拿到屏幕代码、截图，按路由拼出站点。客户端开源，使用需一个免费 Google 账号。
  en: An open-source MCP server that moves AI-generated UI designs from Google Stitch into your dev workflow — fetch screen code, images, and assemble sites by route. The client is open source; use needs a free Google account.
review:
  zh: |
    Google Stitch MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。一个开源 MCP 服务器，把 Google Stitch 里 AI 生成的界面设计搬进你的开发流程 —— 拿到屏幕代码、截图，按路由拼出站点。客户端开源，使用需一个免费 Google 账号。

    在实用性与工程自由度上，它采用 Open Source 协议开放源码，无缝兼容 Claude Code、Claude Desktop、Cursor、Windsurf、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Google Stitch MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. An open-source MCP server that moves AI-generated UI designs from Google Stitch into your dev workflow — fetch screen code, images, and assemble sites by route. The client is open source; use needs a free Google account.

    Released under the Open Source license, it works across Claude Code, Claude Desktop, Cursor, Windsurf, Any MCP client. it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
