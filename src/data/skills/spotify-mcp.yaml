description:
  zh: 开源的 MCP 服务器，让 AI 连上 Spotify，实现播放、暂停、跳曲、搜索曲目/专辑/歌单，以及管理播放队列和歌单。需要自建 Spotify 开发者应用凭据和 Premium 账号。
  en: An open-source MCP server that connects AI to Spotify to start, pause and skip playback, search tracks/albums/playlists, and manage the queue and playlists. Requires your own Spotify developer app credentials and a Premium account.
review:
  zh: |
    Spotify MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。开源的 MCP 服务器，让 AI 连上 Spotify，实现播放、暂停、跳曲、搜索曲目/专辑/歌单，以及管理播放队列和歌单。需要自建 Spotify 开发者应用凭据和 Premium 账号。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `uvx --python 3.12 --from git+https://github.com/varunneal/spotify-mcp spotify-mcp` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Spotify MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. An open-source MCP server that connects AI to Spotify to start, pause and skip playback, search tracks/albums/playlists, and manage the queue and playlists. Requires your own Spotify developer app credentials and a Premium account.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `uvx --python 3.12 --from git+https://github.com/varunneal/spotify-mcp spotify-mcp`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
