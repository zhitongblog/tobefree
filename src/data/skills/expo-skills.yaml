review:
  zh: |
    Expo Skills 是面向现代 AI 辅助编程与工作流的开源 AI Agent 技能包（Agent Skill）。Expo 官方开源（MIT）的技能集，覆盖 Expo Router、原生 UI、数据请求、升级 SDK、EAS 构建与发布等，让 Agent 按 Expo 当前的最佳实践写 React Native 应用。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `npx skills@latest add expo/skills --skill '*'` 快速接入，无缝兼容 Claude Code、Codex、Cursor、OpenCode 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Expo Skills is an open-source modular AI Agent Skill built for modern AI-assisted development workflows. Expo's official open-source (MIT) skills covering Expo Router, native UI, data fetching, SDK upgrades and EAS build and submit, so agents write React Native apps the way Expo recommends today.

    Released under the MIT license, it works across Claude Code, Codex, Cursor, OpenCode. You can set it up quickly via `npx skills@latest add expo/skills --skill '*'`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
