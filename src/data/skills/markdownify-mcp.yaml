    it with Docker.
review:
  zh: |
    Markdownify MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。开源（MIT）的格式转换 MCP 服务器，能把 PDF、DOCX、XLSX、PPTX、图片、网页、YouTube 字幕等转成 Markdown，方便 AI 读取和引用。需要克隆仓库本地构建，也可以用 Docker 运行。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，无缝兼容 Claude Desktop、Claude Code、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Markdownify MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. An open-source (MIT) conversion MCP server that turns PDF, DOCX, XLSX, PPTX, images, web pages and YouTube transcripts into Markdown the model can read. Build it locally from the repo or run it with Docker.

    Released under the MIT license, it works across Claude Desktop, Claude Code, Any MCP client. it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
