description:
  zh: >-
    开源（MIT）的格式转换 MCP 服务器，能把 PDF、DOCX、XLSX、PPTX、图片、网页、YouTube 字幕等转成 Markdown，方便 AI
    读取和引用。需要克隆仓库本地构建，也可以用 Docker 运行。
