review:
  zh: |
    Wikipedia MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。一个 MCP 服务器，为 LLM 提供维基百科的实时检索、文章获取、摘要与结构化内容提取，用作准确、可溯源的知识来源。无需 API Key（可选令牌以避免限流）。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `uvx wikipedia-mcp` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Wikipedia MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. An MCP server giving LLMs real-time Wikipedia search, article retrieval, summaries and structured extraction as an accurate, traceable knowledge source. No API key required (an optional token avoids rate limits).

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `uvx wikipedia-mcp`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
