description:
  zh: 连接 Linear 项目管理平台的 MCP 服务。开发者在 IDE 或终端里修复 Bug 时，可以直接让 AI 拉取对应 Issue 的上下文、更新任务状态、创建子任务或关联 PR，无需在浏览器与编辑器之间反复横跳。
  en: Connects Linear to your AI assistant so you can pull issue context, update statuses, file sub-issues and link pull requests without leaving your terminal or code editor.
