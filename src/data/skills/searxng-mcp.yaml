description:
  zh: 开源（MIT）的 MCP 服务器，把 SearXNG 元搜索引擎接给 AI。配合自建实例使用，不需要任何付费搜索 API Key，查询也不会按账号被追踪，还能把网页正文抓成 Markdown。
