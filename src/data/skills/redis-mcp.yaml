kind: mcp
name: Redis MCP
accent: '#DC382D'
initials: RD
license: 'MIT'
website: https://redis.io
repo: https://github.com/redis/mcp-redis
install: 'uvx --from redis-mcp-server@latest redis-mcp-server --url redis://localhost:6379/0'
featured: false
popular: false
selfMade: false
added: '2026-07-05'
tags: [redis, database, cache, 缓存]
clients: [Claude, Claude Code, Cursor, Cline, Any MCP client]
badges: [open-source, no-ads, no-tracking, offline, no-signup, self-hostable, cross-platform]
tagline:
  zh: 用自然语言管理和检索 Redis 数据
  en: Manage and search Redis data in natural language
description:
  zh: Redis 官方开源的 MCP 服务器，为 Agent 提供对 Redis 的自然语言接口，支持字符串、哈希、列表、集合、有序集合、流、JSON 以及向量检索等数据结构。可连本地 Redis，无需账号。
  en: Redis's official open-source MCP server giving agents a natural-language interface to Redis across strings, hashes, lists, sets, sorted sets, streams, JSON and vector search. Point it at a local Redis with no account required.
review:
  zh: |
    Redis MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。Redis 官方开源的 MCP 服务器，为 Agent 提供对 Redis 的自然语言接口，支持字符串、哈希、列表、集合、有序集合、流、JSON 以及向量检索等数据结构。可连本地 Redis，无需账号。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `uvx --from redis-mcp-server@latest redis-mcp-server --url redis://localhost:6379/0` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Redis MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. Redis's official open-source MCP server giving agents a natural-language interface to Redis across strings, hashes, lists, sets, sorted sets, streams, JSON and vector search. Point it at a local Redis with no account required.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `uvx --from redis-mcp-server@latest redis-mcp-server --url redis://localhost:6379/0`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
