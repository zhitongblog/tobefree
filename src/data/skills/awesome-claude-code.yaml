review:
  zh: |
    Awesome Claude Code 是面向现代 AI 辅助编程与工作流的开源 AI Agent 技能包（Agent Skill）。社区维护的 Claude Code 资源大全，收录技能、子 Agent、斜杠命令、钩子、状态栏、CLAUDE.md 范例和周边工具，每一项都经过人工挑选。想系统了解 Claude Code 生态从这里开始。

    在实用性与工程自由度上，它采用 开源协议 协议开放源码，无缝兼容 Claude Code 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Awesome Claude Code is an open-source modular AI Agent Skill built for modern AI-assisted development workflows. A community-maintained, hand-picked list of Claude Code resources — skills, subagents, slash commands, hooks, status lines, CLAUDE.md examples and tooling. The place to start exploring the Claude Code ecosystem.

    Released under the 开源协议 license, it works across Claude Code. it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
