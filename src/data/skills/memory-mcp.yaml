description:
  zh: 官方参考实现的 MCP 服务器，用本地知识图谱存储实体、关系和观察，让模型在多次会话之间记住并检索信息。
  en: An official reference MCP server that stores entities, relations and observations in a local knowledge graph, letting the model remember and retrieve information across sessions.
review:
  zh: |
    Memory MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。官方参考实现的 MCP 服务器，用本地知识图谱存储实体、关系和观察，让模型在多次会话之间记住并检索信息。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `npx -y @modelcontextprotocol/server-memory` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Memory MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. An official reference MCP server that stores entities, relations and observations in a local knowledge graph, letting the model remember and retrieve information across sessions.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `npx -y @modelcontextprotocol/server-memory`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
