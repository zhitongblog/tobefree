review:
  zh: |
    Neo4j MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。Neo4j Labs 开源（MIT）的一组 MCP 服务器：mcp-neo4j-cypher 把自然语言转成 Cypher 查询，mcp-neo4j-memory 把对话知识存成图谱，另有数据建模工具。接本地 Neo4j 即可使用。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `uvx mcp-neo4j-cypher` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Neo4j MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. A set of open-source (MIT) MCP servers from Neo4j Labs — mcp-neo4j-cypher turns natural language into Cypher, mcp-neo4j-memory stores knowledge as a graph, plus a data-modeling tool. Works with a local Neo4j.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Any MCP client. You can set it up quickly via `uvx mcp-neo4j-cypher`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
