review:
  zh: |
    SoloMD 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。SoloMD 内置一个约 1.5MB 的 MCP 服务器，暴露 8 个只读工具，让 Claude、Cursor 等安全地检索、读取你本地的 Markdown 笔记 —— 数据不出本机。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，无缝兼容 Claude、Claude Desktop、Cursor、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    SoloMD is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. SoloMD ships a ~1.5MB MCP server exposing 8 read-only tools so Claude, Cursor and others can search and read your local Markdown notes — your data never leaves your machine.

    Released under the MIT license, it works across Claude, Claude Desktop, Cursor, Any MCP client. it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
