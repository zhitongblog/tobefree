    Slack GIF Creator 是面向现代 AI 辅助编程与工作流的开源 AI Agent 技能包（Agent Skill）。Anthropic 官方开源（Apache-2.0）技能，让 Claude 用 Python 生成动画 GIF，并自动控制尺寸、帧数和文件大小，满足 Slack 表情与消息的限制。

