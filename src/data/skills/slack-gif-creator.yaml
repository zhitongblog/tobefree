  en: |
    Slack GIF Creator is an open-source modular AI Agent Skill built for modern AI-assisted development workflows. An official open-source (Apache-2.0) skill that has Claude generate animated GIFs in Python while keeping dimensions, frame count and file size within Slack's emoji and message limits.

