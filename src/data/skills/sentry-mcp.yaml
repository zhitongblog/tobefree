tagline:
  zh: Sentry 官方出品，让 AI 直接拉取线上真实崩溃堆栈、面包屑日志并定位修复代码
  en: Official Sentry MCP server that feeds production stack traces and issue context straight to your coding agent
description:
  zh: 由 Sentry 官方维护的开源 MCP 服务。无需手动复制粘贴线上报错信息，直接把 Sentry Issue 链接丢给 Claude Code 或 Cursor，AI 即可自动拉取完整调用栈、触发频率与上下文事件并生成修复补丁。
  en: Maintained by Sentry, this MCP server lets your AI coding assistant inspect live production exceptions, stack traces, breadcrumbs and release regressions to propose fixes directly.
review:
  zh: |
    Sentry MCP Server 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。由 Sentry 官方维护的开源 MCP 服务。无需手动复制粘贴线上报错信息，直接把 Sentry Issue 链接丢给 Claude Code 或 Cursor，AI 即可自动拉取完整调用栈、触发频率与上下文事件并生成修复补丁。

    在实用性与工程自由度上，它采用 Apache-2.0 协议开放源码，可通过 `npx -y @sentry/mcp-server` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Windsurf、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Sentry MCP Server is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. Maintained by Sentry, this MCP server lets your AI coding assistant inspect live production exceptions, stack traces, breadcrumbs and release regressions to propose fixes directly.

    Released under the Apache-2.0 license, it works across Claude, Claude Code, Cursor, Windsurf, Any MCP client. You can set it up quickly via `npx -y @sentry/mcp-server`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
