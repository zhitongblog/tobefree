  zh: 官方参考实现的 MCP 服务器，抓取指定 URL 的内容并转换为简洁的 Markdown，便于模型高效阅读，支持分段获取长页面。
  en: An official reference MCP server that fetches a URL and converts its content into clean Markdown for efficient model consumption, with chunked reading of long pages.
review:
  zh: |
    Fetch MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。官方参考实现的 MCP 服务器，抓取指定 URL 的内容并转换为简洁的 Markdown，便于模型高效阅读，支持分段获取长页面。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `uvx mcp-server-fetch` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Fetch MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. An official reference MCP server that fetches a URL and converts its content into clean Markdown for efficient model consumption, with chunked reading of long pages.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `uvx mcp-server-fetch`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
