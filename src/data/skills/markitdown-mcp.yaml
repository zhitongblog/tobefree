review:
  zh: |
    MarkItDown MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。微软官方 markitdown 的 MCP 服务器，通过一个 convert_to_markdown 工具，把 PDF、Word、PPT、Excel、图片、HTML 以及网页 URL 转换成适合 LLM 阅读的干净 Markdown。本地运行、无需 API Key。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `uvx markitdown-mcp` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    MarkItDown MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. The MCP server for Microsoft's markitdown, exposing a single convert_to_markdown tool that turns PDF, Word, PowerPoint, Excel, images, HTML and web URLs into clean, LLM-ready Markdown. Runs locally with no API key.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `uvx markitdown-mcp`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
