description:
  zh: TypeSafe AI 官方维护的 Agent 技能包。由于大模型默认习惯把 Jev 当成普通聊天接口一次只问一个问题，该技能专门向 Claude Code / Cursor 注入正确的 System 1 编程范式：把多个结构化问题合并在一次 Prefill 调用中并发求值，充分发挥百毫秒级延迟与极低成本优势。
  en: Official skills from TypeSafe AI that teach coding agents how to write idiomatic Jev code — specifically batching multiple typed questions into a single state prefill call rather than falling into slow single-question anti-patterns.
