description:
  zh: 一个 TypeScript 编写的 MCP 服务器，为 Agent 抓取 YouTube 视频的字幕/文字稿，支持多语言，请求从本机发起，便于做视频内容总结与分析。无需 API Key。
  en: A TypeScript MCP server that fetches YouTube video transcripts for agents, with multi-language support and requests made from your own machine — great for summarizing and analyzing video content. No API key required.
review:
  zh: |
    YouTube Transcript MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。一个 TypeScript 编写的 MCP 服务器，为 Agent 抓取 YouTube 视频的字幕/文字稿，支持多语言，请求从本机发起，便于做视频内容总结与分析。无需 API Key。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `npx -y @sinco-lab/mcp-youtube-transcript` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    YouTube Transcript MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. A TypeScript MCP server that fetches YouTube video transcripts for agents, with multi-language support and requests made from your own machine — great for summarizing and analyzing video content. No API key required.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `npx -y @sinco-lab/mcp-youtube-transcript`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
