review:
  zh: |
    MCP Inspector 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。MCP 官方开源的调试工具，提供网页界面、命令行和 TUI 三种模式。连上任意 MCP 服务器后可以逐个调用工具、浏览资源和提示词、观察原始消息，自己写 MCP Server 时拿它测试最方便。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `npx @modelcontextprotocol/inspector` 快速接入，无缝兼容 Any MCP server 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    MCP Inspector is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. The official open-source MCP debugging tool with web UI, CLI and TUI modes. Connect to any MCP server to call tools one by one, browse resources and prompts, and watch raw messages — the easiest way to test a server you're building.

    Released under the MIT license, it works across Any MCP server. You can set it up quickly via `npx @modelcontextprotocol/inspector`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
