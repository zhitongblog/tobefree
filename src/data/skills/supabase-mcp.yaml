review:
  zh: |
    Supabase MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。Supabase 社区维护的开源 MCP 服务器，让模型通过管理 API 操作 Supabase 项目、查询数据库、管理表和 Edge Functions。本地以 npx 运行，需要个人访问令牌。

    在实用性与工程自由度上，它采用 Apache-2.0 协议开放源码，可通过 `npx -y @supabase/mcp-server-supabase@latest --access-token <token>` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Supabase MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. A community-maintained open-source MCP server that lets the model work with Supabase projects via the Management API — query the database, manage tables and Edge Functions. Runs locally via npx and requires a personal access token.

    Released under the Apache-2.0 license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `npx -y @supabase/mcp-server-supabase@latest --access-token <token>`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
