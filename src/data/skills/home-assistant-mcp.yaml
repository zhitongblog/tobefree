review:
  zh: |
    Home Assistant MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。Home Assistant 官方内置的 MCP Server 集成，把家里暴露的设备与自动化通过 Assist API 交给 AI，用自然语言查询状态、开关设备、触发场景。本地自托管，需长期访问令牌，客户端经 mcp-proxy 连接。

    在实用性与工程自由度上，它采用 Apache-2.0 协议开放源码，可通过 `uvx mcp-proxy --transport=streamablehttp http://homeassistant.local:8123/api/mcp` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Home Assistant MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. The official MCP Server integration built into Home Assistant, exposing your devices and automations through the Assist API so AI can query states, toggle devices and trigger scenes in natural language. Self-hosted and local; needs a long-lived access token, with clients connecting via mcp-proxy.

    Released under the Apache-2.0 license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `uvx mcp-proxy --transport=streamablehttp http://homeassistant.local:8123/api/mcp`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
