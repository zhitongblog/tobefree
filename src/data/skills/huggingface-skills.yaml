review:
  zh: |
    Hugging Face Skills 是面向现代 AI 辅助编程与工作流的开源 AI Agent 技能包（Agent Skill）。Hugging Face 官方开源（Apache-2.0）的技能集，让 Agent 熟练使用 Hub：创建和处理数据集、微调与训练模型、跑评估、发布到 Hub。部分操作需要 Hugging Face 免费账号。

    在实用性与工程自由度上，它采用 Apache-2.0 协议开放源码，可通过 `/plugin marketplace add huggingface/skills` 快速接入，无缝兼容 Claude Code、Codex、Cursor、Gemini CLI 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Hugging Face Skills is an open-source modular AI Agent Skill built for modern AI-assisted development workflows. Official open-source (Apache-2.0) skills from Hugging Face that make agents fluent with the Hub — create and process datasets, fine-tune and train models, run evaluations and publish. Some actions need a free Hugging Face account.

    Released under the Apache-2.0 license, it works across Claude Code, Codex, Cursor, Gemini CLI. You can set it up quickly via `/plugin marketplace add huggingface/skills`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
