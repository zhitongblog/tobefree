review:
  zh: |
    Ableton MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。开源（MIT）的 Ableton Live MCP 服务器，和 Blender MCP 是同一位作者。AI 可以新建音轨、写 MIDI 片段、加载乐器和效果器、控制速度与播放。需要本机装有 Ableton Live（付费软件），MCP 本身免费。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `uvx ableton-mcp` 快速接入，无缝兼容 Claude Desktop、Cursor、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Ableton MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. An open-source (MIT) Ableton Live MCP server from the author of Blender MCP. AI can create tracks, write MIDI clips, load instruments and effects, and control tempo and playback. Requires Ableton Live (paid) on your machine; the MCP itself is free.

    Released under the MIT license, it works across Claude Desktop, Cursor, Any MCP client. You can set it up quickly via `uvx ableton-mcp`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
