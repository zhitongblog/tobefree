review:
  zh: |
    Algorithmic Art 是面向现代 AI 辅助编程与工作流的开源 AI Agent 技能包（Agent Skill）。Anthropic 官方开源（Apache-2.0）技能，让 Claude 用 p5.js 创作带随机种子和可调参数的生成艺术，流场、粒子系统之类都能做，输出可交互的 HTML 页面。

    在实用性与工程自由度上，它采用 Apache-2.0 协议开放源码，无缝兼容 Claude、Claude Code、Claude Desktop 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Algorithmic Art is an open-source modular AI Agent Skill built for modern AI-assisted development workflows. An official open-source (Apache-2.0) skill for generative art in p5.js with seeded randomness and tweakable parameters — flow fields, particle systems and more — delivered as an interactive HTML page.

    Released under the Apache-2.0 license, it works across Claude, Claude Code, Claude Desktop. it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
