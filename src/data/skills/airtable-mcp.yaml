description:
  zh: 开源的 MCP 服务器，让模型检查 Airtable 表结构、读取和写入记录，把 Airtable 当轻量数据库交给 Agent 操作。需要 Airtable 个人访问令牌。
  en: An open-source MCP server that lets the model inspect Airtable schemas and read and write records, handing your Airtable bases to agents as a lightweight database. Requires an Airtable personal access token.
review:
  zh: |
    Airtable MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。开源的 MCP 服务器，让模型检查 Airtable 表结构、读取和写入记录，把 Airtable 当轻量数据库交给 Agent 操作。需要 Airtable 个人访问令牌。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `npx -y airtable-mcp-server` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Airtable MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. An open-source MCP server that lets the model inspect Airtable schemas and read and write records, handing your Airtable bases to agents as a lightweight database. Requires an Airtable personal access token.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `npx -y airtable-mcp-server`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
