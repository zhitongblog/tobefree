review:
  zh: |
    mcpo 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。Open WebUI 团队开源（MIT）的 MCP 转 OpenAPI 代理。一条命令就能把本地 MCP 服务器变成带文档的 HTTP 接口，让 Open WebUI 和各种只认 OpenAPI 的工具、脚本也能用上 MCP 生态。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `uvx mcpo --port 8000 -- your_mcp_server_command` 快速接入，无缝兼容 Open WebUI、Any OpenAPI client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    mcpo is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. An open-source (MIT) MCP-to-OpenAPI proxy from the Open WebUI team. One command turns a local MCP server into a documented HTTP API, so Open WebUI and any OpenAPI-only tool or script can tap the MCP ecosystem.

    Released under the MIT license, it works across Open WebUI, Any OpenAPI client. You can set it up quickly via `uvx mcpo --port 8000 -- your_mcp_server_command`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
