description:
  zh: >-
    Open WebUI 团队开源（MIT）的 MCP 转 OpenAPI 代理。一条命令就能把本地 MCP 服务器变成带文档的 HTTP 接口，让 Open WebUI 和各种只认
    OpenAPI 的工具、脚本也能用上 MCP 生态。
  en: >-
    An open-source (MIT) MCP-to-OpenAPI proxy from the Open WebUI team. One command turns a local
    MCP server into a documented HTTP API, so Open WebUI and any OpenAPI-only tool or script can tap
    the MCP ecosystem.
