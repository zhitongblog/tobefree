tagline:
  zh: 把任意 GitHub 仓库变成 AI 能查的文档服务
  en: Turn any GitHub repo into docs your AI can query
description:
  zh: >-
    免费开源（Apache-2.0）的远程 MCP 服务器。把 github.com 换成 gitmcp.io 就得到一个 MCP 地址，AI 能读取该项目最新的
    README、文档和代码，减少对新库、冷门库的 API 幻觉。不用安装、不用注册，也可以自建。
  en: >-
    A free, open-source (Apache-2.0) remote MCP server. Swap github.com for gitmcp.io and you get an
    MCP endpoint serving the project's latest README, docs and code, cutting hallucinations on new
    or niche libraries. No install, no sign-up, and self-hostable.
review:
  zh: |
    GitMCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。免费开源（Apache-2.0）的远程 MCP 服务器。把 github.com 换成 gitmcp.io 就得到一个 MCP 地址，AI 能读取该项目最新的 README、文档和代码，减少对新库、冷门库的 API 幻觉。不用安装、不用注册，也可以自建。

    在实用性与工程自由度上，它采用 Apache-2.0 协议开放源码，可通过 `https://gitmcp.io/{owner}/{repo}` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Windsurf、VS Code、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    GitMCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. A free, open-source (Apache-2.0) remote MCP server. Swap github.com for gitmcp.io and you get an MCP endpoint serving the project's latest README, docs and code, cutting hallucinations on new or niche libraries. No install, no sign-up, and self-hostable.

    Released under the Apache-2.0 license, it works across Claude, Claude Code, Cursor, Windsurf, VS Code, Any MCP client. You can set it up quickly via `https://gitmcp.io/{owner}/{repo}`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
