description:
  zh: >-
    开源（MIT）的 Excalidraw MCP 服务器，同时附带 Agent 技能和命令行。AI 可以在本地实时画布上添加、排列、修改图形，支持从 Mermaid 转换，导出 PNG /
    SVG / .excalidraw 文件，画架构图和流程图时省掉大量拖拽。
  en: >-
    An open-source (MIT) Excalidraw MCP server that also ships an agent skill and CLI. AI adds,
    arranges and edits shapes on a live local canvas, converts from Mermaid and exports PNG, SVG or
    .excalidraw files — no more manual dragging for architecture and flow diagrams.
