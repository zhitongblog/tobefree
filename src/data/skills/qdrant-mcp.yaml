review:
  zh: |
    Qdrant MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。Qdrant 官方开源（Apache-2.0）的 MCP 服务器，把 Qdrant 向量数据库当作 AI 的语义记忆层：存下代码片段、笔记、文档，再按语义检索回来。接本地 Qdrant 使用，数据不出本机。

    在实用性与工程自由度上，它采用 Apache-2.0 协议开放源码，可通过 `uvx mcp-server-qdrant` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Qdrant MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. Qdrant's official open-source (Apache-2.0) MCP server that uses the Qdrant vector database as a semantic memory layer — store snippets, notes and docs, then retrieve them by meaning. Works with a local Qdrant so data stays on your machine.

    Released under the Apache-2.0 license, it works across Claude, Claude Code, Cursor, Any MCP client. You can set it up quickly via `uvx mcp-server-qdrant`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
