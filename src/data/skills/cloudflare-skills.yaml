review:
  zh: |
    Cloudflare Skills 是面向现代 AI 辅助编程与工作流的开源 AI Agent 技能包（Agent Skill）。Cloudflare 官方开源（Apache-2.0）的技能集，教 Agent 正确使用 Workers、Pages、D1、R2、Durable Objects 等产品，插件版会顺带装好 Cloudflare MCP 服务器。部署到 Cloudflare 需要免费账号。

    在实用性与工程自由度上，它采用 Apache-2.0 协议开放源码，可通过 `/plugin marketplace add cloudflare/skills` 快速接入，无缝兼容 Claude Code、Codex、Cursor、OpenCode 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Cloudflare Skills is an open-source modular AI Agent Skill built for modern AI-assisted development workflows. Cloudflare's official open-source (Apache-2.0) skills teaching agents to use Workers, Pages, D1, R2, Durable Objects and more correctly; the plugin also installs the Cloudflare MCP server. Deploying needs a free Cloudflare account.

    Released under the Apache-2.0 license, it works across Claude Code, Codex, Cursor, OpenCode. You can set it up quickly via `/plugin marketplace add cloudflare/skills`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
