  en: Doist's official open-source MCP server that lets agents create, search, update and complete Todoist tasks and projects in natural language. Use the official hosted HTTP endpoint or self-host from source; requires a Todoist API token.
review:
  zh: |
    Todoist MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。Doist 官方开源的 MCP 服务器，让 Agent 用自然语言创建、查询、更新和完成 Todoist 任务与项目。可用官方托管的 HTTP 端点，也可克隆自建，需要 Todoist API Token。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `claude mcp add --transport http todoist https://ai.todoist.net/mcp` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Todoist MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. Doist's official open-source MCP server that lets agents create, search, update and complete Todoist tasks and projects in natural language. Use the official hosted HTTP endpoint or self-host from source; requires a Todoist API token.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `claude mcp add --transport http todoist https://ai.todoist.net/mcp`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
