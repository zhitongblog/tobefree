  zh: >-
    开源（AGPL-3.0）的记忆型 MCP 服务器。对话里沉淀的知识会写成本地 Markdown 笔记并互相链接，下次对话 AI 能读回来，不用每次重新解释项目背景。文件就在你硬盘上，可以直接用
