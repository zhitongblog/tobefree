description:
  zh: E2B 官方开源的 MCP 服务器，让模型在 E2B 云端沙箱里安全地运行代码。沙箱基于 Firecracker 微虚拟机做硬件级隔离，适合让 Agent 执行不受信任的代码。需要 E2B API Key。
  en: E2B's official open-source MCP server that lets the model run code safely inside an E2B cloud sandbox. Sandboxes use Firecracker microVMs for hardware-level isolation, ideal for letting agents execute untrusted code. Requires an E2B API key.
review:
  zh: |
    E2B MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。E2B 官方开源的 MCP 服务器，让模型在 E2B 云端沙箱里安全地运行代码。沙箱基于 Firecracker 微虚拟机做硬件级隔离，适合让 Agent 执行不受信任的代码。需要 E2B API Key。

    在实用性与工程自由度上，它采用 Apache-2.0 协议开放源码，可通过 `npx -y @e2b/mcp-server` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    E2B MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. E2B's official open-source MCP server that lets the model run code safely inside an E2B cloud sandbox. Sandboxes use Firecracker microVMs for hardware-level isolation, ideal for letting agents execute untrusted code. Requires an E2B API key.

    Released under the Apache-2.0 license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `npx -y @e2b/mcp-server`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
