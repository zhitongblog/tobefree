description:
  zh: Firecrawl 官方的 MCP 服务器，为 Agent 提供网页抓取、批量爬取、站点地图与结构化提取，输出干净的 Markdown。可用官方免费额度，也能自建 Firecrawl 指向本地实例。需要 API Key。
  en: Firecrawl's official MCP server giving agents web scraping, batch crawling, site mapping and structured extraction, output as clean Markdown. Use the hosted free tier or self-host Firecrawl and point it at your own instance. Requires an API key.
review:
  zh: |
    Firecrawl MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。Firecrawl 官方的 MCP 服务器，为 Agent 提供网页抓取、批量爬取、站点地图与结构化提取，输出干净的 Markdown。可用官方免费额度，也能自建 Firecrawl 指向本地实例。需要 API Key。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `npx -y firecrawl-mcp` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Firecrawl MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. Firecrawl's official MCP server giving agents web scraping, batch crawling, site mapping and structured extraction, output as clean Markdown. Use the hosted free tier or self-host Firecrawl and point it at your own instance. Requires an API key.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `npx -y firecrawl-mcp`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
