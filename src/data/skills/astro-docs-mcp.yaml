review:
  zh: |
    Astro Docs MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。由 Astro 官方团队提供的免费、免注册 MCP 服务。大模型经常分不清 Astro 旧版 Content Collections 与新版 Content Layer API，接入此服务后 AI 每次改 Astro 代码前都能实时核对最新官方文档。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `https://mcp.docs.astro.build/mcp` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Windsurf、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Astro Docs MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. Provided free by the Astro team with no API key required, giving coding agents live search over current Astro documentation so they never hallucinate outdated v2/v3 syntax.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Windsurf, Any MCP client. You can set it up quickly via `https://mcp.docs.astro.build/mcp`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
