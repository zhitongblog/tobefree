review:
  zh: |
    ClickHouse MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。ClickHouse 官方开源（Apache-2.0）的 MCP 服务器，让 Agent 列出数据库、查看表结构并执行只读 SQL 查询，还支持用内嵌的 chDB 直接查本地文件。适合让 AI 在大表上跑分析。

    在实用性与工程自由度上，它采用 Apache-2.0 协议开放源码，可通过 `uv run --with mcp-clickhouse mcp-clickhouse` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    ClickHouse MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. ClickHouse's official open-source (Apache-2.0) MCP server. Agents can list databases, inspect schemas and run read-only SQL; embedded chDB can query local files directly. Handy for letting AI run analytics over big tables.

    Released under the Apache-2.0 license, it works across Claude, Claude Code, Cursor, Any MCP client. You can set it up quickly via `uv run --with mcp-clickhouse mcp-clickhouse`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
