  en: A powerful open-source Slack MCP server supporting Stdio/SSE/HTTP transports, DMs and group DMs, and smart history fetch by date or count. Runs via OAuth or a permission-less stealth mode with no app install. Requires a Slack token.
review:
  zh: |
    Slack MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。一个功能强大的开源 Slack MCP 服务器，支持 Stdio/SSE/HTTP 传输、DM 与群 DM、按日期或数量的智能历史抓取，可用 OAuth 或无需安装应用的「隐身」模式运行。需要 Slack 令牌。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `npx -y slack-mcp-server@latest --transport stdio` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Slack MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. A powerful open-source Slack MCP server supporting Stdio/SSE/HTTP transports, DMs and group DMs, and smart history fetch by date or count. Runs via OAuth or a permission-less stealth mode with no app install. Requires a Slack token.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `npx -y slack-mcp-server@latest --transport stdio`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
