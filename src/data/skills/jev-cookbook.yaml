description:
  zh: 国内开源组织 Datawhale 编写的 Jev 系统性中文入门与进阶仓库。通过十余个可运行的 Jupyter Notebook 拆解三大问题原语（布尔、选择、打分），并附带垃圾信息拦截、代码漏洞扫描、智能家居意图路由、工单分级等 18 个可直接复用的实战模板。
  en: A comprehensive Chinese tutorial and recipe collection by Datawhale featuring interactive Jupyter Notebooks and 18 ready-to-run templates for spam detection, vulnerability scanning, smart-home routing and ticket triage.
review:
  zh: |
    Datawhale Jev Cookbook 是面向现代 AI 辅助编程与工作流的开源 AI Agent 技能包（Agent Skill）。国内开源组织 Datawhale 编写的 Jev 系统性中文入门与进阶仓库。通过十余个可运行的 Jupyter Notebook 拆解三大问题原语（布尔、选择、打分），并附带垃圾信息拦截、代码漏洞扫描、智能家居意图路由、工单分级等 18 个可直接复用的实战模板。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `git clone https://github.com/datawhalechina/jev-cookbook.git` 快速接入，无缝兼容 Claude Code、Jupyter、Cursor 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Datawhale Jev Cookbook is an open-source modular AI Agent Skill built for modern AI-assisted development workflows. A comprehensive Chinese tutorial and recipe collection by Datawhale featuring interactive Jupyter Notebooks and 18 ready-to-run templates for spam detection, vulnerability scanning, smart-home routing and ticket triage.

    Released under the MIT license, it works across Claude Code, Jupyter, Cursor. You can set it up quickly via `git clone https://github.com/datawhalechina/jev-cookbook.git`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
