  zh: 国内开源组织 Datawhale 编写的 Jev 系统性中文入门与进阶仓库。通过十余个可运行的 Jupyter Notebook 拆解三大问题原语（布尔、选择、打分），并附带垃圾信息拦截、代码漏洞扫描、智能家居意图路由、工单分级等 18 个可直接复用的实战模板。
  en: A comprehensive Chinese tutorial and recipe collection by Datawhale featuring interactive Jupyter Notebooks and 18 ready-to-run templates for spam detection, vulnerability scanning, smart-home routing and ticket triage.
