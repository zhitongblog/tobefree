    Web Artifacts Builder 是面向现代 AI 辅助编程与工作流的开源 AI Agent 技能包（Agent Skill）。Anthropic 官方开源（Apache-2.0）技能，给 Claude 一套 React、Tailwind CSS、shadcn/ui 的脚手架和打包脚本，用来做带状态管理、多组件的复杂网页小应用，最后打包成单个 HTML 文件。

