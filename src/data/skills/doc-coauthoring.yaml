review:
  zh: |
    Doc Co-authoring 是面向现代 AI 辅助编程与工作流的开源 AI Agent 技能包（Agent Skill）。Anthropic 官方开源（Apache-2.0）技能，把写文档拆成收集背景、逐节打磨、读者视角检验三个阶段，适合写技术方案、PRD、决策文档，避免 AI 一口气吐出一篇空洞长文。

    在实用性与工程自由度上，它采用 Apache-2.0 协议开放源码，无缝兼容 Claude、Claude Code、Claude Desktop 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Doc Co-authoring is an open-source modular AI Agent Skill built for modern AI-assisted development workflows. An official open-source (Apache-2.0) skill that splits writing into context gathering, section-by-section refinement and a reader-perspective check — good for tech specs, PRDs and decision docs instead of one hollow wall of text.

    Released under the Apache-2.0 license, it works across Claude, Claude Code, Claude Desktop. it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
