review:
  zh: |
    Sequential Thinking MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。官方参考实现的 MCP 服务器，提供一套结构化的分步思考工具，支持修正、分支和回溯，帮助模型进行更严谨的反思式推理。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `npx -y @modelcontextprotocol/server-sequential-thinking` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Cline、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Sequential Thinking MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. An official reference MCP server offering a structured step-by-step thinking tool that supports revision, branching and backtracking for more rigorous, reflective reasoning.

    Released under the MIT license, it works across Claude, Claude Code, Cursor, Cline, Any MCP client. You can set it up quickly via `npx -y @modelcontextprotocol/server-sequential-thinking`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
