review:
  zh: |
    Canvas Design 是面向现代 AI 辅助编程与工作流的开源 AI Agent 技能包（Agent Skill）。Anthropic 官方开源（Apache-2.0）技能，先让 Claude 写出一份设计理念，再据此用代码绘制海报、封面等静态视觉作品，输出 PNG 或 PDF，附带一批可商用字体。

    在实用性与工程自由度上，它采用 Apache-2.0 协议开放源码，无缝兼容 Claude、Claude Code、Claude Desktop 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Canvas Design is an open-source modular AI Agent Skill built for modern AI-assisted development workflows. An official open-source (Apache-2.0) skill: Claude first writes a design philosophy, then renders posters, covers and other static visuals in code as PNG or PDF, with a bundled set of fonts.

    Released under the Apache-2.0 license, it works across Claude, Claude Code, Claude Desktop. it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
