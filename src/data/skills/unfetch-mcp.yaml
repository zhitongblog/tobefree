review:
  zh: |
    unfetch 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。unfetch 是我们自研的下载管理器，自带 MCP 服务，让智能体能发起、排队和管理下载任务 —— 轻量、开源、无追踪。

    在实用性与工程自由度上，它采用 Open Source 协议开放源码，无缝兼容 Claude、Claude Code、Cursor、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    unfetch is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. unfetch is our own download manager with a built-in MCP server, letting agents start, queue and manage downloads — lightweight, open source, no tracking.

    Released under the Open Source license, it works across Claude, Claude Code, Cursor, Any MCP client. it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
