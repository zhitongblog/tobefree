description:
  zh: 由 Node.js 技术指导委员会成员 Matteo Collina 开源的轻量级 MCP 服务器。让 Claude Desktop 等原本没有内置高速正则搜代码能力的客户端，直接调用本机 `rg` 命令在毫秒间搜遍整个工程目录。
