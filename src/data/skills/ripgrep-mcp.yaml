review:
  zh: |
    ripgrep MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。由 Node.js 技术指导委员会成员 Matteo Collina 开源的轻量级 MCP 服务器。让 Claude Desktop 等原本没有内置高速正则搜代码能力的客户端，直接调用本机 `rg` 命令在毫秒间搜遍整个工程目录。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，可通过 `npx -y mcp-ripgrep` 快速接入，无缝兼容 Claude Desktop、Claude Code、Cursor、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    ripgrep MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. Created by Node.js TSC member Matteo Collina, this MIT-licensed MCP server gives Claude Desktop and other MCP clients direct access to local `ripgrep` searches.

    Released under the MIT license, it works across Claude Desktop, Claude Code, Cursor, Any MCP client. You can set it up quickly via `npx -y mcp-ripgrep`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
