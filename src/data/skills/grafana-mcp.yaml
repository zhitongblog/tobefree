review:
  zh: |
    Grafana MCP 是面向现代 AI 辅助编程与工作流的开源 MCP 服务（Model Context Protocol Server）。Grafana 官方开源（Apache-2.0）的 MCP 服务器，让 Agent 搜索看板、跑 Prometheus / Loki 查询、查看告警和事故。配合自建的 Grafana 使用，排查线上问题时能少切很多窗口。

    在实用性与工程自由度上，它采用 Apache-2.0 协议开放源码，可通过 `uvx mcp-grafana` 快速接入，无缝兼容 Claude、Claude Code、Cursor、Any MCP client 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Grafana MCP is an open-source Model Context Protocol (MCP) server built for modern AI-assisted development workflows. Grafana's official open-source (Apache-2.0) MCP server. Agents can search dashboards, run Prometheus and Loki queries, and inspect alerts and incidents — works with a self-hosted Grafana and saves a lot of tab-switching during incident triage.

    Released under the Apache-2.0 license, it works across Claude, Claude Code, Cursor, Any MCP client. You can set it up quickly via `uvx mcp-grafana`, and it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
