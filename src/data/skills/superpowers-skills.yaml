review:
  zh: |
    Superpowers Skills 是面向现代 AI 辅助编程与工作流的开源 AI Agent 技能包（Agent Skill）。obra/superpowers 插件配套的社区技能仓库（MIT），收录一批可直接编辑和贡献的 Agent Skill—— 从头脑风暴、写计划到并行子 Agent、代码审查等。想扩展 Superpowers 或参考现成技能写法，从这里入手。

    在实用性与工程自由度上，它采用 MIT 协议开放源码，无缝兼容 Claude Code、Codex、Cursor、Factory Droid、GitHub Copilot CLI 等主流客户端，无广告且不捆绑私有订阅，非常适合作为开发者的日常生产力增强组件。
  en: |
    Superpowers Skills is an open-source modular AI Agent Skill built for modern AI-assisted development workflows. The community skill repository (MIT) that accompanies the obra/superpowers plugin, collecting a set of directly editable, contributable Agent Skills — from brainstorming and writing plans to dispatching parallel sub-agents and code review. A good place to extend Superpowers or study real skill patterns.

    Released under the MIT license, it works across Claude Code, Codex, Cursor, Factory Droid, GitHub Copilot CLI. it ships with zero ads or vendor lock-in, making it a reliable addition to your local agent stack.
